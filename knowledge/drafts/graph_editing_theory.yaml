      - {title: "Sergei Eisenstein: The man, the method, the montage", author: "Videomaker", url: "https://www.videomaker.com/how-to/directing/film-history/sergei-eisenstein-the-man-the-method-the-montage/", locator: "five methods"}

  - id: principle.montage.tonal
    type: principle
    name: Tonal montage
    summary: "Shots are selected and ordered by their dominant emotional tone (light, colour, mood, softness) rather than length. In reels, it governs grouping B-roll by mood and colour so a sequence holds one feeling."
    when_to_use: "Brand stories, mood montages, travel/vlog sequences."
    how: ["Tag clips by mood, brightness and dominant colour", "Build sequences from clips sharing a tone", "Change tone deliberately at a story turn"]
