  # ───────────────────────── Split edits (J/L) ─────────────────────────
  - id: tech.audio.j_cut
    type: technique
    name: J-cut (audio leads picture)
    summary: "The incoming shot's audio starts before its picture, pulling the viewer forward into the next shot. Smooths transitions, introduces a new speaker or scene, and hides picture cuts behind continuous sound."
    when_to_use: "Introducing a new speaker in interviews/podcasts; entering a new scene in vlogs; leading into B-roll from narration."
    how: ["Offset the audio edit earlier than the picture edit", "Start with 6–12 frames for quick dialogue lines and adjust by feel", "Use longer leads (0.5–2 s) for scene changes with ambience or music"]
    parameters: {audio_lead_frames_dialogue: "6–12 @30fps (CapCut guidance; others cite 1–10 or 3–12)", audio_lead_scene_change_s: "0.5–2 (derived, low confidence)"}
    avoid_when: "The audio of the incoming shot would confuse context (two speakers overlapping unintelligibly)."
    genres: [genre.interview, genre.podcast_clip, genre.vlog, genre.brand_story, genre.testimonial]
    goals: [goal.watch_through, goal.clarity]
    uses_capabilities: [cap.audio.split_edit, cap.audio.crossfade]
    conflicts_with: []
    requires: [principle.perception.audio_hides_cuts]
