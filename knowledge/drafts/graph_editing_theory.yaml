  - id: tech.cut.insert_detail
    type: technique
    name: Insert (detail close-up)
    summary: "A tight shot of something inside the scene (hands, screen, product label, ingredient) that shows a detail the main shot cannot. Unlike a cutaway it stays in the same time and place. Essential in vertical tutorials and product reels where small details must be legible on a phone."
    when_to_use: "Tutorials, product demos, unboxings, recipes, any step whose key detail is small."
