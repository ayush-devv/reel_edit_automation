  - id: tech.story.emotional_beat_hold
    type: technique
    name: Hold the emotional beat
    summary: "When a feeling peaks (a confession, a reveal, a laugh), let the shot breathe briefly instead of cutting on schedule; then cut on the shift to the next feeling. It's the one place in short-form where a deliberately longer shot wins."
    when_to_use: "Testimonials, brand stories, transformation reveals, emotional vlogs."
    how: ["Detect emotional peaks (voice, face, words)", "Keep 0.5–1.5 s after the line before cutting (derived)", "Duck music or remove it momentarily to emphasise"]
    parameters: {post_line_hold_s: "0.5–1.5 (derived, low confidence)"}
    avoid_when: "High-energy hype edits where momentum matters more than feeling."
    genres: [genre.testimonial, genre.brand_story, genre.transformation, genre.interview]
    goals: [goal.emotion, goal.trust]
    uses_capabilities: [cap.cut.trim, cap.audio.music_ducking, cap.analysis.face_expression]
    conflicts_with: [anti.rhythm.metronomic_cutting]
    requires: [principle.rhythm.emotional_rhythm]
    evidence_level: theory
    confidence: medium
    sources:
