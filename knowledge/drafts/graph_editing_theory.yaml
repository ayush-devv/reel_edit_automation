  # ───────────────────────── Empirical film cognition ─────────────────────────
  - id: principle.rhythm.shot_length_variation
    type: principle
    name: Vary shot lengths (1/f-like patterning)
    summary: "Analyses of popular films found that shot-length sequences increasingly vary in a 1/f-like pattern resembling fluctuations in human attention, and that this patterning is independent of average shot length. The authors present the attention link as a suggestion; the lesson for reels is to vary durations rather than cut at a fixed interval."
    when_to_use: "Setting durations for montages, B-roll sequences and multi-cut talking heads."
    how: ["Mix short, medium and occasional long shots instead of a constant duration", "Cluster short shots in tension passages and lengthen around payoffs", "Check that no run of more than ~4 shots shares the same length (derived)"]
    parameters: {duration_cv_target: "≥ 0.3 coefficient of variation across a sequence (derived, low confidence)"}
    avoid_when: "A deliberately metronomic effect (strict metric montage, beat-synced trend formats) is the point."
    genres: [genre.montage, genre.event_recap, genre.vlog, genre.brand_story, genre.talking_head]
    goals: [goal.watch_through, goal.energy]
    uses_capabilities: [cap.cut.trim, cap.analysis.shot_detection]
    conflicts_with: [anti.rhythm.metronomic_cutting, principle.montage.metric]
    requires: []
    evidence_level: study
    confidence: medium
    sources:
      - {title: "Pattern in movies mimics that found in our brain (on Cutting, DeLong & Nothelfer 2010, Psychological Science)", author: "Cornell Chronicle", url: "https://news.cornell.edu/node/271563", locator: "news summary"}
      - {title: "Quicker, faster, darker: Changes in Hollywood film over 75 years", author: "Cutting, Brunick, DeLong, Iricinschi & Candan (2011), i-Perception 2(6)", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3485803", locator: "results on 1/f and shot-length fluctuation"}

  - id: principle.rhythm.motion_matches_shot_length
    type: principle
    name: Shorter shots carry more motion
    summary: "In recent Hollywood films, shorter shots tend to contain more motion and longer shots less, an amplifying pairing the authors suggest heightens engagement (strongest in action, weak in drama). Average shot length also fell from about 10 s in the 1930s–40s to under 4 s after 2000."
    when_to_use: "Assigning durations: high-motion B-roll can be cut short; static shots need either more time to read or should be avoided in fast sections."
    how: ["Measure motion energy per clip", "Give high-motion clips short durations in fast sections", "Give low-motion clips longer holds or punch-in movement", "Do not use static frames in rapid sequences"]
    parameters: {fast_section_shot_s: "0.4–1.2 for high-motion B-roll (derived, low confidence)", static_shot_min_s: "≈ 1.5–2.5 to be read (derived, low confidence)"}
    avoid_when: "Dramatic/emotional passages where the coupling is weaker and holds matter more."
    genres: [genre.montage, genre.event_recap, genre.product, genre.vlog]
    goals: [goal.energy, goal.watch_through]
    uses_capabilities: [cap.analysis.motion_detection, cap.cut.trim, cap.transform.punch_in]
    conflicts_with: []
    requires: []
    evidence_level: study
    confidence: medium
    sources:
      - {title: "Quicker, faster, darker: Changes in Hollywood film over 75 years", author: "Cutting, Brunick, DeLong, Iricinschi & Candan (2011), i-Perception 2(6)", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3485803", locator: "results on shot length vs motion"}

  - id: principle.perception.edit_blindness
    type: principle
    name: Edit blindness from continuity cuts
    summary: "Viewers searching for cuts missed match-action cuts about a third of the time versus under a tenth for cuts between unrelated scenes; cuts following continuity rules were hidden best. Most misses were attributed to attention captured by the narrative, not to blinks or saccades."
    when_to_use: "Whenever a cut should feel invisible: trims inside an answer, compressions of action, multi-angle interviews."
    how: ["Cut during motion that continues across the cut", "Keep subject position and screen direction consistent", "Let audio continue across the cut"]
    parameters: {missed_match_action_pct: "≈ 32 (study)", missed_unrelated_scene_pct: "≈ 9 (study)"}
    avoid_when: "You want the cut to be noticed (jump-cut energy, comedic beat, scene change)."
    genres: [genre.interview, genre.testimonial, genre.vlog, genre.tutorial, genre.brand_story]
    goals: [goal.watch_through, goal.trust]
    uses_capabilities: [cap.cut.hard_cut, cap.analysis.motion_detection]
    conflicts_with: []
    requires: []
    evidence_level: study
    confidence: high
    sources:
      - {title: "Edit Blindness: The relationship between attention and global change blindness in dynamic scenes", author: "Smith & Henderson (2008), Journal of Eye Movement Research 2(2)", url: "https://bop.unibe.ch/JEMR/article/view/2264", locator: "abstract; results"}

  - id: principle.perception.audio_hides_cuts
    type: principle
    name: Continuous audio hides cuts
    summary: "In a follow-up study, edit blindness at match-action cuts mostly disappeared when the soundtrack was removed. Continuous sound across a cut is a major reason cuts go unnoticed, which is the empirical basis for carrying dialogue, room tone or music across picture cuts."
    when_to_use: "Every picture cut that should feel seamless, especially jump cuts in talking heads and B-roll overlays."
    how: ["Never let room tone drop to silence at a cut", "Apply 1–3 frame audio crossfades on dialogue edits", "Run music or ambience continuously under picture changes", "Use J/L offsets to stagger audio and picture edits"]
    parameters: {dialogue_crossfade_frames: "1–3 @30fps (practitioner convention, derived)"}
    avoid_when: "A hard sonic break is wanted (shock cut, silence for emphasis)."
    genres: [genre.talking_head, genre.interview, genre.testimonial, genre.podcast_clip, genre.vlog, genre.tutorial]
    goals: [goal.watch_through, goal.trust, goal.clarity]
    uses_capabilities: [cap.audio.crossfade, cap.audio.room_tone_fill, cap.audio.split_edit]
    conflicts_with: [anti.audio.hard_audio_seams]
    requires: []
    evidence_level: study
    confidence: high
    sources:
      - {title: "Match-action: the role of motion and audio in creating global change blindness in film", author: "Smith & Martin-Portugues Santacreu (2017), Media Psychology 20(2)", url: "https://core.ac.uk/display/42135575", locator: "abstract"}
      - {title: "Match-action (repository record)", author: "Birkbeck BIROn", url: "https://eprints.bbk.ac.uk/14904/", locator: "abstract"}

  - id: principle.perception.post_cut_motion
    type: principle
    name: Motion after the cut matters most
    summary: "The same study found removing motion after a match-action cut made cuts easier to detect, while removing motion before the cut had little effect, contrary to editing lore. The incoming shot should open on movement for the cut to feel seamless."
    when_to_use: "Choosing in-points for incoming shots in seamless sequences."
    how: ["Start the incoming shot during movement, not before it", "If the incoming shot is static, add a subtle push-in or start on a gesture", "Pre-cut motion is less critical; prioritise post-cut motion"]
    parameters: {}
    avoid_when: "A static, held composition is the intended reveal."
    genres: [genre.montage, genre.vlog, genre.event_recap, genre.product, genre.brand_story]
    goals: [goal.watch_through, goal.energy]
    uses_capabilities: [cap.analysis.motion_detection, cap.cut.trim, cap.transform.punch_in]
    conflicts_with: []
    requires: []
    evidence_level: study
    confidence: medium
    sources:
      - {title: "Match-action: the role of motion and audio in creating global change blindness in film", author: "Smith & Martin-Portugues Santacreu (2017), Media Psychology 20(2)", url: "https://core.ac.uk/display/42135575", locator: "abstract"}

  - id: principle.perception.kuleshov_effect
    type: principle
    name: Kuleshov effect (context assigns meaning)
    summary: "The same neutral face reads as sad, happy or hungry depending on the shot placed next to it. Replications are mixed (an early null result; later fMRI and behavioural studies found an effect), but current research agrees that surrounding context shifts how faces are interpreted."
    when_to_use: "Testimonials, brand stories, reaction-driven reels; deciding what B-roll sits next to a face."
    how: ["Decide the intended reading of a face before choosing its neighbour shot", "Place emotionally congruent B-roll or context before/after neutral expressions", "Audit for accidental meanings (e.g., neutral face after a product = indifference)"]
    parameters: {}
    avoid_when: "Juxtapositions that misrepresent a real person's reaction (ethics and trust)."
    genres: [genre.testimonial, genre.interview, genre.brand_story, genre.podcast_clip, genre.vlog]
    goals: [goal.emotion, goal.trust]
    uses_capabilities: [cap.cut.reorder, cap.compositing.overlay_broll]
    conflicts_with: []
    requires: []
    evidence_level: study
    confidence: medium
    sources:
      - {title: "Does the Kuleshov Effect Really Exist? Revisiting a Classic Film Experiment on Facial Expressions and Emotional Contexts", author: "Barratt et al. (2016)", url: "https://research.cbs.dk/en/publications/does-the-kuleshov-effect-really-exist-revisiting-a-classic-film-e-2/", locator: "abstract"}
      - {title: "Kuleshov effect", author: "Wikipedia", url: "https://en.wikipedia.org/wiki/Kuleshov_effect", locator: "replications (Prince & Hensley 1992; Mobbs et al. 2006)"}
      - {title: "How context influences our perception of emotional faces (Kuleshov effect behavioural study)", author: "Frontiers in Psychology (2017)", url: "https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2017.01684/full", locator: "introduction; results"}

  - id: tech.montage.kuleshov_juxtaposition
    type: technique
    name: Context juxtaposition for faces
    summary: "Applied Kuleshov: place a shot of what the speaker is talking about (or a story-relevant image) right before or after a pause on their face, so the face inherits the meaning. Turns a flat reaction into an emotional beat."
    when_to_use: "Testimonials (before/after product), brand stories, emotional vlogs, podcast clips with listener reactions."
    how: ["Find a neutral/held face moment of 0.5–1.5 s", "Precede it with the subject of the emotion (memory image, product, result)", "Keep audio continuous across the pair"]
    parameters: {face_hold_s: "0.5–1.5 (derived, low confidence)"}
    avoid_when: "It would imply a reaction the person did not have (misleading testimonial)."
    genres: [genre.testimonial, genre.brand_story, genre.vlog, genre.podcast_clip]
    goals: [goal.emotion, goal.trust]
    uses_capabilities: [cap.cut.reorder, cap.compositing.overlay_broll, cap.audio.split_edit]
