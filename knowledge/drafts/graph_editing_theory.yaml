  # ───────────────────────── Eisenstein: methods of montage ─────────────────────────
  - id: principle.montage.metric
    type: principle
    name: Metric montage
    summary: "Eisenstein's simplest method: cut by absolute shot length, like musical measures, regardless of content. Shortening the measure raises intensity. In reels this is strict beat-locked cutting."
    when_to_use: "Beat-synced trend edits, hype intros, short bursts (2–6 s) of montage."
    how: ["Detect the music tempo", "Cut every N beats (1, 2 or 4)", "Shorten N toward the climax", "Limit to bursts; then switch to rhythmic montage"]
    parameters: {cut_every_beats: "1, 2 or 4", burst_length_s: "2–6 (derived, low confidence)"}
    avoid_when: "Content inside shots fights the grid (a gesture cut mid-way), or for long stretches (feels mechanical)."
    genres: [genre.montage, genre.event_recap, genre.product]
    goals: [goal.energy]
    uses_capabilities: [cap.analysis.beat_detection, cap.audio.music_beat_sync, cap.cut.hard_cut]
    conflicts_with: [principle.rhythm.shot_length_variation]
    requires: []
    evidence_level: theory
    confidence: medium
    sources:
      - {title: "Eisenstein's methods of montage (course notes)", author: "Chicago Media Works", url: "https://chicagomediaworks.com/2instructworks/3editing_doc/3editingeisenstein.html", locator: "metric montage"}
      - {title: "Soviet montage theory types", author: "PremiumBeat", url: "https://www.premiumbeat.com/blog/soviet-montage-theory-types", locator: "metric"}

  - id: principle.montage.rhythmic
    type: principle
    name: Rhythmic montage
    summary: "Shot length is set by both the measure and the movement inside the frame, so cuts land with on-screen action. This is the best default for beat-driven reels: cut near the beat but on the frame where motion peaks or completes."
    when_to_use: "Music-driven montages, event recaps, product B-roll sequences."
    how: ["Snap candidate cuts to beats", "Slide each cut a few frames to the nearest motion peak", "Let movement direction carry across the cut"]
    parameters: {beat_snap_tolerance_frames: "±2–4 @30fps (derived, low confidence)"}
    avoid_when: "Dialogue-led sections where speech, not music, sets rhythm."
    genres: [genre.montage, genre.event_recap, genre.product, genre.vlog]
    goals: [goal.energy, goal.watch_through]
    uses_capabilities: [cap.analysis.beat_detection, cap.analysis.motion_detection, cap.audio.music_beat_sync]
    conflicts_with: []
    requires: []
