  - id: anti.rhythm.metronomic_cutting
    type: anti_pattern
    name: Metronomic cutting
    summary: "Every shot the same length (e.g., a cut every beat for 30 s). It removes tension/release, ignores content and motion, and contradicts the varied shot-length patterns found in engaging films."
    when_to_use: "Detect: low variance in shot durations across a sequence longer than ~6 s."
    how: ["Vary durations; switch metric bursts to rhythmic cutting", "Insert longer holds at payoffs"]
    parameters: {flag_if_duration_cv_below: "0.15 over ≥ 8 shots (derived, low confidence)"}
    avoid_when: "Deliberate trend formats explicitly built on a fixed beat grid, kept short."
    genres: [genre.montage, genre.event_recap, genre.product]
    goals: [goal.watch_through]
    uses_capabilities: [cap.analysis.shot_detection]
    conflicts_with: [principle.rhythm.shot_length_variation, principle.rhythm.tension_release]
    requires: []
    evidence_level: theory
    confidence: medium
    sources:
      - {title: "Quicker, faster, darker: Changes in Hollywood film over 75 years", author: "Cutting et al. (2011), i-Perception", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3485803", locator: "shot-length fluctuation"}
      - {title: "Cutting Rhythms, Ch. 3: Timing, Pacing, and Trajectory Phrasing", author: "Karen Pearlman", url: "https://www.oreilly.com/library/view/cutting-rhythms/9780240810140/10_ch03.xhtml", locator: "Chapter 3"}

  - id: anti.continuity.axis_flip
    type: anti_pattern
    name: Accidental axis flip
    summary: "Cutting between camera angles (or mirrored/reframed crops) that put a speaker facing the opposite direction, making people seem to swap places. Common when auto-reframing multi-cam podcasts to 9:16 or mirroring selfie footage."
    when_to_use: "Detect: a speaker's facing direction changes across a cut with no bridge shot."
    how: ["Pick the angle that keeps facing consistent", "Insert a neutral/frontal shot as a bridge", "Undo unintended horizontal flips"]
    parameters: {}
    avoid_when: "Deliberate disorientation."
    genres: [genre.interview, genre.podcast_clip, genre.vlog]
    goals: [goal.clarity]
