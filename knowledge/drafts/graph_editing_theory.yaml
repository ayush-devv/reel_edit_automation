  # ───────────────────────── Jump cuts ─────────────────────────
  - id: tech.cut.jump_cut_talking_head
    type: technique
    name: Jump cut for compression (talking head)
    summary: "Remove pauses, filler words and retakes from a single continuous shot, letting the subject visibly skip. Once a classical error, it is now the native grammar of YouTube and short-form talking heads because it compresses time and raises energy."
    when_to_use: "Single-camera talking heads, tutorials, podcast clips, vlogs to camera."
    how: ["Transcribe and mark fillers, false starts, long pauses", "Cut them out, keeping breaths only where needed for natural cadence", "Crossfade audio 1–3 frames at each cut", "Vary the look of successive jumps (punch-in, B-roll) so they don't all feel identical"]
    parameters: {max_pause_kept_ms: "150–300 (practitioner convention, derived)", audio_crossfade_frames: "1–3 @30fps"}
    avoid_when: "Emotional testimonial moments where pauses carry meaning; trust-led brand pieces needing calm."
    genres: [genre.talking_head, genre.tutorial, genre.podcast_clip, genre.vlog]
    goals: [goal.watch_through, goal.energy, goal.retention_first_3s]
    uses_capabilities: [cap.cut.ripple_delete, cap.analysis.silence_detection, cap.analysis.speech_transcript, cap.audio.crossfade]
