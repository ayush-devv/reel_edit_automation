  # ───────────────────────── Story structure ─────────────────────────
  - id: principle.story.setup_payoff
    type: principle
    name: Setup and payoff
    summary: "Plant a detail early that becomes significant later. Unpaid setups disappoint; payoffs without setups feel cheap. Spacing matters: too close feels obvious, too far is forgotten. Short-form compresses this to seconds."
    when_to_use: "Any reel with a reveal, punchline, transformation or twist."
    how: ["Identify the payoff first, then find or create its setup", "Plant the setup in the first 1–3 s (often the hook)", "Pay it off visibly and close to the end", "Cut any planted element that has no payoff"]
    parameters: {setup_by_s: "≤ 3 for 15–60 s reels (derived)"}
    avoid_when: "Pure list/tips content without a narrative arc."
    genres: [genre.transformation, genre.brand_story, genre.vlog, genre.tutorial, genre.product]
    goals: [goal.watch_through, goal.rewatch, goal.emotion]
    uses_capabilities: [cap.cut.reorder, cap.text.title]
    conflicts_with: [anti.story.unclosed_loop, anti.story.unearned_payoff]
    requires: []
    evidence_level: theory
    confidence: high
    sources:
      - {title: "How to Put Setups and Payoffs in Your Scripts", author: "Final Draft", url: "https://www.finaldraft.com/blog/how-to-put-setups-and-payoffs-in-your-scripts", locator: "full article"}
      - {title: "Setup and Payoff", author: "dsebastien concepts", url: "https://concepts.dsebastien.net/concept/setup-and-payoff/", locator: "spacing and pitfalls"}
      - {title: "Chekhov's gun", author: "StudioBinder", url: "https://www.studiobinder.com/blog/chekhovs-gun/", locator: "definition"}

  - id: principle.story.open_loop
    type: principle
    name: Open loops (curiosity gap)
    summary: "Curiosity rises when people notice a gap between what they know and want to know, provided the gap seems closable (Loewenstein's information-gap theory). Reels apply it by posing a question early and withholding the answer. The link to the Zeigarnik effect is an applied-design claim, not directly tested."
    when_to_use: "Hooks, mid-reel re-hooks, tutorials and stories where the answer can be delayed."
    how: ["Pose a specific question or show an unexplained result in the hook", "Delay the answer, but show progress toward it", "Close the loop before the end; optionally open a smaller one at the close"]
    parameters: {loop_open_by_s: "≤ 2 (derived)", loop_close_before_end_s: "≥ 1 before CTA (derived, low confidence)"}
    avoid_when: "The answer is trivial or never delivered (clickbait damages trust)."
    genres: [genre.tutorial, genre.transformation, genre.vlog, genre.talking_head, genre.product, genre.brand_story]
    goals: [goal.retention_first_3s, goal.watch_through]
    uses_capabilities: [cap.cut.reorder, cap.text.title]
    conflicts_with: [anti.story.unclosed_loop]
    requires: []
    evidence_level: theory
    confidence: medium
    sources:
      - {title: "Information Gap Theory (summary of Loewenstein 1994, Psychological Bulletin)", author: "dsebastien concepts", url: "https://concepts.dsebastien.net/concept/information-gap-theory/", locator: "definition and criticisms"}

  - id: principle.story.suspense_vs_surprise
    type: principle
    name: Suspense vs surprise
    summary: "Hitchcock contrasted a bomb exploding unannounced (a brief surprise) with an audience who knows about the bomb (sustained suspense). Telling viewers more than the subject knows converts seconds of shock into a stretch of tension. Bordwell notes the formulation is ambiguous and not wholly original."
    when_to_use: "Pranks, reveals, challenges, before/after reels: show the viewer what is coming, then make them wait."
    how: ["Reveal the 'bomb' (the stakes or the coming event) early", "Cut back to it periodically during the wait", "Deliver the payoff with the subject's reaction"]
    parameters: {}
    avoid_when: "The content's only value is the surprise itself (save it for the end, but plant a hint)."
    genres: [genre.vlog, genre.transformation, genre.brand_story, genre.event_recap]
    goals: [goal.watch_through, goal.emotion]
    uses_capabilities: [cap.cut.reorder, cap.cut.hard_cut]
    conflicts_with: []
