  - id: principle.rhythm.editor_as_first_audience
    type: principle
    name: Editor as first audience
    summary: "Pearlman treats editing intuition as trained, embodied skill and the editor as the film's first audience. For an autonomous editor this means simulating a viewer's attention and feeling on each pass rather than applying rules mechanically."
    when_to_use: "Review passes; deciding whether a rule-compliant cut actually works."
    how: ["After assembling, run a 'first-viewer' review pass that scores attention dips and confusion points", "Prefer revisions that fix felt problems over rule violations no one would notice", "Iterate: sense, hypothesise, adjust"]
