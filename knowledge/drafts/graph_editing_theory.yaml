  # ───────────────────────── Parallel editing, match cuts, pacing ─────────────────────────
  - id: tech.cut.cross_cutting
    type: technique
    name: Cross-cutting / parallel editing
    summary: "Alternate between two or more lines of action, building suspense by leaving each briefly unresolved or creating meaning through contrast. Terminology is inconsistent across sources (which term means simultaneous action vs multi-storyline structure), so the graph treats them as one technique."
    when_to_use: "Before/after or two-perspective stories, process vs result, 'meanwhile' event recaps, brand stories contrasting problem and solution."
    how: ["Define two threads with a clear relation (race, contrast, convergence)", "Alternate with shrinking segment lengths toward the convergence", "Resolve both threads at the payoff, ideally in one shot or a match cut"]
    parameters: {segment_shrink_ratio: "≈ 0.6–0.8 per alternation toward climax (derived, low confidence)"}
    avoid_when: "Under ~15 s total, where two threads can't be established; viewers can't tell the threads apart visually."
    genres: [genre.brand_story, genre.transformation, genre.event_recap, genre.vlog]
    goals: [goal.watch_through, goal.emotion]
    uses_capabilities: [cap.cut.reorder, cap.cut.hard_cut, cap.graphics.split_screen]
