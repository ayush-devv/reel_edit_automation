  - id: tech.transition.graphic_match
    type: technique
    name: Graphic match cut
    summary: "Cut between two shots that share shape, colour, composition or movement, so the image appears to transform. Usually noticeable on purpose, it implies a link or metaphor between the two subjects. Popular in reels as seamless 'transition' cuts."
    when_to_use: "Transformations, travel montages, brand stories linking product to lifestyle, outfit/room changes."
