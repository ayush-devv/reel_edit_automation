      - {title: "What is continuity editing in film?", author: "Adobe", url: "https://www.adobe.com/creativecloud/video/hub/ideas/what-is-continuity-editing-in-film", locator: "match on action"}

  - id: tech.cut.cut_in_movement
    type: technique
    name: Cut in movement
    summary: "Dmytryk's rule to cut while something is moving: a gesture, head turn, camera move or object motion. Movement masks the cut and keeps energy up. In talking heads, cut on a hand gesture, nod or head turn rather than on a frozen face."
    when_to_use: "Talking-head trims, B-roll transitions, whip/motion-led transitions, montages."
    how: ["Detect motion peaks near candidate cut points", "Prefer cut points during gestures or camera moves", "For transitions, match movement direction between outgoing and incoming shots"]
    parameters: {search_window_frames: "±6 around the speech-based cut point @30fps (derived, low confidence)"}
    avoid_when: "The movement is the payoff and must be seen whole."
    genres: [genre.talking_head, genre.vlog, genre.montage, genre.event_recap, genre.product]
    goals: [goal.energy, goal.watch_through]
    uses_capabilities: [cap.analysis.motion_detection, cap.cut.trim, cap.transition.whip_pan]
    conflicts_with: []
    requires: []
