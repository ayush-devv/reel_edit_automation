  - id: anti.cut.unmotivated_cut
    type: anti_pattern
    name: Unmotivated cut
    summary: "Cutting because a timer says so, or to look busy, with no new information, reaction or rhythm reason. Fragments attention and weakens trust in the edit."
    when_to_use: "Detect in review: any cut without a reason code."
    how: ["Remove or merge the cut", "Or give it a motivation (gesture, word, beat)"]
    parameters: {}
    avoid_when: ""
    genres: [genre.talking_head, genre.testimonial, genre.interview, genre.tutorial, genre.brand_story]
