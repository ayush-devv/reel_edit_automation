  - id: principle.montage.intellectual
    type: principle
    name: Intellectual montage (collision of ideas)
    summary: "Two shots juxtaposed produce an idea neither contains alone (A + B = C). In reels: before/after, expectation vs reality, claim vs proof, or contrast cuts that make an argument without narration."
    when_to_use: "Transformations, comparison reels, satire, brand stories with a thesis, product problem/solution."
    how: ["Pair shots that conflict on one clear dimension", "Keep framing similar so the difference is the message", "Hold each half long enough to be read (≥ ~1 s)"]
    parameters: {min_hold_each_s: "≈ 1 (derived, low confidence)"}
    avoid_when: "The audience lacks the context to decode the juxtaposition."
    genres: [genre.transformation, genre.product, genre.brand_story, genre.montage]
    goals: [goal.clarity, goal.shares_saves, goal.brand_recall]
    uses_capabilities: [cap.cut.reorder, cap.graphics.split_screen, cap.transition.match_cut]
    conflicts_with: []
