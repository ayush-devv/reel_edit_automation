  - id: anti.cut.continuity_over_emotion
    type: anti_pattern
    name: Choosing continuity over emotion
    summary: "Picking the cleaner, better-matched take or cut point over the one with truer emotion. Murch and Dmytryk both rank drama above matching, and viewers absorbed in content rarely notice small mismatches."
    when_to_use: "Detect in take selection: a weaker performance chosen only for match quality."
