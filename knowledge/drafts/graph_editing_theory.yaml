  - id: tech.rhythm.accelerating_cut_rate
    type: technique
    name: Accelerate cut rate toward the climax
    summary: "Progressively shorten shots as a sequence nears its peak, as Griffith did in his rescue cross-cuts and as Eisenstein's metric montage prescribes. Then release with a longer hold on the payoff."
    when_to_use: "Build-ups before reveals, transformations, product launches, event recaps."
    how: ["Plan a build segment of 3–8 s before the payoff (derived)", "Shorten each successive shot", "Cut to the payoff on a strong beat and hold it 1.5–3 s (derived)"]
    parameters: {build_s: "3–8 (derived, low confidence)", payoff_hold_s: "1.5–3 (derived, low confidence)"}
    avoid_when: "Calm, trust-building content; reels already cutting near the minimum readable shot length."
    genres: [genre.transformation, genre.montage, genre.event_recap, genre.product, genre.brand_story]
    goals: [goal.energy, goal.emotion, goal.watch_through]
    uses_capabilities: [cap.cut.trim, cap.analysis.beat_detection, cap.speed.ramp]
