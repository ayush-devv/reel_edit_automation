  - id: principle.montage.overtonal
    type: principle
    name: Overtonal montage
    summary: "A combination of metric, rhythmic and tonal considerations, weighing all of a shot's appeals at once. Sources differ on details; practically it means good sequences balance length, motion and mood together."
    when_to_use: "Final polish of montage sequences after a rhythmic/tonal pass."
