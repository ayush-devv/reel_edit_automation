  - id: tech.cut.reaction_shot
    type: technique
    name: Reaction shot
    summary: "Cut to a listener or audience reacting to what is said or shown. The reaction tells viewers how to feel, gives emotional beats room to land, and hides edits in the speaker's track."
    when_to_use: "Podcast clips, interviews, pranks/reveals, event recaps, testimonials with an interviewer or family member present."
