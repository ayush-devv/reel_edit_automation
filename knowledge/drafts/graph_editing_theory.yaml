# Core film/video editing theory, adapted to vertical short-form (Reels / Shorts / TikTok).
# Paraphrased from cited sources; no copied passages. Book claims are via publisher pages,
# reviews and film-school summaries unless noted. Reel-specific numbers derived by the
# researcher (not stated in the source) are marked with lower confidence.
nodes:

  # ───────────────────────── Murch: Rule of Six & blink theory ─────────────────────────
  - id: principle.cut.emotion_first
    type: principle
    name: Cut for emotion first
    summary: "The best cut is the one that preserves how the viewer should feel at that moment. Murch ranks emotion above story, rhythm, eye-trace and spatial continuity, weighting it at roughly half of a cut's value, so a technically imperfect cut that keeps the feeling beats a clean one that loses it."
    when_to_use: "Every cut decision; especially choosing between takes in testimonials, interviews and brand stories where sincerity matters more than polish."
    how: ["For each candidate cut point ask what the viewer should feel right after it", "Prefer the take/moment with the truest expression even if framing or continuity is slightly off", "When two cuts tie on emotion, break the tie with story, then rhythm"]
    parameters: {murch_weights_pct: "emotion 51, story 23, rhythm 10, eye_trace 7, 2D plane 5, 3D space 4 (rhetorical weights, not measurements)"}
    avoid_when: "Never fully; but in purely informational tutorials clarity (story) may dominate."
    genres: [genre.testimonial, genre.interview, genre.brand_story, genre.talking_head, genre.vlog, genre.podcast_clip]
    goals: [goal.emotion, goal.trust, goal.watch_through]
    uses_capabilities: [cap.cut.trim, cap.analysis.speech_transcript, cap.analysis.face_expression]
    conflicts_with: [anti.cut.continuity_over_emotion]
    requires: []
    evidence_level: theory
    confidence: high
    sources:
      - {title: "6 'Rules' for Good Cutting According to Oscar-Winning Editor Walter Murch", author: "No Film School", url: "https://nofilmschool.com/2016/11/6-rules-good-cutting-according-oscar-winning-editor-walter-murch", locator: "Rule of Six; emotion section"}
      - {title: "The Walter Murch-opedia", author: "Jonny Elwyn", url: "https://jonnyelwyn.co.uk/film-and-video-editing/the-walter-murch-opedia/", locator: "More on the Rule of Six"}

  - id: principle.cut.rule_of_six_priority
    type: principle
    name: Rule of Six sacrifice order
    summary: "Murch's six cut criteria (emotion, story, rhythm, eye-trace, 2D screen plane, 3D space) form a priority list. When a cut cannot satisfy all six, give up criteria from the bottom of the list upward, and never trade emotion or story for spatial or planar correctness."
    when_to_use: "Resolving trade-offs when the agent scores alternative cut points or takes."
    how: ["Score each candidate cut on all six criteria", "Discard candidates that fail emotion or story", "Among survivors prefer rhythm, then eye-trace, then 2D/3D continuity", "Use this as the agent's tie-break ordering"]
    parameters: {sacrifice_order: "3D space → 2D plane → eye-trace → rhythm → story → emotion (last)"}
    avoid_when: "Do not treat the percentages as a literal scoring formula; they express priority, not measured effect sizes."
    genres: [genre.talking_head, genre.testimonial, genre.interview, genre.vlog, genre.montage, genre.brand_story]
    goals: [goal.emotion, goal.clarity, goal.watch_through]
    uses_capabilities: [cap.cut.trim, cap.analysis.shot_detection]
    conflicts_with: []
    requires: [principle.cut.emotion_first]
    evidence_level: theory
    confidence: high
    sources:
      - {title: "6 'Rules' for Good Cutting According to Oscar-Winning Editor Walter Murch", author: "No Film School", url: "https://nofilmschool.com/2016/11/6-rules-good-cutting-according-oscar-winning-editor-walter-murch", locator: "what to sacrifice first"}
      - {title: "Walter Murch rule of six", author: "StudioBinder", url: "https://www.studiobinder.com/blog/walter-murch-rule-of-six/", locator: "full article"}

  - id: principle.cut.eye_trace
    type: principle
    name: Eye-trace continuity
    summary: "Track where the viewer is looking just before a cut and place the next shot's point of interest near that spot, so the eye does not hunt. On a small vertical phone screen with very short shots, eye-trace arguably matters more than Murch's low ranking implies."
    when_to_use: "Fast montages, punch-ins, B-roll overlays, any cut sequence under ~1.5 s per shot; reframed 16:9→9:16 footage."
    how: ["Detect the salient point (face/eyes/hands/product) at the out-frame", "Reframe or pick the next shot so its salient point lands within the same screen region", "Keep faces in the upper third of a 9:16 frame consistently across cuts", "If the focus must move, lead it with motion or a caption"]
    parameters: {max_focus_jump: "≈ ⅓ of frame width between consecutive shots (derived, low confidence)"}
    avoid_when: "Deliberate disorientation or a jarring reveal is the intent."
    genres: [genre.montage, genre.product, genre.event_recap, genre.talking_head, genre.vlog]
    goals: [goal.clarity, goal.watch_through, goal.retention_first_3s]
    uses_capabilities: [cap.analysis.face_tracking, cap.analysis.saliency, cap.transform.reframe, cap.transform.punch_in]
    conflicts_with: []
    requires: []
    evidence_level: theory
    confidence: medium
    sources:
      - {title: "The Walter Murch-opedia", author: "Jonny Elwyn", url: "https://jonnyelwyn.co.uk/film-and-video-editing/the-walter-murch-opedia/", locator: "Rule of Six (eye-trace)"}
      - {title: "Editing with an Eye-trace in Mind: Is the Rule of Six Incorrect?", author: "Piotr Toczyński, No Film School", url: "https://nofilmschool.com/2018/08/editing-eye-trace-mind-rule-six-incorrect", locator: "argument on small screens and short shots"}

  - id: principle.perception.blink_punctuation
    type: principle
    name: Cuts as blinks (thought punctuation)
    summary: "Murch proposes that blinks mark the end of a thought, so a cut placed where a viewer or performer would naturally blink feels like punctuation. Lab studies show viewer blinks cluster at low-information moments (end of an action, character exits) but were not tied directly to scene breaks, so treat this as a guiding metaphor."
    when_to_use: "Choosing exact cut frames in talking-head and interview material: end of a sentence/idea, after the speaker blinks or exhales."
    how: ["Cut at the end of a complete thought rather than mid-idea", "Use speaker blinks or breaths near phrase ends as candidate out-points", "Avoid cutting while key information is still on screen"]
    parameters: {cut_offset_after_phrase_end: "0–4 frames @30fps (derived, low confidence)"}
    avoid_when: "Comedic or energetic edits that intentionally cut mid-thought; music-led montages."
    genres: [genre.talking_head, genre.interview, genre.podcast_clip, genre.testimonial]
    goals: [goal.clarity, goal.watch_through]
    uses_capabilities: [cap.analysis.blink_detection, cap.analysis.speech_transcript, cap.cut.trim]
    conflicts_with: []
    requires: []
    evidence_level: theory
    confidence: low
    sources:
      - {title: "The Walter Murch-opedia", author: "Jonny Elwyn", url: "https://jonnyelwyn.co.uk/film-and-video-editing/the-walter-murch-opedia/", locator: "blink theory summary"}
      - {title: "Synchronization of spontaneous eyeblinks while viewing video stories", author: "Nakano et al. (2009), Proc. R. Soc. B", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC2817301", locator: "abstract; results"}
      - {title: "Nakano & Kitazawa (2010), eyeblink entrainment study", author: "Nakano & Kitazawa (2010), Exp. Brain Res.", url: "https://link.springer.com/doi/10.1007/s00221-010-2387-z", locator: "abstract"}

  # ───────────────────────── Dmytryk: rules of cutting ─────────────────────────
  - id: principle.cut.positive_reason
    type: principle
    name: Never cut without a positive reason
    summary: "Dmytryk's first rule: every cut must be motivated by something the audience needs (new information, a reaction, a change of energy). Cutting only because a shot feels long, or for activity's sake, weakens the film."
    when_to_use: "All genres; auditing an agent-generated edit list for unnecessary cuts."
    how: ["Attach a reason code to every cut (info, reaction, emphasis, rhythm, compression)", "Remove cuts with no reason code", "In reels, 'compression of dead air' is a valid reason"]
    parameters: {}
    avoid_when: "Never ignore; but in beat-driven montage the music phrase itself can be the reason."
    genres: [genre.talking_head, genre.testimonial, genre.interview, genre.tutorial, genre.vlog, genre.brand_story, genre.montage]
    goals: [goal.clarity, goal.watch_through]
    uses_capabilities: [cap.cut.hard_cut]
    conflicts_with: [anti.cut.unmotivated_cut]
    requires: []
    evidence_level: theory
    confidence: high
    sources:
      - {title: "What You Can Learn from Edward Dmytryk's 7 Rules of Cutting", author: "New York Film Academy", url: "https://www.nyfa.edu/student-resources/what-you-can-learn-from-edward-dmytryks-7-rules-of-cutting/", locator: "rule 1"}
      - {title: "Seven rules for film and video editors", author: "ProVideo Coalition", url: "https://www.provideocoalition.com/seven_rules_for_film_and_video_editors/", locator: "rule list"}

  - id: principle.cut.cut_long_when_unsure
    type: principle
    name: When unsure, cut long rather than short
    summary: "Dmytryk advises erring toward a slightly longer shot when the exact frame is uncertain, because extra frames can be trimmed later but a too-short cut loses meaning. Reels invert the default (tight is expected), so apply this to the rough cut and to emotional holds, not to final pacing of dead air."
    when_to_use: "First assembly; reaction holds and emotional beats in testimonials; any moment where the payoff needs time to register."
    how: ["Leave 4–8 frame handles in the assembly", "Tighten in a second pass driven by rhythm checks", "Keep longer holds only on emotional peaks or payoff frames"]
    parameters: {assembly_handle_frames: "4–8 @30fps (derived, low confidence)"}
    avoid_when: "Final pass on talking-head dead air, filler words, or pre-hook setup in the first 3 s."
    genres: [genre.testimonial, genre.interview, genre.brand_story, genre.talking_head]
    goals: [goal.emotion, goal.clarity]
    uses_capabilities: [cap.cut.trim]
    conflicts_with: [tech.cut.jump_cut_talking_head]
    requires: []
    evidence_level: theory
    confidence: medium
    sources:
      - {title: "What You Can Learn from Edward Dmytryk's 7 Rules of Cutting", author: "New York Film Academy", url: "https://www.nyfa.edu/student-resources/what-you-can-learn-from-edward-dmytryks-7-rules-of-cutting/", locator: "rule 2"}
      - {title: "On Film Editing (Routledge reissue)", author: "Edward Dmytryk", url: "https://www.routledge.com/products/9780429506086", locator: "publisher description"}

  - id: principle.cut.fresh_over_stale
    type: principle
    name: Fresh is preferable to stale
    summary: "Dmytryk favours showing the viewer something new over repeating what they've already absorbed. In reels, every shot or angle change should add new visual information; reusing the same framing for long stretches makes attention decay."
    when_to_use: "Talking heads longer than ~5 s, tutorials with repeated steps, vlogs."
    how: ["Introduce a new angle, scale, B-roll or graphic when the current image has been fully read", "Do not reuse the same B-roll clip twice unless as a deliberate callback", "Prefer showing a new location before the subject arrives"]
    parameters: {max_static_hold_s: "≈ 3–5 s on an unchanged frame in talking-head reels (derived, low confidence)"}
    avoid_when: "A long take is itself the point (one-shot performance, authenticity-led testimonial)."
    genres: [genre.talking_head, genre.tutorial, genre.vlog, genre.podcast_clip]
    goals: [goal.watch_through, goal.energy]
    uses_capabilities: [cap.transform.punch_in, cap.compositing.overlay_broll, cap.cut.hard_cut]
    conflicts_with: []
    requires: []
    evidence_level: theory
    confidence: medium
    sources:
      - {title: "What You Can Learn from Edward Dmytryk's 7 Rules of Cutting", author: "New York Film Academy", url: "https://www.nyfa.edu/student-resources/what-you-can-learn-from-edward-dmytryks-7-rules-of-cutting/", locator: "rule 4"}

  - id: principle.cut.values_over_matches
    type: principle
    name: Proper values over proper matches
    summary: "Dmytryk ranks dramatic value above perfect continuity: a small mismatch is acceptable if the shot plays better. Viewers rarely notice mismatches when engaged in the content."
    when_to_use: "Choosing between a well-matched but flat take and a stronger but mismatched one; hand position, cup level or lighting drift in interviews."
    how: ["Prefer the stronger performance", "Hide visible mismatches with motion at the cut, a punch-in, or a cutaway", "Only fix mismatches that change meaning (e.g., text on screen, product state)"]
    parameters: {}
    avoid_when: "Product/tutorial shots where the mismatch misinforms (wrong step order, wrong product variant)."
    genres: [genre.testimonial, genre.interview, genre.brand_story, genre.talking_head]
    goals: [goal.emotion, goal.trust]
    uses_capabilities: [cap.cut.trim, cap.transform.punch_in, cap.compositing.overlay_broll]
    conflicts_with: [anti.cut.continuity_over_emotion]
    requires: []
    evidence_level: theory
    confidence: high
    sources:
      - {title: "What You Can Learn from Edward Dmytryk's 7 Rules of Cutting", author: "New York Film Academy", url: "https://www.nyfa.edu/student-resources/what-you-can-learn-from-edward-dmytryks-7-rules-of-cutting/", locator: "rule 6 (Murder, My Sweet example)"}
      - {title: "Edit Blindness: The relationship between attention and global change blindness in dynamic scenes", author: "Smith & Henderson (2008), Journal of Eye Movement Research 2(2)", url: "https://bop.unibe.ch/JEMR/article/view/2264", locator: "abstract"}

  - id: tech.cut.begin_end_on_action
    type: technique
    name: Enter and exit on continuing action
    summary: "Dmytryk advises starting and ending scenes while something is already moving. For reels this means starting mid-action or mid-sentence (no wind-up, no 'hey guys') and leaving a segment before motion fully stops."
    when_to_use: "Opening frame of any reel; segment boundaries in vlogs and montages."
    how: ["Trim the first frames to where motion or speech is already under way", "Cut out of a segment while the action is still resolving, not after it fully stops", "Avoid static first frames"]
    parameters: {first_frame_motion: "speech or visible motion within 0–5 frames of start (derived, low confidence)"}
    avoid_when: "A deliberate still, held opening is the hook (e.g., a striking composed image with text)."
    genres: [genre.vlog, genre.montage, genre.event_recap, genre.talking_head, genre.product]
    goals: [goal.retention_first_3s, goal.energy]
    uses_capabilities: [cap.cut.trim, cap.analysis.motion_detection, cap.analysis.speech_transcript]
    conflicts_with: []
    requires: []
    evidence_level: theory
    confidence: medium
    sources:
      - {title: "What You Can Learn from Edward Dmytryk's 7 Rules of Cutting", author: "New York Film Academy", url: "https://www.nyfa.edu/student-resources/what-you-can-learn-from-edward-dmytryks-7-rules-of-cutting/", locator: "rule 5"}
      - {title: "Dmytryk's rules of editing (course notes)", author: "Chicago Media Works", url: "https://www.chicagomediaworks.com/2instructworks/3editing_doc/3editing_docdymytryk.html", locator: "rule list"}

  - id: principle.cut.substance_before_form
    type: principle
    name: Substance before form
    summary: "Dmytryk's closing rule puts content ahead of stylistic flourish. Effects, transitions and clever cuts are justified only when they serve what's being said; the audience should feel the piece, not notice the technique."
    when_to_use: "Deciding whether to add transitions, glitch effects, speed ramps or graphics."
    how: ["Add a stylistic device only if it clarifies, emphasises, or sets tone", "Default to the hard cut", "Remove effects that compete with the speaker or product"]
    parameters: {}
    avoid_when: "Style itself is the content (edit-showcase reels, music-video aesthetics)."
    genres: [genre.talking_head, genre.testimonial, genre.tutorial, genre.brand_story, genre.interview]
    goals: [goal.clarity, goal.trust]
    uses_capabilities: [cap.cut.hard_cut, cap.transition.crossfade]
    conflicts_with: []
    requires: []
    evidence_level: theory
    confidence: medium
    sources:
      - {title: "Dmytryk's rules of editing (course notes)", author: "Chicago Media Works", url: "https://www.chicagomediaworks.com/2instructworks/3editing_doc/3editing_docdymytryk.html", locator: "rule 7"}
      - {title: "Seven rules for film and video editors", author: "ProVideo Coalition", url: "https://www.provideocoalition.com/seven_rules_for_film_and_video_editors/", locator: "rule list"}

  # ───────────────────────── Bowen: Grammar of the Edit ─────────────────────────
  - id: principle.cut.information_and_motivation
    type: principle
    name: Each cut needs new information and a motivation
    summary: "Bowen's grammar lists the factors that justify a cut: new information, a motivating event (look, sound, movement), suitable composition, a sufficiently different camera angle, continuity, and sound. Information and motivation come first: a new shot should tell the viewer something, and something should prompt the change."
    when_to_use: "Building cut lists from transcripts and B-roll; checking whether an inserted shot earns its place."
    how: ["Identify the motivator (word, glance, gesture, sound) that triggers each cut", "Ensure the incoming shot adds information (detail, reaction, context)", "Check composition and angle differ enough to read as a deliberate change"]
    parameters: {bowen_factors: "information, motivation, composition, camera angle, continuity, sound"}
    avoid_when: "Never fully; montage may rely on rhythm as motivation."
    genres: [genre.talking_head, genre.interview, genre.tutorial, genre.product, genre.testimonial]
    goals: [goal.clarity, goal.watch_through]
    uses_capabilities: [cap.cut.hard_cut, cap.analysis.speech_transcript, cap.compositing.overlay_broll]
    conflicts_with: [anti.cut.unmotivated_cut]
    requires: []
    evidence_level: theory
    confidence: high
    sources:
      - {title: "Grammar of the Edit, 4th Edition", author: "Christopher J. Bowen", url: "https://www.oreilly.com/library/view/grammar-of-the/9781351803540/", locator: "book (factors per CineMontage review; TOC not consulted)"}
      - {title: "Learn the Craft, But Don't Overlook the Art (review of Grammar of the Edit)", author: "CineMontage", url: "https://cinemontage.org/?p=25145", locator: "review"}

  - id: tech.cut.shot_size_progression
    type: technique
    name: Shot-size variety and progression
    summary: "Varying shot size (wide, medium, close, detail) controls intimacy and information. Classical grammar moves from context to detail and tightens toward emotional peaks; in vertical reels the 'wide' is often a medium, and digital punch-ins supply most of the variety."
    when_to_use: "Talking heads, tutorials, product demos, interviews with a single camera."
    how: ["Assign scale per beat: medium for setup, close-up for emphasis or emotion, detail/insert for objects", "Tighten as tension rises; release by widening", "Avoid two consecutive shots of identical scale and angle of the same subject"]
    parameters: {scale_steps_for_punch_in: "100% / 115–130% / 150%+ (derived; source resolution permitting)"}
    avoid_when: "Low-resolution source where punch-ins degrade the image below acceptable sharpness."
    genres: [genre.talking_head, genre.tutorial, genre.product, genre.interview, genre.podcast_clip]
    goals: [goal.watch_through, goal.emotion, goal.clarity]
    uses_capabilities: [cap.transform.punch_in, cap.transform.reframe, cap.cut.hard_cut]
    conflicts_with: []
    requires: []
    evidence_level: theory
    confidence: medium
    sources:
      - {title: "Grammar of the Edit, 4th Edition", author: "Christopher J. Bowen", url: "https://www.oreilly.com/library/view/grammar-of-the/9781351803540/", locator: "book (shot types/composition; TOC not consulted)"}
      - {title: "Continuity: Shoot and Edit so your Movie Makes Sense", author: "Learn About Film", url: "https://learnaboutfilm.com/film-language/sequence/", locator: "changing position and shot size"}

  # ───────────────────────── Pearlman: rhythm ─────────────────────────
  - id: principle.rhythm.timing_pacing_trajectory
    type: principle
    name: Timing, pacing and trajectory phrasing
    summary: "Pearlman splits rhythm into timing (which frame you cut on and how long a shot holds), pacing (the rate of cutting and of movement within shots), and trajectory phrasing (shaping the path and energy of movement across cuts so it links smoothly or collides). Together they shape tension and release."
    when_to_use: "Any rhythm decision: choosing cut frames, setting overall cut rate, and deciding whether consecutive shots flow or clash."
    how: ["Timing: pick the frame where the movement or thought peaks or completes", "Pacing: set cut rate to the intended energy, considering motion inside shots too", "Trajectory: match motion direction/energy across a cut for flow, or oppose it for impact"]
    parameters: {}
    avoid_when: "Never; it is a lens, not a rule."
    genres: [genre.montage, genre.event_recap, genre.vlog, genre.brand_story, genre.talking_head]
    goals: [goal.energy, goal.watch_through, goal.emotion]
    uses_capabilities: [cap.cut.trim, cap.analysis.motion_detection, cap.analysis.beat_detection]
    conflicts_with: []
    requires: []
    evidence_level: theory
    confidence: high
    sources:
      - {title: "Cutting Rhythms, Ch. 3: Timing, Pacing, and Trajectory Phrasing", author: "Karen Pearlman", url: "https://www.oreilly.com/library/view/cutting-rhythms/9780240810140/10_ch03.xhtml", locator: "Chapter 3"}
      - {title: "Feeling the Screen Story's Pulse (review of Cutting Rhythms, 3rd ed.)", author: "Mark Seton, Senses of Cinema", url: "https://www.sensesofcinema.com/2026/book-reviews/feeling-the-screen-storys-pulse-karen-peralmans-cutting-rhythms-creative-film-editing/", locator: "Ch. 3–4 discussion"}

  - id: principle.rhythm.tension_release
    type: principle
    name: Cycles of tension and release
    summary: "Pearlman frames the purpose of editing rhythm as shaping cycles of tension and release. A reel is a compressed version: build (tighter cuts, rising stakes) then release (a held payoff, laugh, or reveal), possibly repeated in micro-cycles every few seconds."
    when_to_use: "Structuring any reel over ~10 s; placing the payoff and the CTA."
    how: ["Map the reel into tension segments and release moments", "Compress shot length and add motion during tension", "Give the release a longer hold and cleaner audio", "In 30–60 s reels plan 2–4 micro-cycles (derived)"]
    parameters: {micro_cycle_s: "5–15 (derived, low confidence)"}
    avoid_when: "Calm ASMR/ambient content where steady state is the goal."
    genres: [genre.montage, genre.transformation, genre.brand_story, genre.vlog, genre.event_recap, genre.tutorial]
    goals: [goal.watch_through, goal.emotion, goal.rewatch]
    uses_capabilities: [cap.cut.trim, cap.speed.ramp, cap.audio.music_beat_sync]
    conflicts_with: [anti.rhythm.metronomic_cutting]
    requires: []
    evidence_level: theory
    confidence: high
    sources:
      - {title: "Cutting Rhythms: Creative Film Editing, 3rd ed.", author: "Karen Pearlman (Routledge)", url: "https://www.routledge.com/Cutting-Rhythms-Creative-Film-Editing/Pearlman/p/book/9781041024088", locator: "publisher description"}
      - {title: "Cutting Rhythms 3rd ed. — Preface", author: "Karen Pearlman", url: "https://www.oreilly.com/library/view/cutting-rhythms-3rd/9781040351369/xhtml/Preface.xhtml", locator: "Preface"}

  - id: principle.rhythm.physical_rhythm
    type: principle
    name: Physical rhythm
    summary: "Physical rhythm is the movement inside images and sound: gestures, camera moves, objects, sound energy. The editor re-choreographs it, emphasising the most dynamic moments and keeping viewers oriented."
    when_to_use: "Action-heavy B-roll, sports, dance, product handling, event recaps."
    how: ["Locate movement peaks in each clip", "Cut so peaks land on strong beats or on the cut itself", "Remove the slack before and after movement"]
    parameters: {}
    avoid_when: "Static talking heads with no movement to choreograph (rely on emotional rhythm instead)."
    genres: [genre.montage, genre.event_recap, genre.product, genre.vlog]
    goals: [goal.energy, goal.watch_through]
    uses_capabilities: [cap.analysis.motion_detection, cap.cut.trim, cap.audio.music_beat_sync]
    conflicts_with: []
    requires: [principle.rhythm.timing_pacing_trajectory]
    evidence_level: theory
    confidence: medium
    sources:
      - {title: "Feeling the Screen Story's Pulse (review of Cutting Rhythms, 3rd ed.)", author: "Mark Seton, Senses of Cinema", url: "https://www.sensesofcinema.com/2026/book-reviews/feeling-the-screen-storys-pulse-karen-peralmans-cutting-rhythms-creative-film-editing/", locator: "Ch. 7 Physical rhythm"}

  - id: principle.rhythm.emotional_rhythm
    type: principle
    name: Emotional rhythm
    summary: "Emotional rhythm is how feeling passes from shot to shot in a cause-and-effect chain. The editor's questions are which shot, where, and for how long, so each emotional beat lands and hands off to the next."
    when_to_use: "Testimonials, interviews, brand stories, any reel whose goal is emotion or trust."
    how: ["Mark emotional beats in the transcript (shift in feeling, admission, laugh)", "Hold each beat until the feeling registers, then cut on the shift", "Use reaction shots or silence to let a beat breathe"]
    parameters: {}
    avoid_when: "Pure information delivery where emotion is incidental."
    genres: [genre.testimonial, genre.interview, genre.brand_story, genre.podcast_clip]
    goals: [goal.emotion, goal.trust]
    uses_capabilities: [cap.analysis.speech_transcript, cap.analysis.face_expression, cap.cut.trim]
    conflicts_with: []
    requires: [principle.cut.emotion_first]
    evidence_level: theory
    confidence: medium
    sources:
      - {title: "Feeling the Screen Story's Pulse (review of Cutting Rhythms, 3rd ed.)", author: "Mark Seton, Senses of Cinema", url: "https://www.sensesofcinema.com/2026/book-reviews/feeling-the-screen-storys-pulse-karen-peralmans-cutting-rhythms-creative-film-editing/", locator: "Ch. 8 Emotional rhythm"}

  - id: principle.rhythm.event_rhythm
    type: principle
    name: Event rhythm (story structure)
    summary: "Event rhythm is the pacing of story events: the opening establishes stakes and later dramatic questions raise them, building tension and release at the structural level. In a reel the stakes must be established in the first seconds."
    when_to_use: "Ordering segments; deciding what to cut entirely; placing the hook and payoff."
    how: ["State or imply the stakes in the opening 1–3 s", "Order beats so each raises or answers a question", "Cut any segment that neither raises nor resolves a question"]
    parameters: {stakes_by_s: "≤ 3 (reel adaptation, derived)"}
    avoid_when: "Never fully; ambient/aesthetic reels have weaker event rhythm by design."
    genres: [genre.brand_story, genre.vlog, genre.transformation, genre.tutorial, genre.testimonial]
    goals: [goal.retention_first_3s, goal.watch_through]
