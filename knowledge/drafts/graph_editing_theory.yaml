  - id: principle.style.linkage_vs_collision
    type: principle
    name: Linkage vs collision (invisible vs expressive editing)
    summary: "Editing styles sit on two spectrums: continuity to thematic montage, and linkage (shots flow into each other) to collision (shots clash for effect). Pearlman rejects the idea that good editing must be invisible; the choice should fit the material's intent."
    when_to_use: "Choosing an overall cutting style per reel: smooth/trustworthy (linkage) vs punchy/energetic (collision)."
