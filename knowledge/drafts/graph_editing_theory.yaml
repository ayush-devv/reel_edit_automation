  - id: tech.cut.match_on_action
    type: technique
    name: Match on action
    summary: "Cut from one shot to another in the middle of a continuous movement so the action appears to flow across the cut. It is the most reliably invisible cut and also bridges small continuity flaws."
    when_to_use: "Multi-angle B-roll of a single action (pouring, opening a box, a jump), tutorials, product unboxings, vlogs."
    how: ["Find the same action in both shots", "Cut a few frames into the movement in shot A", "Start shot B at the matching phase of the action, slightly overlapping rather than missing frames", "Keep audio continuous"]
    parameters: {cut_point: "≈ ⅓ into the motion (practitioner convention, low confidence)", overlap_frames: "0–2 @30fps (derived)"}
    avoid_when: "The two angles show visibly different action states (reads as an error)."
    genres: [genre.product, genre.tutorial, genre.vlog, genre.event_recap, genre.montage]
    goals: [goal.watch_through, goal.clarity]
    uses_capabilities: [cap.analysis.motion_detection, cap.cut.hard_cut, cap.cut.trim]
