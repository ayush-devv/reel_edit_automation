  - id: tech.cut.jump_cut_ellipsis
    type: technique
    name: Expressive jump cut (time ellipsis)
    summary: "Use deliberate jumps within one setup to show time passing or restlessness (a person in different positions in the same frame, a process sped through). Popularised by Breathless, where jarring discontinuity was a stylistic choice."
    when_to_use: "Vlogs, day-in-the-life, process/transformation reels, waiting/boredom gags."
