  - id: tech.cut.jump_cut_punch_in
    type: technique
    name: Punch-in to soften jump cuts
    summary: "Alternate digital zoom levels across successive jump cuts so each cut also changes shot size, partially satisfying the 30° rule and adding emphasis. A practitioner convention derived from shot-size grammar, not a rule from the classic texts."
    when_to_use: "Single-camera 4K-or-better talking heads where many jump cuts are needed."
    how: ["Alternate between base framing and a tighter punch-in on successive segments", "Use the tightest punch for punchlines or key claims", "Keep eyes at a consistent screen height across scales"]
    parameters: {punch_scale: "1.10–1.30x typical (derived, low confidence)", min_source_res_for_1_3x: "≥ 1440p for 1080x1920 output (derived)"}
    avoid_when: "Low-resolution or noisy source; every single cut (becomes a tic)."
    genres: [genre.talking_head, genre.tutorial, genre.podcast_clip]
    goals: [goal.watch_through, goal.energy]
