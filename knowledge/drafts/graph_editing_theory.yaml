  - id: anti.audio.hard_audio_seams
    type: anti_pattern
    name: Hard audio seams
    summary: "Audio that clicks, drops room tone, or changes level at every picture cut. Because continuous sound is a main reason cuts go unnoticed, audio seams expose every edit and make jump cuts feel harsher."
    when_to_use: "Detect: silence gaps, level jumps or clicks at edit points."
    how: ["Add short crossfades", "Fill gaps with room tone", "Run music/ambience continuously under cuts"]
    parameters: {}
    avoid_when: "A deliberate hard stop for comedic or dramatic emphasis."
    genres: [genre.talking_head, genre.interview, genre.podcast_clip, genre.testimonial, genre.tutorial]
    goals: [goal.watch_through, goal.trust]
