      - {title: "Feeling the Screen Story's Pulse (review of Cutting Rhythms, 3rd ed.)", author: "Mark Seton, Senses of Cinema", url: "https://www.sensesofcinema.com/2026/book-reviews/feeling-the-screen-storys-pulse-karen-peralmans-cutting-rhythms-creative-film-editing/", locator: "Ch. 8"}

  - id: tech.story.loop_ending_to_open
    type: technique
    name: End that pays off the opening (loop)
    summary: "Make the final shot resolve or echo the first one so the reel closes its own setup and, where possible, flows seamlessly back into the start on autoplay. A reel-specific application of setup/payoff."
    when_to_use: "Short reels (≤ 20 s) on autoplaying platforms; transformations; satisfying-process content."
    how: ["Plan first and last shots together", "Match composition and audio across the loop seam", "Avoid end cards that break the loop"]
    parameters: {}
    avoid_when: "A CTA end card is required; story needs a clear ending."
    genres: [genre.transformation, genre.montage, genre.product, genre.vlog]
    goals: [goal.rewatch, goal.watch_through]
    uses_capabilities: [cap.cut.reorder, cap.transition.match_cut, cap.audio.crossfade]
