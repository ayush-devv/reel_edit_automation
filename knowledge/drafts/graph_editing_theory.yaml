      - {title: "What is continuity editing in film?", author: "Adobe", url: "https://www.adobe.com/creativecloud/video/hub/ideas/what-is-continuity-editing-in-film", locator: "180-degree rule"}

  - id: principle.continuity.thirty_degree_rule
    type: principle
    name: 30° rule (sufficient change between shots)
    summary: "Cutting between two shots of the same subject needs a clear change of angle (≈30°+) or shot size, otherwise it reads as a jump cut. In single-camera reels the usual substitute is a scale change via punch-in."
    when_to_use: "Cutting within continuous footage of one subject when the cut should feel deliberate rather than jumpy."
    how: ["If angle differs by < ~30°, also change scale noticeably", "Alternate punch-in levels across successive trims", "Or accept the jump cut deliberately as style"]
    parameters: {min_angle_change_deg: "≈ 30", min_scale_change: "≈ 1.15–1.3x (derived, low confidence)"}
    avoid_when: "The jump cut is wanted as a stylistic device (vlog/talking-head grammar)."
    genres: [genre.talking_head, genre.interview, genre.tutorial, genre.podcast_clip]
    goals: [goal.clarity, goal.watch_through]
    uses_capabilities: [cap.transform.punch_in, cap.cut.hard_cut]
    conflicts_with: [tech.cut.jump_cut_talking_head]
    requires: []
    evidence_level: theory
    confidence: medium
    sources:
      - {title: "30-degree rule", author: "Wikipedia", url: "https://en.wikipedia.org/wiki/30-degree_rule", locator: "definition (article flags limited citations)"}
      - {title: "Continuity: Shoot and Edit so your Movie Makes Sense", author: "Learn About Film", url: "https://learnaboutfilm.com/film-language/sequence/", locator: "changing position and shot size"}

  - id: principle.continuity.eyeline_match
    type: principle
    name: Eyeline match
    summary: "When a person looks off-screen, the next shot should show what they look at, positioned where their gaze points. It links a look to its object and powers POV and reaction structures."
    when_to_use: "Vlogs and product reels where a person looks at something; interviews intercutting host and guest; reaction reels."
    how: ["Detect gaze direction at the out-point", "Cut to the object/person the gaze implies", "Place the object on the side of frame the gaze points toward"]
