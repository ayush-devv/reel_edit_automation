  - id: tech.cut.shot_reverse_shot
    type: technique
    name: Shot / reverse shot
    summary: "Alternate between two people facing each other, each framed from the other's side of the axis, with matching eyelines. The default grammar for two-person conversations; in vertical reels each speaker usually gets their own reframed 9:16 crop."
    when_to_use: "Two-person interviews, podcasts, debates, conversational skits."
