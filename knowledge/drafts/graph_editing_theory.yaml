  - id: anti.story.unclosed_loop
    type: anti_pattern
    name: Unclosed loop (unfired gun)
    summary: "Opening a question or planting a setup and never paying it off. The viewer feels cheated; repeated, it reads as clickbait and erodes trust and follow-through."
    when_to_use: "Detect: any hook promise or planted element with no resolution before the end."
    how: ["Add the payoff or cut the setup", "Make the hook promise exactly what the reel delivers"]
    parameters: {}
    avoid_when: "Intentional part-1 cliffhangers in a series (still pay off something)."
    genres: [genre.tutorial, genre.vlog, genre.transformation, genre.talking_head, genre.brand_story]
    goals: [goal.trust, goal.watch_through]
    uses_capabilities: [cap.cut.reorder]
