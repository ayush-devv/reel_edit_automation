      - {title: "What are J-cuts and L-cuts, and how do they work in video editing?", author: "Epidemic Sound", url: "https://www.epidemicsound.com/blog/j-cuts-and-l-cuts/", locator: "split edits"}

  - id: tech.audio.l_cut
    type: technique
    name: L-cut (audio trails picture)
    summary: "The outgoing shot's audio continues after the picture changes. Lets the viewer see a reaction, B-roll or detail while the speaker keeps talking; the core move for covering talking-head edits and showing reactions."
    when_to_use: "Laying B-roll over narration; showing a listener's reaction in interviews/podcasts; lingering on a line's emotional weight."
    how: ["Cut picture to the reaction/B-roll before the sentence ends", "Keep the speaker's audio running until the thought completes", "Return to the speaker on the next sentence start or a new motivation"]
    parameters: {audio_trail_frames: "6–12 @30fps for dialogue (practitioner range)", broll_over_dialogue_s: "1.5–3 (derived, low confidence)"}
    avoid_when: "Lip-sync proof matters (the viewer must see the speaker say a key claim, e.g., testimonial endorsements)."
    genres: [genre.interview, genre.podcast_clip, genre.testimonial, genre.talking_head, genre.brand_story]
    goals: [goal.watch_through, goal.emotion]
    uses_capabilities: [cap.audio.split_edit, cap.compositing.overlay_broll]
