  - id: tech.color.shared_look_layer
    type: technique
    name: One shared look for the whole reel
    summary: "Separate per-clip corrections from a single look applied to all clips (grouped/shared node or adjustment layer). Changing the look once updates every clip and keeps the reel visually consistent."
    when_to_use: "Any reel with more than a handful of clips."
    how: ["Per-clip node: correction/match", "Group/timeline node or adjustment layer: look", "Tweak look globally, never per clip"]
    parameters: {structure: "clip-level correction + group-level look"}
    avoid_when: "Sections intentionally graded differently — use two groups (e.g. A-roll, B-roll)."
    genres: [genre.montage, genre.brand_story, genre.event_recap, genre.vlog]
    goals: [goal.brand_recall]
    uses_capabilities: [cap.color.group_grade, cap.color.lut_apply]
