  - id: tech.motion.emphasis_on_beat
    type: technique
    name: Use motion to emphasise meaning, timed to speech or beat
    summary: "Trigger emphasis motion (pop, punch-in, colour flash) on the stressed word, a number, or a music hit, so movement reinforces content. Motion unrelated to meaning becomes distraction."
