    summary: "Build hierarchy by enlarging, bolding or colouring the single most meaningful word (noun/verb/number) while the rest stays neutral. One accent per chunk keeps emphasis meaningful; emphasising everything emphasises nothing."
    when_to_use: "Hooks, claims, numbers, brand names, punchlines."
