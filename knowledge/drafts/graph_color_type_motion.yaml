  # ---------------- transitions ----------------

  - id: tech.transition.match_cut
    type: technique
    name: Match cut (graphic or action match)
    summary: "Cut between two shots linked by similar shape, colour, composition or continuing movement so the change feels seamless or meaningful. Graphic matches draw attention and imply comparison; matches on action hide the cut."
    when_to_use: "Transformations (before/after with same framing), product reveals, montage continuity."
    how: ["Find shots with matching shape/position or continuing motion", "Align the matched element's position in frame", "Cut on the motion, mid-action", "Match colour/brightness across the cut"]
    parameters: {position_alignment: "matched element within a few % of frame between shots (heuristic)"}
    avoid_when: "No genuine visual link exists — forced matches look gimmicky."
    genres: [genre.transformation, genre.montage, genre.product, genre.brand_story]
    goals: [goal.rewatch, goal.watch_through]
    uses_capabilities: [cap.transition.match_cut, cap.transform.punch_in]
