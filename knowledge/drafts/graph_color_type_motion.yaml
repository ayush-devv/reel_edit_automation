      - {title: "Recommendation ITU-R BT.1702 — Guidance for the reduction of photosensitive epileptic seizures", author: "ITU-R", url: "https://www.itu.int/dms_pubrec/itu-r/rec/bt/R-REC-BT.1702-3-202311-I!!PDF-E.pdf", locator: "saturated red transitions (via search summary)"}
      - {title: "ITC Guidance Note for Licensees on Flashing Images and Regular Patterns", author: "ITC/Ofcom", url: "https://www.ofcom.org.uk/__data/assets/pdf_file/0021/16248/gn_flash.pdf", locator: "3 flashes/s; 1/4 screen area (via search summary)"}

