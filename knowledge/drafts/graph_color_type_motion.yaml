  - id: tech.motion.overshoot_settle
    type: technique
    name: Overshoot and settle (follow-through)
    summary: "Let an element travel slightly past its target and settle back, giving weight and liveliness. Keep overshoot small and the settle quick so text is readable almost immediately."
    when_to_use: "Playful/energetic caption pops, sticker/emoji graphics, keyword emphasis."
    how: ["Spring or back-ease", "Overshoot ~5-12% of scale/distance", "Settle within ~100-150 ms after peak"]
    parameters: {overshoot_pct: "5-12 (heuristic)", settle_ms: "100-150 (heuristic)", back_ease_example: "cubic-bezier(0.34, 1.56, 0.64, 1)"}
    avoid_when: "Premium, serious or calm content; long text blocks."
    genres: [genre.vlog, genre.podcast_clip, genre.talking_head]
    goals: [goal.energy]
    uses_capabilities: [cap.graphics.overshoot_spring]
    conflicts_with: [tech.caption.style_minimal_calm]
