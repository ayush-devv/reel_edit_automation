  - id: tech.motion.stagger_overlap
    type: technique
    name: Stagger related elements (overlapping action)
    summary: "Animate a group in sequence — lead element first, supporting elements slightly after — so hierarchy is communicated by order and the group feels organic rather than mechanical."
    when_to_use: "Multi-word kinetic titles, title + subtitle, list reveals."
    how: ["Lead element (key word/image) first", "Followers offset by ~30-80 ms each", "Total sequence ideally <= ~500 ms"]
    parameters: {stagger_ms: "30-80 (heuristic)", total_ms: "<=500"}
    avoid_when: "Word-by-word speech-synced captions (speech timing already sequences them)."
    genres: [genre.brand_story, genre.product, genre.tutorial]
    goals: [goal.clarity, goal.brand_recall]
    uses_capabilities: [cap.graphics.stagger]
    conflicts_with: []
    requires: [principle.motion.ease_not_linear]
    evidence_level: theory
    confidence: medium
