  - id: tech.motion.frequent_means_subtle
    type: technique
    name: The more often an animation repeats, the subtler and shorter it should be
    summary: "Animations seen dozens of times per reel (each caption chunk) must be short and understated; reserve bigger, longer motion for rare moments like the hook title or CTA."
    when_to_use: "Designing caption entrance vs title/CTA animation."
    how: ["Captions: <=150 ms, small offsets/scale", "Hook/CTA: up to ~300-400 ms with anticipation/overshoot"]
