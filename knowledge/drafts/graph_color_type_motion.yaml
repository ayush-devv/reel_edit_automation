  # ---------------- motion anti-patterns ----------------

  - id: anti.motion.flashing
    type: anti_pattern
    name: More than three flashes per second or saturated-red flashes
    summary: "Flashing more than three times in any one second over a large screen area, or transitions to/from saturated red, can trigger photosensitive seizures and breach broadcast/web accessibility rules. Beat-synced strobe edits and flash transitions are the usual culprits."
    when_to_use: "Detect: luminance/red flash analysis over sliding 1 s windows."
    how: ["Run flash detection on render", "Space flashes >= 1/3 s apart or reduce contrast/area", "Avoid full-frame red flashes"]
    parameters: {max_flashes_per_s: "3", area_threshold: "> 1/4 of screen (broadcast rule)"}
    avoid_when: "Never acceptable."
    genres: [genre.montage, genre.event_recap]
    goals: [goal.trust]
    uses_capabilities: [cap.analysis.flash_check]
    conflicts_with: []
    requires: []
    evidence_level: platform
    confidence: high
    sources:
