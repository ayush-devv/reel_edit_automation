  - id: tech.transition.whip_pan
    type: technique
    name: Whip-pan transition
    summary: "Join two shots through fast directional motion blur, either shot in camera or simulated in post with directional blur on the outgoing tail and incoming head. Adds energy; works best when pan speed, direction and brightness match."
    when_to_use: "Location changes in vlogs/travel, energetic montages."
