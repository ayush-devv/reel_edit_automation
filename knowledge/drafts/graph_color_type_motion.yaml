  - id: principle.type.reading_load_ceiling
    type: principle
    name: Respect a reading-speed ceiling
    summary: "Professional subtitle standards cap reading load at about 20 characters/second for adult English (17 for children) with at most 2 lines of 42 characters. Treat these long-form limits as an upper bound for reel captions, which should be lighter still."
    when_to_use: "Any on-screen text tied to speech; check every caption chunk."
    how: ["Compute chars/sec per chunk = characters / on-screen duration", "If over ceiling, shorten text or extend dwell", "Prefer 1 line for reels"]
    parameters: {max_cps_adult_en: "20", max_cps_children_en: "17", max_chars_per_line: "42", max_lines: "2"}
    avoid_when: "Never ignored; kinetic single-word captions trivially satisfy it."
    genres: [genre.talking_head, genre.tutorial, genre.interview, genre.podcast_clip]
    goals: [goal.clarity, goal.watch_through]
