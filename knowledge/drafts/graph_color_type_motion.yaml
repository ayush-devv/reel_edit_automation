  - id: principle.motion.restraint_consistency
    type: principle
    name: One consistent motion vocabulary per reel
    summary: "Choose a small set of motions (one entrance, one exit, one emphasis, one transition) with fixed curves and durations, and reuse them throughout. Consistency reads as professional and branded; exaggeration should be scaled to the content's tone."
    when_to_use: "Template design and every edit."
