# Knowledge graph draft: colour grading, typography/captions, motion graphics.
# Schema: knowledge/SCHEMA.md section 2. All text paraphrased; sources cited.
# Locator notes: "via search summary" means the primary page could not be fetched
# (403/404/503) and the figure was taken from search-engine summaries of it;
# confidence for those is capped at medium.

nodes:

  # ===================================================================
  # COLOUR — workflow principles
  # ===================================================================

  - id: principle.color.correct_before_grade
    type: principle
    name: Correct first, then grade
    summary: "Normalise every clip to a neutral, technically correct baseline (input transform, exposure, white balance, contrast) before adding any creative look. A look built on unbalanced footage amplifies the errors and makes shots impossible to match."
    when_to_use: "Every reel with more than one clip or source; always before applying a LUT or stylised look."
    how: ["Apply input/colour-space transform for the source", "Set exposure on the waveform", "Neutralise white balance on the parade", "Only then add the look on a later node/layer"]
    parameters: {node_order: "input transform -> exposure/balance -> contrast -> secondaries -> look -> output transform"}
    avoid_when: "Never skipped; a single already-graded clip may only need a light trim."
    genres: [genre.talking_head, genre.testimonial, genre.product, genre.tutorial, genre.vlog, genre.montage, genre.interview, genre.brand_story]
    goals: [goal.trust, goal.brand_recall]
    uses_capabilities: [cap.color.color_space_transform, cap.color.primary_balance, cap.color.lut_apply]
    conflicts_with: []
    requires: []
    evidence_level: practitioner
    confidence: high
    sources:
      - {title: "5 Tips for Getting Perfect Skin Tones in DaVinci Resolve", author: "Frame.io Insider", url: "https://blog.frame.io/2020/10/05/skin-tones-in-davinci-resolve/", locator: "Tip 3: broadest tools first; colour-managed workflow"}
      - {title: "4 Things To Know About Working With LUTs", author: "Mixing Light", url: "https://mixinglight.com/color-tutorial/4-things-to-know-about-working-with-luts", locator: "technical vs creative LUT order (via search summary)"}

  - id: tech.color.scope_roles
    type: technique
    name: Use the right scope for each decision
    summary: "Read exposure on the waveform, channel balance on the RGB parade, hue and saturation on the vectorscope, and gamut excursions on a CIE plot. Scopes are a reality check; most attention should stay on the image itself."
    when_to_use: "Any automated or manual correction pass; essential for an agent that cannot 'eyeball' a calibrated display."
    how: ["Waveform: place blacks, mids, highlights", "Parade: align R/G/B in neutral areas", "Vectorscope: check skin line and saturation extent", "Re-check the picture, not only the trace"]
    parameters: {resolve_10bit_legal_range: "64-940 (0-1023 scale)", scope_time_share: "~5-10% of grading attention (practitioner rule of thumb)"}
    avoid_when: "Judging moire or stylised looks, which scopes do not reflect."
    genres: [genre.talking_head, genre.product, genre.interview, genre.tutorial]
    goals: [goal.trust]
    uses_capabilities: [cap.analysis.scopes]
    conflicts_with: []
    requires: []
    evidence_level: practitioner
    confidence: high
    sources:
      - {title: "Grading by Numbers: When to Use Color Scopes (and When Not To)", author: "Frame.io Insider", url: "https://blog.frame.io/2023/09/18/when-to-use-color-scopes-and-when-not-to/", locator: "Waveform, Parade, Vectorscope, CIE sections"}

  - id: tech.color.exposure_on_waveform
    type: technique
    name: Set exposure and contrast on the waveform
    summary: "Place black point just above legal minimum, keep specular highlights below legal maximum, and let faces sit in the upper-middle of the range. Set contrast before saturation, because saturation perception rises with contrast."
    when_to_use: "First primary adjustment on every clip."
    how: ["Lift/lower shadows until darkest detail sits just above floor", "Set gain so highlights stop short of clipping", "Adjust gamma/mids for face brightness", "Then add contrast via curve"]
    parameters: {legal_range_10bit: "64-940", legal_range_8bit: "16-235", face_luma_ire: "~50-70 IRE typical (practitioner convention, not from the cited page)"}
    avoid_when: "Deliberately crushed or high-key stylised looks (still keep legal range on export)."
    genres: [genre.talking_head, genre.interview, genre.testimonial, genre.product]
    goals: [goal.clarity, goal.trust]
    uses_capabilities: [cap.color.exposure, cap.color.curves, cap.analysis.scopes]
    conflicts_with: []
    requires: [tech.color.scope_roles]
    evidence_level: practitioner
    confidence: medium
    sources:
      - {title: "Grading by Numbers: When to Use Color Scopes (and When Not To)", author: "Frame.io Insider", url: "https://blog.frame.io/2023/09/18/when-to-use-color-scopes-and-when-not-to/", locator: "Waveform; broadcast-safe range 64-940"}

  - id: tech.color.white_balance_parade
    type: technique
    name: Neutralise white balance on the RGB parade
    summary: "Find something that should be neutral (white wall, grey shirt, paper) and adjust offset/gain until the red, green and blue traces line up there. Balance shadows and highlights separately when lighting is mixed."
    when_to_use: "Phone footage under mixed indoor light, clips from different devices, any visible colour cast."
    how: ["Sample a neutral area", "Align R/G/B traces in that zone", "Fix shadow cast with lift, highlight cast with gain", "Confirm the neutral sits at the vectorscope centre"]
    parameters: {target: "neutral patch at vectorscope centre; parade traces aligned"}
    avoid_when: "Warm/cool cast is an intentional mood (e.g. golden-hour b-roll) — keep it, but keep skin plausible."
    genres: [genre.talking_head, genre.vlog, genre.interview, genre.product]
    goals: [goal.trust]
    uses_capabilities: [cap.color.white_balance, cap.color.primary_balance, cap.analysis.scopes]
    conflicts_with: []
    requires: [tech.color.scope_roles]
    evidence_level: practitioner
    confidence: high
    sources:
      - {title: "Grading by Numbers: When to Use Color Scopes (and When Not To)", author: "Frame.io Insider", url: "https://blog.frame.io/2023/09/18/when-to-use-color-scopes-and-when-not-to/", locator: "Parade view"}
      - {title: "5 Tips for Getting Perfect Skin Tones in DaVinci Resolve", author: "Frame.io Insider", url: "https://blog.frame.io/2020/10/05/skin-tones-in-davinci-resolve/", locator: "Tip 2: neutral patch / skin line"}

  - id: tech.color.skin_tone_line
    type: technique
    name: Check skin hue against the vectorscope skin-tone line
    summary: "Isolate a clean, well-lit skin patch (forehead or cheek) and check that its vectorscope trace lies on or near the skin-tone indicator. The line is a hue guide for all complexions, not a saturation or brightness target."
    when_to_use: "Any shot with a face, after global balance."
    how: ["Draw a small window on lit skin and use highlight/solo view", "Read the trace angle vs the skin line", "Nudge hue globally or on a skin-only node until near the line", "Leave saturation to taste"]
    parameters: {tolerance: "small deviation is fine; large left/right swings read as sick (green/yellow) or flushed (magenta/red)"}
    avoid_when: "Stylised looks where skin is intentionally shifted; do not force every face exactly onto the line."
    genres: [genre.talking_head, genre.testimonial, genre.interview, genre.podcast_clip, genre.vlog]
    goals: [goal.trust, goal.emotion]
    uses_capabilities: [cap.analysis.scopes, cap.color.power_window, cap.color.secondary_qualifier]
    conflicts_with: []
    requires: [tech.color.white_balance_parade]
    evidence_level: practitioner
    confidence: high
    sources:
      - {title: "5 Tips for Getting Perfect Skin Tones in DaVinci Resolve", author: "Frame.io Insider", url: "https://blog.frame.io/2020/10/05/skin-tones-in-davinci-resolve/", locator: "Tip 2: scopes / skin tone indicator"}
      - {title: "Grading by Numbers: When to Use Color Scopes (and When Not To)", author: "Frame.io Insider", url: "https://blog.frame.io/2023/09/18/when-to-use-color-scopes-and-when-not-to/", locator: "Vectorscope; don't force every skin tone onto the line"}

  - id: tech.color.broadest_tool_first
    type: technique
    name: Broadest tool first, narrowest last
    summary: "Fix problems with the widest-acting control that works — primaries, then curves, then hue-vs-hue curves, then an HSL qualifier or window. Narrow secondaries are fragile, flicker on moving footage and are easy to overdo."
    when_to_use: "Whenever a correction is needed on skin, sky or a product colour."
    how: ["Try primaries", "Then custom curves", "Then hue-vs-hue/sat curves", "Qualifier last: start from luminance, set ranges manually, use as few keys as possible"]
    parameters: {order: "primaries -> curves -> hue curves -> qualifier/window"}
    avoid_when: "A specific object (logo/product) must hit an exact brand colour — a targeted secondary is justified."
    genres: [genre.talking_head, genre.product, genre.brand_story]
    goals: [goal.trust]
    uses_capabilities: [cap.color.primary_balance, cap.color.curves, cap.color.hue_vs_hue, cap.color.secondary_qualifier]
    conflicts_with: []
    requires: [principle.color.correct_before_grade]
    evidence_level: practitioner
    confidence: high
    sources:
      - {title: "5 Tips for Getting Perfect Skin Tones in DaVinci Resolve", author: "Frame.io Insider", url: "https://blog.frame.io/2020/10/05/skin-tones-in-davinci-resolve/", locator: "Tip 3: use the broadest tools first"}

  - id: tech.color.skin_hue_compression
    type: technique
    name: Compress hues around skin
    summary: "Use a hue-vs-hue curve to pull neighbouring orange-yellow and orange hues slightly toward the skin hue, creating a 'bumper' that makes complexions more uniform across shots without a qualifier."
    when_to_use: "Mixed lighting producing blotchy or inconsistent skin; multi-camera interviews."
    how: ["Add points around skin hue on hue-vs-hue", "Move orange-yellow down a few degrees and orange up a few", "Check on a colour chart or skin patch"]
    parameters: {shift_deg: "~5-8 degrees each side (example values from source)"}
    avoid_when: "Scenes where orange props/products must keep exact colour."
    genres: [genre.talking_head, genre.interview, genre.testimonial]
    goals: [goal.trust]
    uses_capabilities: [cap.color.hue_vs_hue]
    conflicts_with: []
    requires: [tech.color.skin_tone_line]
    evidence_level: practitioner
    confidence: medium
    sources:
      - {title: "5 Tips for Getting Perfect Skin Tones in DaVinci Resolve", author: "Frame.io Insider", url: "https://blog.frame.io/2020/10/05/skin-tones-in-davinci-resolve/", locator: "Tip 5: compress nearby hues"}

  - id: tech.color.split_tone_warm_cool
    type: technique
    name: Split-tone warm highlights, cool shadows
    summary: "Push highlights slightly warm along the skin-tone axis and shadows slightly cool (blue-green). This flatters skin, which lives in the mids and upper range, and adds colour separation without heavy saturation."
    when_to_use: "Talking heads, testimonials and lifestyle reels that need a polished but natural look."
    how: ["Warm push in highlights/gain", "Cool push in shadows/lift", "Keep mids near neutral", "Verify on a greyscale ramp that the transition is smooth"]
    parameters: {strength: "subtle; neutrals should still read near-neutral on the vectorscope"}
    avoid_when: "Product shots requiring true colour; very dark-skinned subjects where cool shadows can grey the skin."
    genres: [genre.talking_head, genre.testimonial, genre.vlog, genre.brand_story]
    goals: [goal.emotion, goal.brand_recall]
    uses_capabilities: [cap.color.split_tone, cap.color.primary_balance]
    conflicts_with: []
    requires: [principle.color.correct_before_grade]
    evidence_level: practitioner
    confidence: medium
    sources:
      - {title: "5 Tips for Getting Perfect Skin Tones in DaVinci Resolve", author: "Frame.io Insider", url: "https://blog.frame.io/2020/10/05/skin-tones-in-davinci-resolve/", locator: "Tip 4: split-toning"}

  - id: tech.color.input_transform_first
    type: technique
    name: Identify the source transfer and apply the matching input transform
    summary: "Determine whether each clip is Rec.709 SDR, HLG HDR, Dolby Vision, Apple Log or another log profile, and apply the specific technical transform for it first. The container or codec does not reveal this; read metadata."
    when_to_use: "Every ingest, especially iPhone footage (default HDR HLG/Dolby Vision on recent models) mixed with SDR clips."
    how: ["Probe colour primaries/transfer metadata (e.g. ffprobe color_transfer arib-std-b67 = HLG)", "Map each source to the working space with its own transform", "Never reuse an HLG transform on Apple Log"]
    parameters: {hlg_flag: "color_transfer=arib-std-b67", pq_flag: "color_transfer=smpte2084", sdr_flag: "bt709"}
    avoid_when: "Never skipped for mixed-source projects."
    genres: [genre.vlog, genre.talking_head, genre.montage, genre.event_recap]
    goals: [goal.trust]
    uses_capabilities: [cap.color.color_space_transform, cap.analysis.probe_metadata]
    conflicts_with: []
    requires: []
    evidence_level: practitioner
    confidence: medium
    sources:
      - {title: "iPhone HDR to SDR in DaVinci Resolve", author: "DaVinci Resolve Club", url: "https://davinciresolveclub.com/iphone-hdr-to-sdr-davinci-resolve/", locator: "Identify the source first (via search summary)"}

  - id: tech.color.hdr_to_sdr_tonemap
    type: technique
    name: Tone-map HDR phone footage to Rec.709 SDR for social
    summary: "Convert HLG/PQ phone clips to Rec.709 with a colour-space transform that includes tone mapping and gamut mapping, then grade in SDR. Untreated HDR clips look washed out or clipped next to SDR clips and render inconsistently across apps."
    when_to_use: "Any reel mixing iPhone HDR clips with SDR sources, or delivering SDR to Reels/Shorts/TikTok."
    how: ["CST Rec.2100 HLG (or PQ) -> Rec.709 gamma 2.4 with tone mapping enabled", "Enable saturation/gamut mapping", "Re-balance exposure after conversion", "Export tagged bt709 8-bit"]
    parameters: {output: "Rec.709 / BT.1886, 8-bit, tagged bt709", tone_mapping: "on (e.g. DaVinci tone mapping)"}
    avoid_when: "Deliberately delivering HDR to a platform/player that supports it end-to-end and all sources are HDR."
    genres: [genre.vlog, genre.montage, genre.event_recap, genre.talking_head]
    goals: [goal.trust]
    uses_capabilities: [cap.color.tone_map_hdr_sdr, cap.color.color_space_transform, cap.export.color_tag]
    conflicts_with: []
    requires: [tech.color.input_transform_first]
    evidence_level: practitioner
    confidence: medium
    sources:
      - {title: "iPhone HDR to SDR in DaVinci Resolve", author: "DaVinci Resolve Club", url: "https://davinciresolveclub.com/iphone-hdr-to-sdr-davinci-resolve/", locator: "Color Management route; CST route (via search summary)"}
      - {title: "HDR iPhone 14 footage washed out (forum thread)", author: "Adobe Community", url: "https://community.adobe.com/t5/premiere-pro-discussions/hdr-iphone-14-footage-washed-out-exhausted-all-solutions/m-p/13982055", locator: "user reports (anecdotal)"}

  - id: tech.color.web_gamma_target
    type: technique
    name: Account for gamma 2.2 phone/web viewing
    summary: "Rec.709 masters are usually graded at gamma 2.4 for dark rooms, but phones and web viewing in bright rooms behave closer to 2.2, which lifts shadows and softens contrast. Grade or trim with that in mind and verify on a phone."
    when_to_use: "Final delivery to social platforms viewed on phones."
    how: ["Grade at 2.4 then preview at 2.2, or grade at 2.2 directly", "If export looks washed out on phone, deepen shadows slightly / add contrast in a trim pass", "Check on at least one real phone at mid brightness"]
    parameters: {grading_gamma_dark_room: "2.4", web_mobile_gamma: "~2.2"}
    avoid_when: "Broadcast/TV deliverables."
    genres: [genre.talking_head, genre.product, genre.vlog, genre.brand_story]
    goals: [goal.trust]
    uses_capabilities: [cap.color.curves, cap.export.color_tag]
    conflicts_with: []
    requires: []
    evidence_level: practitioner
    confidence: medium
    sources:
      - {title: "How to choose between Gamma 2.2 and Gamma 2.4 when color correcting?", author: "Mixing Light", url: "https://mixinglight.com/color-tutorial/gamma-2-2-vs-gamma-2-4-davinci-resolve", locator: "web deliverables (via search summary)"}
      - {title: "FAQ: How to choose 'viewing gamma' in Premiere's preferences", author: "Adobe Community", url: "https://community.adobe.com/t5/premiere-pro-discussions/faq-how-to-choose-quot-viewing-gamma-quot-in-premiere-s-preferences/td-p/14575159", locator: "2.4 dark room vs 2.2 web (via search summary)"}
      - {title: "Grading for Mixed Delivery: Cinema, Home, and Every Screen in Between", author: "Frame.io Insider", url: "https://blog.frame.io/2019/10/14/grading-mixed-delivery/", locator: "multi-screen delivery (via search summary)"}

  - id: tech.color.mobile_contrast_saturation
    type: technique
    name: Slightly richer contrast and controlled saturation for phone screens
    summary: "Small, bright phone screens viewed in daylight reward a little extra midtone contrast and moderate saturation, but bright saturated reds/oranges are the first things to clip or bleed after platform compression. Push contrast before saturation and watch the vectorscope extent."
    when_to_use: "Final look pass for vertical social delivery."
    how: ["Add gentle S-curve", "Raise saturation modestly; prefer vibrance-style boosts that spare skin", "Check red/orange extent on vectorscope and gamut on CIE", "Preview after a test platform upload"]
    parameters: {saturation_boost: "~+5-15% over neutral correction (practitioner heuristic, unsourced)"}
    avoid_when: "Documentary/serious tone where a muted look is intended."
    genres: [genre.product, genre.vlog, genre.montage, genre.event_recap]
    goals: [goal.energy, goal.retention_first_3s]
    uses_capabilities: [cap.color.curves, cap.color.saturation, cap.analysis.scopes]
    conflicts_with: [tech.color.look_desaturated_serious]
    requires: [principle.color.correct_before_grade]
    evidence_level: practitioner
    confidence: low
    sources:
      - {title: "Grading by Numbers: When to Use Color Scopes (and When Not To)", author: "Frame.io Insider", url: "https://blog.frame.io/2023/09/18/when-to-use-color-scopes-and-when-not-to/", locator: "bright saturated reds/oranges as QC failures; CIE gamut"}
      - {title: "How to choose between Gamma 2.2 and Gamma 2.4 when color correcting?", author: "Mixing Light", url: "https://mixinglight.com/color-tutorial/gamma-2-2-vs-gamma-2-4-davinci-resolve", locator: "brighter viewing reduces perceived contrast (via search summary)"}

  - id: tech.color.creative_lut_reduced_intensity
    type: technique
    name: Apply creative LUTs after normalisation at reduced strength
    summary: "A creative LUT expects normalised Rec.709 input, so place it after correction and blend it back — commonly around half strength — rather than at 100%. Adjust exposure/balance before the LUT, not after, because LUTs clip what they receive."
    when_to_use: "Fast stylised looks across many clips."
    how: ["Normalise (technical transform + balance) first", "Apply creative LUT on its own node/layer", "Lower node opacity / Lumetri intensity until skin looks natural", "Re-check skin line and highlights"]
    parameters: {lut_intensity: "~40-70% typical starting range (rule of thumb; no authoritative figure)", placement: "after balance, before output transform"}
    avoid_when: "Footage is still log or HDR untransformed."
    genres: [genre.vlog, genre.montage, genre.brand_story, genre.event_recap]
    goals: [goal.brand_recall, goal.emotion]
    uses_capabilities: [cap.color.lut_apply]
    conflicts_with: [anti.color.creative_lut_on_log]
    requires: [principle.color.correct_before_grade, tech.color.input_transform_first]
    evidence_level: practitioner
    confidence: medium
    sources:
      - {title: "What is a LUT? What You Need to Know About Color Grading", author: "Adorama Learning Center", url: "https://www.adorama.com/alc/what-is-lut-color-grading", locator: "LUT intensity ~50% (via search summary)"}
      - {title: "4 Things To Know About Working With LUTs", author: "Mixing Light", url: "https://mixinglight.com/color-tutorial/4-things-to-know-about-working-with-luts", locator: "technical vs creative LUTs (via search summary)"}

  - id: tech.color.hero_shot_match
    type: technique
    name: Grade a hero shot, then match others to it
    summary: "Pick the most representative clip (usually the main talking-head angle), finalise its correction and look, then match every other clip to it — brightness and contrast first, then colour balance, then saturation."
    when_to_use: "Any reel combining multiple angles, phones or lighting setups."
    how: ["Choose hero clip", "Display hero and target side by side or split-screen", "Match luma levels on waveform first", "Then match parade balance", "Then saturation/vectorscope extent", "Copy look node to all clips"]
    parameters: {match_order: "brightness -> contrast -> balance -> saturation"}
    avoid_when: "Deliberate look change between sections (e.g. interview vs b-roll two-tone)."
    genres: [genre.interview, genre.podcast_clip, genre.talking_head, genre.event_recap, genre.testimonial]
    goals: [goal.trust, goal.watch_through]
    uses_capabilities: [cap.color.shot_match, cap.analysis.scopes, cap.color.group_grade]
    conflicts_with: []
    requires: [principle.color.correct_before_grade]
    evidence_level: practitioner
    confidence: high
    sources:
      - {title: "How To Make Resolve's 'Color Match' Easier with the 'Brightness First' Rule", author: "Mixing Light", url: "https://mixinglight.com/color-tutorial/make-resolves-color-match-easier-brightness-first-rule", locator: "brightness first (via search summary)"}
      - {title: "What You Need to Know to Match Shots from Two or More Cameras for Color and Exposure", author: "Wolfcrow", url: "https://wolfcrow.com/how-to-match-shots-from-two-or-more-cameras-for-color-and-exposure/", locator: "multi-camera matching (via search summary)"}

  - id: tech.color.chart_based_match
    type: technique
    name: Chart-based camera matching
    summary: "When a colour chart was shot under the scene lighting on each device, use chart-based colour match to get cameras to a common baseline, then finish by eye. Without a chart, automatic 'match' is little better than auto-colour."
    when_to_use: "Planned multi-camera/phone shoots where a chart can be filmed."
    how: ["Shoot chart well-exposed in the scene light per camera", "Set correct source gamma/colour space", "Run chart match", "Refine manually on the hero shot"]
    parameters: {chart_exposure: "well lit, filling a reasonable part of frame"}
    avoid_when: "No chart available — use hero-shot matching instead."
    genres: [genre.interview, genre.podcast_clip, genre.event_recap]
    goals: [goal.trust]
    uses_capabilities: [cap.color.chart_match]
    conflicts_with: []
