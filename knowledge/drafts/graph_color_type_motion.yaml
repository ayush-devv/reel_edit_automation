  # MOTION DESIGN
  # ===================================================================

  - id: principle.motion.ease_not_linear
    type: principle
    name: Ease motion; avoid linear interpolation
    summary: "Real objects accelerate and decelerate, so linear keyframes look mechanical. Use eased curves for every position, scale and opacity move on text and graphics (Disney's slow-in/slow-out)."
    when_to_use: "Every animated text or graphic."
    how: ["Default to ease-out for entrances", "Ease-in for exits", "Standard ease-in-out for on-screen moves"]
    parameters: {standard_curve: "cubic-bezier(0.4, 0.0, 0.2, 1)"}
    avoid_when: "Constant-velocity effects (scrolling tickers, continuous slow push) where linear is intended."
    genres: []
    goals: [goal.clarity]
    uses_capabilities: [cap.graphics.ease_curve]
    conflicts_with: []
    requires: []
    evidence_level: theory
    confidence: high
    sources:
      - {title: "Executing UX Animations: Duration and Motion Characteristics", author: "Nielsen Norman Group", url: "https://www.nngroup.com/articles/animation-duration/", locator: "Easing"}
      - {title: "UI Animation: How to Apply Disney's 12 Principles of Animation to UI Design", author: "Interaction Design Foundation", url: "https://ixdf.org/literature/article/ui-animation-how-to-apply-disney-s-12-principles-of-animation-to-ui-design", locator: "Slow in and slow out"}

  - id: tech.motion.enter_decelerate
    type: technique
    name: Entrances decelerate (ease-out)
    summary: "Elements entering the frame should arrive fast and slow to rest, which feels responsive and lets the viewer read the element as soon as it lands."
    when_to_use: "Caption/title/graphic entrances."
    how: ["Use deceleration curve", "Enter ~225 ms (mobile reference)", "Ensure the element is legible at its rest position before speech moves on"]
    parameters: {curve: "cubic-bezier(0.0, 0.0, 0.2, 1)", duration_ms: "~200-300 (225 reference)"}
    avoid_when: "Comedic or dramatic slow reveals."
    genres: []
    goals: [goal.clarity, goal.energy]
    uses_capabilities: [cap.graphics.animate_in, cap.graphics.ease_curve]
    conflicts_with: []
    requires: [principle.motion.ease_not_linear]
    evidence_level: theory
    confidence: high
    sources:
      - {title: "Material Design (v1) — Duration & easing", author: "Google", url: "https://m1.material.io/motion/duration-easing.html", locator: "Deceleration curve; mobile durations"}
      - {title: "Executing UX Animations: Duration and Motion Characteristics", author: "Nielsen Norman Group", url: "https://www.nngroup.com/articles/animation-duration/", locator: "Ease-out for entrances"}

  - id: tech.motion.exit_accelerate
    type: technique
    name: Exits accelerate (ease-in) and are shorter than entrances
    summary: "Departing elements speed up as they leave and take less time than they took to arrive, so attention moves on quickly to the next element."
    when_to_use: "Caption/graphic exits."
    how: ["Use acceleration curve", "Exit ~195 ms vs ~225 ms entrance", "Or simply cut out when the next chunk replaces it"]
    parameters: {curve: "cubic-bezier(0.4, 0.0, 1, 1)", duration_ms: "~150-250 (195 reference)"}
    avoid_when: "Elements that may return immediately — use sharp curve or keep on screen."
    genres: []
    goals: [goal.clarity]
    uses_capabilities: [cap.graphics.animate_out, cap.graphics.ease_curve]
    conflicts_with: []
    requires: [principle.motion.ease_not_linear]
    evidence_level: theory
    confidence: high
    sources:
      - {title: "Material Design (v1) — Duration & easing", author: "Google", url: "https://m1.material.io/motion/duration-easing.html", locator: "Acceleration curve; enter vs exit"}
      - {title: "Executing UX Animations: Duration and Motion Characteristics", author: "Nielsen Norman Group", url: "https://www.nngroup.com/articles/animation-duration/", locator: "entering longer than exiting"}

  - id: tech.motion.duration_budget
    type: technique
    name: Keep graphic animations within 100-400 ms
    summary: "Small feedback-like moves take ~100 ms, typical element transitions 200-300 ms, and large full-frame moves up to ~375-400 ms. Longer usually feels sluggish; animations are far more often too long than too short."
    when_to_use: "Choosing default durations for caption/graphic templates."
    how: ["Small pop/highlight: ~100-150 ms", "Caption/lower-third in: ~200-300 ms", "Full-screen graphic/transition: ~300-400 ms"]
    parameters: {small_ms: "100", typical_ms: "200-300", large_ms: "375-400", sluggish_ms: ">=500"}
    avoid_when: "Deliberate slow, cinematic title reveals (calm moods)."
    genres: []
    goals: [goal.energy, goal.clarity]
    uses_capabilities: [cap.graphics.animate_in, cap.graphics.animate_out]
    conflicts_with: []
    requires: []
    evidence_level: theory
    confidence: high
    sources:
      - {title: "Executing UX Animations: Duration and Motion Characteristics", author: "Nielsen Norman Group", url: "https://www.nngroup.com/articles/animation-duration/", locator: "Duration"}
      - {title: "Material Design (v1) — Duration & easing", author: "Google", url: "https://m1.material.io/motion/duration-easing.html", locator: "Duration: mobile ~300 ms, large 375 ms, >400 ms too slow"}

  - id: tech.motion.standard_curve_moves
    type: technique
    name: Standard curve for on-screen repositioning
    summary: "When an element moves or resizes while staying on screen, use a standard ease-in-out curve with quick acceleration and long deceleration. Material 3 uses a stronger variant for its standard token."
    when_to_use: "Text sliding to a new position, graphic resizing, layout changes."
    how: ["M1/M2 standard cubic-bezier(0.4,0,0.2,1)", "M3 standard cubic-bezier(0.2,0,0,1) for snappier settle", "~250-350 ms"]
    parameters: {m1_standard: "cubic-bezier(0.4, 0.0, 0.2, 1)", m3_standard: "cubic-bezier(0.2, 0.0, 0, 1.0)", duration_ms: "250-350"}
    avoid_when: "Entrances/exits (use decelerate/accelerate)."
    genres: []
    goals: [goal.clarity]
    uses_capabilities: [cap.graphics.ease_curve]
    conflicts_with: []
    requires: [principle.motion.ease_not_linear]
    evidence_level: theory
    confidence: medium
    sources:
