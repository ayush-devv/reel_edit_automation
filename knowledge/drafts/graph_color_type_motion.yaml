  - id: tech.motion.staging_single_focus
    type: technique
    name: Stage one focal motion at a time
    summary: "At any moment only one element should be doing something attention-grabbing; everything else stays still. Competing motions split attention and hide the message."
    when_to_use: "Any frame with text plus graphics plus camera moves."
    how: ["Freeze secondary graphics while hero text animates", "Avoid animating text during a whip or zoom transition", "Sequence rather than overlap major moves"]
