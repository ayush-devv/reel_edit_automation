  - id: tech.motion.anticipation
    type: technique
    name: Anticipation before a big move
    summary: "A small opposite movement (slight scale-down or pull-back) before the main action prepares the eye and makes the main move read more clearly. Use sparingly on hero text or graphics, not on every caption."
    when_to_use: "Hook title slams, logo reveals, big number reveals."
    how: ["Scale to ~0.9-0.95 for ~60-100 ms", "Then main move with ease-out", "Optionally overshoot and settle"]
    parameters: {anticipation_scale: "0.9-0.95 (heuristic)", anticipation_ms: "60-100 (heuristic)"}
    avoid_when: "Frequent repeated elements (word captions) — adds latency and fatigue."
    genres: [genre.brand_story, genre.product, genre.montage]
    goals: [goal.energy, goal.retention_first_3s]
    uses_capabilities: [cap.graphics.animate_in, cap.graphics.ease_curve]
    conflicts_with: []
