  - id: tech.transition.zoom_punch
    type: technique
    name: Zoom/punch-in transition and jump-cut punch-ins
    summary: "Alternate framing scale (e.g. 100% to ~115-125%) at cuts within one talking-head take to hide jump cuts and add rhythm; a fast zoom-through can also bridge two shots. Supersample to avoid softness."
