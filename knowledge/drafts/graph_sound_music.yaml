  # ───────────────────────── DUCKING ─────────────────────────

  - id: tech.duck.depth
    type: technique
    name: Music bed depth under speech
    summary: Under speech, keep the music stem's short-term loudness well below the voice — about 18–22 dB for busy or lyrical beds, 12–18 dB for sparse instrumentals. Broadcasters' audits found background music is a top intelligibility complaint, and BBC guidance was to bring music down a further 3–4 dB.
    when_to_use: "Any reel with speech over music (extends playbook rule 20)."
    how: ["Measure voice and bed short-term LUFS during speech", "Set bed 12–22 dB under voice depending on density", "Err lower for older audiences and dense mixes", "Between phrases let it rise only per tech.duck.timing"]
    parameters: {bed_below_voice_lu_sparse: "12–18", bed_below_voice_lu_busy: "18–22", plugin_max_duck_db_default: "-20 (Vindral)", bbc_extra_reduction_db: "3–4"}
    avoid_when: "Music-led montage without speech."
    genres: [genre.talking_head, genre.tutorial, genre.testimonial, genre.brand_story, genre.vlog]
    goals: [goal.clarity, goal.watch_through]
    uses_capabilities: [cap.audio.duck_sidechain, cap.audio.volume_keyframe, cap.analysis.loudness_measure]
    conflicts_with: [anti.mix.music_masks_voice]
    requires: [principle.sound.dialogue_anchor]
    evidence_level: practitioner
    confidence: medium
