  - id: tech.duck.timing
    type: technique
    name: Ducking timing
    summary: Start the duck just before the first word so the onset isn't masked, ramp down quickly, hold through short pauses, and recover slowly. Too-fast release lets music bounce up between words and breaths. Keyframed ducks with 300–800 ms ramps sound most natural in edited reels.
    when_to_use: "Sidechain or keyframe ducking under speech."
    how: ["Keyframe: begin ramp 150–300 ms before first word, reach depth by the word", "Hold through pauses < 0.7–1 s", "Recover over 300–800 ms after the phrase", "Sidechain: attack 10–20 ms, hold 100–300 ms, release 250–500 ms"]
    parameters: {pre_roll_ms: "150–300", duck_ramp_ms: "200–500", hold_through_gap_s: "<0.7–1.0", recover_ms: "300–800", sidechain_attack_ms: "10–20", sidechain_hold_ms: "100–300", sidechain_release_ms: "250–500", ffmpeg_sidechaincompress_defaults: "attack 20, release 250"}
    avoid_when: ""
    genres: []
    goals: [goal.clarity]
    uses_capabilities: [cap.audio.duck_sidechain, cap.audio.volume_keyframe]
