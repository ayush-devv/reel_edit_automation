      - {title: "What their telly tells them, most Brits can't always tell", author: "Hearing Health Matters (reporting BBC/Channel 4 research)", url: "https://hearinghealthmatters.org/hearingnewswatch/2011/what-their-telly-tells-them-most-brits-sometimes-cant-tell/", locator: "background music and audibility"}
