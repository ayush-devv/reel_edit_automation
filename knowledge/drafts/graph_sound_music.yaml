# Sound design, dialogue editing and music editing — knowledge graph draft (v1)
# Extends craft-playbook rules 19–23 and 25. Paraphrased; numbers are starting points, not laws.
# Evidence labels: platform (published spec/standard or platform doc), study (measured/experimental),
# practitioner (vendor/engineer guidance), theory (film-sound theory), single_opinion.
# 30 fps assumed where frames are given (1 frame = 33.3 ms).

nodes:

  # ───────────────────────── PRINCIPLES ─────────────────────────

  - id: principle.sound.sound_on_value
    type: principle
    name: Short-form is watched with sound on
    summary: Sound is part of the product on TikTok-style feeds, not decoration. TikTok-commissioned Kantar research reports most users call sound essential and that audio ads draw more stops than on other platforms. Treat the mix as seriously as the picture, but still make the hook readable muted.
    when_to_use: "Every reel; sets the budget for audio work."
    how: ["Plan the audio layer (voice, bed, SFX, silence) alongside the cut", "Still satisfy the sound-off hook rule (playbook rule 4)"]
    parameters: {}
    avoid_when: "Never ignore; the sound-off caption layer is complementary, not a replacement."
    genres: [genre.talking_head, genre.montage, genre.product, genre.vlog, genre.brand_story]
    goals: [goal.retention_first_3s, goal.emotion, goal.brand_recall]
    uses_capabilities: [cap.audio.mix]
    conflicts_with: []
    requires: []
    evidence_level: study
    confidence: medium
    sources:
      - {title: "Kantar report: How brands are making noise and driving impact with sound on TikTok", author: "TikTok for Business (Kantar, vendor-commissioned)", url: "https://ads.tiktok.com/business/en-US/blog/kantar-report-how-brands-are-making-noise-and-driving-impact-with-sound-on-tiktok", locator: "88% 'sound essential'; 73% stop for audio ads (2021)"}

  - id: principle.sound.synchresis
    type: principle
    name: Synchresis and added value
    summary: When a sound and a visual event coincide, viewers fuse them into one event and credit the image with the sound's meaning (Chion). This is why a whoosh makes a cut feel fast and a hit makes a punch-in feel strong. Sync points are where the edit gains or loses perceived impact.
    when_to_use: "Choosing where SFX, music accents and cuts land."
    how: ["Identify the visual peak frame (impact, reveal, text-in, cut)", "Place a sound whose transient lands on that frame", "Reserve hard sync points for moments that matter"]
    parameters: {}
    avoid_when: "Every frame is a sync point — the effect dilutes (see anti.sfx.overuse)."
    genres: [genre.montage, genre.product, genre.event_recap]
    goals: [goal.energy, goal.emotion]
    uses_capabilities: [cap.audio.sfx_place]
    conflicts_with: []
    requires: []
    evidence_level: theory
    confidence: high
    sources:
      - {title: "Audio-Vision: Sound on Screen (2nd ed.)", author: "Michel Chion, trans. C. Gorbman", url: "https://econtact.ca/19_2/basanta_synchresis.html", locator: "Basanta's summary of 'synchresis' and 'added value'"}
      - {title: "Point of synchronization", author: "USC Scalar, Audiovisualities", url: "https://scalar.usc.edu/works/audiovisualities/point-of-synchronization", locator: "whole page"}

  - id: principle.sound.av_sync_tolerance
    type: principle
    name: Audio-early is noticed sooner than audio-late
    summary: ITU-R BT.1359 puts detectability of A/V offset at about 45 ms when audio leads and about 125 ms when audio lags (acceptability roughly +90/−185 ms). A sync sound that arrives early reads as wrong faster than one slightly late. At 30 fps, more than one frame early is risky; up to three frames late is usually unnoticed.
    when_to_use: "Placing SFX, music hits, and dialogue after any slip edit."
    how: ["Align SFX transient to the visual frame", "If rounding is needed, round the sound later (0 to +1 frame), never earlier", "Re-check lip sync after retiming"]
    parameters: {audio_lead_detect_ms: 45, audio_lag_detect_ms: 125, audio_lead_accept_ms: 90, audio_lag_accept_ms: "185–190", safe_sfx_offset_frames_30fps: "0 to +1"}
    avoid_when: ""
    genres: []
    goals: [goal.clarity, goal.trust]
    uses_capabilities: [cap.audio.sfx_place, cap.audio.slip]
    conflicts_with: []
    requires: []
    evidence_level: study
    confidence: high
    sources:
      - {title: "Audio-to-video synchronization (summarising ITU-R BT.1359-1)", author: "Wikipedia", url: "https://en.wikipedia.org/wiki/Audio-to-video_synchronization", locator: "Recommendations section"}
      - {title: "A subjective study of the perceptual acceptability of audio-video desynchronization in sports videos", author: "arXiv 2212.01686", url: "https://arxiv.org/pdf/2212.01686", locator: "Introduction (BT.1359 thresholds, newsreader material)"}

  - id: principle.sound.dynamic_contrast
    type: principle
    name: Impact comes from contrast, not loudness
    summary: Big moments feel big because something quieter came before them. Trailer sound designers keep pre-hit layers soft, cut to near-silence just before an impact, and avoid over-compression. A reel that is loud everywhere has no peaks left to spend.
    when_to_use: "Reveals, punchlines, drops, before/after moments."
    how: ["Pull bed and SFX down 6–12 dB in the 0.3–1 s before the peak", "Optionally drop to room tone only for 2–10 frames", "Land the hit/drop at full level"]
    parameters: {pre_peak_dip_db: "6–12", void_length_frames: "2–10"}
    avoid_when: "Talking-head stretches where steady intelligibility matters more than drama."
    genres: [genre.product, genre.montage, genre.transformation, genre.brand_story]
    goals: [goal.energy, goal.emotion, goal.rewatch]
    uses_capabilities: [cap.audio.volume_keyframe, cap.audio.mix]
    conflicts_with: [anti.loudness.overlimiting]
    requires: []
    evidence_level: practitioner
    confidence: medium
    sources:
      - {title: "5 Tips for Designing Trailer Sound Effects", author: "Krotos", url: "https://krotos.studio/blog/trailer-sound-design-tips-tricks", locator: "dynamics/hits and silence tips"}
      - {title: "Designing a Movie for Sound", author: "Randy Thom", url: "https://filmsound.org/articles/designing_for_sound.htm", locator: "sections on space for sound"}

  - id: principle.sound.leave_space
    type: principle
    name: Leave room for sound to speak
    summary: Wall-to-wall talk and stacked effects crowd sound out. Randy Thom argues for brief holds before or after lines and for selective, sparse layers so each sound carries meaning. In short-form this means fewer, better-chosen sounds and occasional deliberate air.
    when_to_use: "Emotional beats, reveals, endings; when the mix feels busy."
    how: ["Decide which single layer owns each moment (voice, music, or SFX)", "Mute or duck the others", "Allow one held beat at the emotional peak"]
    parameters: {layers_owning_a_moment: 1}
    avoid_when: "Information-dense tutorials where every second is content."
    genres: [genre.brand_story, genre.testimonial, genre.vlog]
    goals: [goal.emotion, goal.clarity]
    uses_capabilities: [cap.audio.mix, cap.audio.volume_keyframe]
    conflicts_with: []
    requires: []
    evidence_level: theory
    confidence: medium
    sources:
      - {title: "Designing a Movie for Sound", author: "Randy Thom", url: "https://filmsound.org/articles/designing_for_sound.htm", locator: "on wall-to-wall dialogue and lingering shots"}

  - id: principle.sound.small_speaker_translation
    type: principle
    name: Mix for phone speakers
    summary: Most reels play on phone speakers that roll off heavily below roughly 150–300 Hz and are often near-mono. Sub-bass hits and bass-only music vanish; anything carried only by low end or stereo width is lost. Check every mix through a high-pass at 200–400 Hz and in mono.
    when_to_use: "Final mix QA; choosing SFX and music."
    how: ["Audition with a temporary HPF at 200, 300, 400 Hz", "Fold to mono and confirm nothing disappears", "Give hits and bass a mid-range layer or saturation so they read without sub"]
    parameters: {phone_rolloff_hz: "~150–300 (blog estimates vary)", check_hpf_hz: [200, 300, 400], mono_check: true}
    avoid_when: ""
    genres: []
    goals: [goal.clarity, goal.energy]
    uses_capabilities: [cap.audio.eq, cap.analysis.mono_check]
    conflicts_with: []
    requires: []
    evidence_level: practitioner
    confidence: medium
    sources:
      - {title: "How to Make Bass Audible on Phone Speakers", author: "LANDR", url: "https://blog.landr.com/make-bass-audible-phone-speakers", locator: "phone roll-off below ~200 Hz"}
      - {title: "8 Tips for Great Sounding Mixes on Small Speakers", author: "Waves", url: "https://www.waves.com/tips-for-great-mixes-on-small-speakers", locator: "HPF presets 200/400/800 Hz; mono check"}

  - id: principle.sound.dialogue_anchor
    type: principle
    name: Dialogue is the anchor of the mix
    summary: Long-form specs anchor loudness on dialogue (Netflix measures dialogue-gated loudness at −27 LKFS ±2 LU) rather than the whole mix. For reels, set the voice level first and fit music and SFX around it, never the reverse.
    when_to_use: "Any reel with speech."
    how: ["Level-match voice first", "Set bed relative to voice (tech.duck.depth)", "Set SFX relative to voice", "Only then normalise the master"]
    parameters: {netflix_dialog_gated_lkfs: "-27 ±2 (long-form reference only)"}
    avoid_when: "Music-only montages (music becomes the anchor)."
    genres: [genre.talking_head, genre.interview, genre.podcast_clip, genre.tutorial, genre.testimonial]
    goals: [goal.clarity, goal.trust]
    uses_capabilities: [cap.analysis.loudness_measure, cap.audio.clip_gain]
    conflicts_with: []
    requires: []
    evidence_level: platform
    confidence: high
    sources:
      - {title: "Netflix Sound Mix Specifications & Best Practices v1.5", author: "Netflix", url: "https://backlothelp.netflix.com/hc/en-us/articles/360001794307-Netflix-Sound-Mix-Specifications-Best-Practices-v1-5", locator: "Loudness: dialogue-gated −27 LKFS"}

  - id: principle.dialogue.repair_deepest_first
    type: principle
    name: Repair the deepest damage first
    summary: iZotope's repair order fixes the most destructive problems first so later tools work on cleaner audio — clipping, then stereo/phase, then clicks, then hum, then broadband noise, then variable noise like sibilance and breaths. EQ before denoise makes noise louder and the denoiser work harder.
    when_to_use: "Ordering any dialogue clean-up chain."
    how: ["De-clip", "Fix phase/azimuth if stereo", "Mouth de-click", "De-hum (only if present)", "Denoise", "De-reverb", "De-ess / breath control", "Then tonal EQ and dynamics"]
    parameters: {}
    avoid_when: "Clean studio audio — skip the stages with nothing to fix."
    genres: [genre.talking_head, genre.interview, genre.podcast_clip, genre.vlog]
    goals: [goal.clarity, goal.trust]
    uses_capabilities: [cap.audio.declip, cap.audio.declick, cap.audio.dehum, cap.audio.denoise, cap.audio.dereverb, cap.audio.deess, cap.audio.breath_reduce]
    conflicts_with: []
    requires: []
    evidence_level: practitioner
    confidence: high
    sources:
      - {title: "Order of audio repair operations", author: "iZotope", url: "https://www.izotope.com/en/learn/order-of-audio-repair-operations", locator: "whole article"}

  # ───────────────────────── LOUDNESS ─────────────────────────

  - id: principle.loudness.lufs_measurement
    type: principle
    name: Measure loudness in LUFS, not peaks
    summary: ITU-R BS.1770 loudness (LUFS/LKFS) is what normalising platforms read. Integrated LUFS covers the whole piece, short-term uses a 3 s window, momentary 400 ms; LRA describes macro-dynamics; true peak (dBTP) catches inter-sample overs that codecs turn into distortion. Peak normalisation alone says nothing about perceived level.
    when_to_use: "QA of every export; comparing stems (voice vs bed)."
    how: ["Measure integrated LUFS, LRA and true peak on the master", "Use short-term LUFS per stem to compare voice and music", "Log values in the style vector"]
    parameters: {short_term_window_s: 3, momentary_window_ms: 400}
    avoid_when: ""
    genres: []
    goals: [goal.clarity]
    uses_capabilities: [cap.analysis.loudness_measure]
    conflicts_with: []
    requires: []
    evidence_level: platform
    confidence: high
    sources:
      - {title: "EBU R 128 Loudness normalisation and permitted maximum level", author: "EBU", url: "https://tech.ebu.ch/publications/r128", locator: "definitions; EBU Tech 3341/3342 meters"}
      - {title: "Loudness normalization on Spotify", author: "Spotify for Artists", url: "https://support.spotify.com/artists/article/loudness-normalization/", locator: "measured per ITU 1770"}

  - id: principle.loudness.reference_targets
    type: principle
    name: Published loudness targets (reference map)
    summary: "Broadcast EBU R128: −23 LUFS, true peak ≤ −1 dBTP. AES TD1008 streaming: speech −18, music −16, mixed ~−17 LUFS. Spotify plays at −14 (Loud −11, Quiet −19). Apple Podcasts asks for about −16 LUFS, ≤ −1 dBTP. YouTube −14 is widely reported (turn-down only) but undocumented. No reel platform publishes a target."
    when_to_use: "Choosing an export target or explaining one."
    how: ["Default short-form to tech.loudness.short_form_master", "Use −23 only for broadcast deliverables", "Use −16 for podcast audio exports"]
    parameters: {ebu_r128_lufs: -23, ebu_true_peak_dbtp: -1, aes_td1008_speech_lufs: -18, aes_td1008_music_lufs: -16, aes_td1008_mixed_lufs: -17, spotify_normal_lufs: -14, spotify_loud_lufs: -11, spotify_quiet_lufs: -19, apple_podcasts_lufs: -16, youtube_reported_lufs: "-14 (unofficial)"}
    avoid_when: ""
    genres: []
    goals: [goal.clarity]
    uses_capabilities: [cap.audio.loudness_normalize]
    conflicts_with: []
    requires: [principle.loudness.lufs_measurement]
    evidence_level: platform
    confidence: high
    sources:
      - {title: "EBU R 128", author: "EBU", url: "https://tech.ebu.ch/publications/r128", locator: "Target Level −23.0 LUFS; max true peak −1 dBTP"}
      - {title: "AES TD1008 explained", author: "Ian Shepherd, Production Advice", url: "https://productionadvice.co.uk/td1008/", locator: "Distribution Loudness values"}
      - {title: "Understanding Loudness for Streaming Audio", author: "Telos Alliance", url: "https://docs.telosalliance.com/docs/understanding-loudness-for-streaming-audio", locator: "TD1008 −17 for mixed content"}
      - {title: "Loudness normalization on Spotify", author: "Spotify for Artists", url: "https://support.spotify.com/artists/article/loudness-normalization/", locator: "Loud/Normal/Quiet levels"}
      - {title: "Audio requirements", author: "Apple Podcasts for Creators", url: "https://podcasters.apple.com/support/audio-requirements", locator: "loudness and true peak"}

  - id: tech.loudness.short_form_master
    type: technique
    name: Short-form master at −14 LUFS / −1 dBTP
    summary: Master reels to about −14 LUFS integrated with a true-peak ceiling of −1 dBTP, using a true-peak limiter then two-pass loudness normalisation. Quieter masters may sit weak next to neighbours in the feed; louder ones gain nothing where platforms turn down. If you push louder than −14, lower the ceiling to −2 dBTP.
    when_to_use: "Final export of every reel (extends playbook rule 19)."
    how: ["Limit with a true-peak limiter at −1 dBTP (≤ 3 dB gain reduction ideally)", "ffmpeg loudnorm pass 1: measure", "Pass 2: loudnorm=I=-14:TP=-1:LRA=7 with measured_* values and linear=true", "Re-measure; accept ±1 LU"]
    parameters: {integrated_lufs: -14, tolerance_lu: "±1", true_peak_dbtp: -1, true_peak_if_louder_than_-14: -2, lra_lu: "≤7–9 (heuristic for mobile)", limiter_gr_db: "≤3", ffmpeg_loudnorm_defaults: "I=-24, TP=-2, LRA=7 (override them)"}
    avoid_when: "Broadcast delivery (use −23) or podcast audio (−16)."
    genres: []
    goals: [goal.clarity, goal.energy]
    uses_capabilities: [cap.audio.loudness_normalize, cap.audio.true_peak_limit, cap.analysis.loudness_measure]
    conflicts_with: [anti.loudness.overlimiting]
    requires: [principle.loudness.lufs_measurement]
    evidence_level: practitioner
    confidence: medium
    sources:
      - {title: "Loudness normalization on Spotify", author: "Spotify for Artists", url: "https://support.spotify.com/artists/article/loudness-normalization/", locator: "−1 dBTP lossy; −2 dBTP if louder than −14"}
      - {title: "FFmpeg Filters Documentation — loudnorm", author: "FFmpeg", url: "https://ffmpeg.org/ffmpeg-filters.html#loudnorm", locator: "loudnorm options I, LRA, TP, measured_*, linear"}
      - {title: "Craft playbook (internal)", author: "project research", url: "docs/research/craft-playbook.md", locator: "§5 Loudness; rule 19"}

  - id: tech.dialogue.level_match
    type: technique
    name: Level-match dialogue clips before processing
    summary: Bring every dialogue clip to a consistent level with clip gain before compression, so the compressor does gentle smoothing rather than fixing big jumps. Jump-cut reels splice takes recorded at different distances; mismatches of 2–3 LU between adjacent clips are audible.
    when_to_use: "After the dialogue cut, before the voice chain."
    how: ["Measure short-term LUFS per clip (speech only)", "Apply clip gain so clips sit within ±1 LU of the target", "Then compress; then automate any remaining words"]
    parameters: {clip_to_clip_tolerance_lu: "±1 (max ±2)", voice_stem_short_term_lufs: "≈ −16 to −18 before master limiting (heuristic)"}
    avoid_when: "Intentional perspective change (whisper, shout) — keep the performance."
    genres: [genre.talking_head, genre.podcast_clip, genre.interview, genre.tutorial]
    goals: [goal.clarity, goal.trust]
    uses_capabilities: [cap.audio.clip_gain, cap.analysis.loudness_measure]
    conflicts_with: []
    requires: []
    evidence_level: practitioner
    confidence: medium
    sources:
      - {title: "Dialogue Editing for Motion Pictures (2nd ed.)", author: "John Purcell", url: "https://routledge.com/9780415828178", locator: "chapters on balancing and room tone"}
      - {title: "Introduction to Dialogue Editing", author: "Post Super", url: "https://post-super.com/blog/introduction-to-dialogue-editing", locator: "clip gain before automation"}

  - id: anti.loudness.overlimiting
    type: anti_pattern
    name: Crushing the master for loudness
    summary: Limiting a reel to −8 or −9 LUFS flattens peaks, adds distortion after AAC encoding, and gains nothing where platforms turn loud uploads down. Power in the mix comes from dynamic contrast, not maximum loudness.
    when_to_use: "Flag when integrated > −12 LUFS or limiter gain reduction > 4–6 dB."
    how: ["Back off the limiter", "Restore dynamics around hits", "Re-normalise to −14"]
    parameters: {flag_integrated_lufs_above: -12, flag_limiter_gr_db_above: 4}
    avoid_when: ""
    genres: []
    goals: [goal.energy]
    uses_capabilities: [cap.audio.true_peak_limit, cap.analysis.loudness_measure]
    conflicts_with: [tech.loudness.short_form_master, principle.sound.dynamic_contrast]
    requires: []
    evidence_level: practitioner
    confidence: medium
    sources:
      - {title: "Loudness normalization on Spotify", author: "Spotify for Artists", url: "https://support.spotify.com/artists/article/loudness-normalization/", locator: "louder tracks turned down; distortion warning"}
      - {title: "5 Tips for Designing Trailer Sound Effects", author: "Krotos", url: "https://krotos.studio/blog/trailer-sound-design-tips-tricks", locator: "power from increasing dynamic range"}

  # ───────────────────────── DIALOGUE EDITING ─────────────────────────

  - id: tech.dialogue.edit_fades
    type: technique
    name: Micro-fade every dialogue edit
    summary: Any edit that starts or ends at non-zero amplitude clicks. Put a short fade or crossfade on every boundary — 5–10 ms inside or next to speech so consonants survive, 20–50 ms where the cut sits in room tone. Batch-apply to all edits.
    when_to_use: "Every audio edit point (refines playbook rule 10's 30 ms)."
    how: ["Batch-fade all clip boundaries", "Use 5–10 ms at speech-adjacent edits", "Use 20–50 ms equal-power crossfades in pauses", "Listen for dulled consonants; shorten if so"]
    parameters: {fade_speech_adjacent_ms: "5–10", fade_in_pause_ms: "20–50", min_fade_ms: 1, curve: "equal-power for crossfades"}
    avoid_when: "Never skip; only the length changes."
    genres: []
    goals: [goal.clarity]
    uses_capabilities: [cap.audio.fade, cap.audio.crossfade]
    conflicts_with: []
    requires: []
    evidence_level: practitioner
    confidence: high
    sources:
      - {title: "How to fade (Pro Tools User Guide)", author: "Avid", url: "https://www.avid.com/pro-tools/user-guide/how-to-fade", locator: "short fades to remove pops/clicks; batch fades"}
      - {title: "Fades handout (EMS F2013)", author: "University of Iowa Electronic Music Studios", url: "https://theremin.music.uiowa.edu/EMS.Files/Handouts/2013/F.2013/EMS.F2013.Fades.pdf", locator: "5–10 ms minimum recommendation"}

  - id: tech.dialogue.cut_point_selection
    type: technique
    name: Choose dialogue cut points that hide
    summary: Edits hide best in true pauses, on the attack of a hard consonant or plosive (p, t, k, b), or under a breath that is then trimmed. Cutting mid-vowel or across a falling inflection exposes the join. Keep the sentence's natural pitch fall at the end of a thought.
    when_to_use: "Silence removal and jump cuts in talking-head and podcast clips."
    how: ["Prefer cuts in pauses ≥150 ms (playbook rule 9)", "Else cut just before a plosive onset", "Avoid joining two rising inflections", "Check zero-crossing then add a micro-fade"]
    parameters: {min_pause_ms: 150, prefer: "pause > plosive onset > breath"}
    avoid_when: "Never cut inside a word or a vowel."
    genres: [genre.talking_head, genre.podcast_clip, genre.interview, genre.tutorial]
    goals: [goal.clarity, goal.watch_through]
    uses_capabilities: [cap.cut.ripple_delete, cap.analysis.transcribe, cap.audio.fade]
    conflicts_with: []
    requires: [tech.dialogue.edit_fades]
    evidence_level: practitioner
    confidence: medium
    sources:
      - {title: "Dialogue Editing for Motion Pictures (2nd ed.)", author: "John Purcell", url: "https://routledge.com/9780415828178", locator: "'Choosing the Crossfade' / editing chapters"}
      - {title: "Craft playbook (internal)", author: "project research", url: "docs/research/craft-playbook.md", locator: "rule 9"}

  - id: tech.dialogue.room_tone_fill
    type: technique
    name: Fill gaps with room tone
    summary: Fill every gap between dialogue clips with clean room tone so the background never drops out. Source it from on-set recordings, clip handles, or spliced clean fragments; avoid tone containing breaths or rustles. Very short snippets looped over long gaps sound repetitive.
    when_to_use: "Any gap, removed breath or replaced noise in dialogue."
    how: ["Collect 30–60 s of tone at the shoot if possible", "Else harvest clean tone from handles", "Use pieces ≥10 frames; crossfade joins 20–100 ms", "Match tone level to the background under speech"]
    parameters: {record_tone_s: "30–60", min_piece_frames: 10, join_crossfade_ms: "20–100"}
    avoid_when: "A hard cut to silence is the creative intent (rare; see tech.silence.music_dropout — still keep tone)."
    genres: [genre.talking_head, genre.interview, genre.podcast_clip, genre.testimonial, genre.vlog]
    goals: [goal.clarity, goal.trust]
    uses_capabilities: [cap.audio.room_tone_fill, cap.audio.crossfade]
    conflicts_with: [anti.dialogue.dead_air_or_gating]
    requires: []
    evidence_level: practitioner
    confidence: high
    sources:
      - {title: "Room tone (Frame.io Workflow Guide)", author: "Frame.io", url: "https://workflow.frame.io/guide/roomtone", locator: "sourcing and uses; ~10-frame minimum"}
      - {title: "Introduction to Dialogue Editing", author: "Post Super", url: "https://post-super.com/blog/introduction-to-dialogue-editing", locator: "30–60 s room tone"}

  - id: anti.dialogue.dead_air_or_gating
    type: anti_pattern
    name: Dead air and hard-gated backgrounds
    summary: Dropping to digital silence between words, or using a hard noise gate, makes the background pop in and out with speech. Viewers notice the noise more, not less. Keep a continuous low background via room tone or a gentle expander with limited range.
    when_to_use: "Flag when the noise floor between words falls below −70 dBFS or swings > 10 dB."
    how: ["Replace digital silence with room tone", "Replace gates with an expander (tech.voice.expander)"]
    parameters: {flag_floor_swing_db: 10}
    avoid_when: ""
    genres: []
    goals: [goal.clarity, goal.trust]
    uses_capabilities: [cap.audio.room_tone_fill, cap.audio.expand]
    conflicts_with: [tech.dialogue.room_tone_fill]
    requires: []
    evidence_level: practitioner
    confidence: high
    sources:
      - {title: "Audio Engineering in Professional Podcast Post-Production: Gates", author: "Finchley", url: "https://www.finchley.co.uk/finchley-learning/visual-podcast/audio-engineering-in-a-professional-podcast-post-production-tools-gates", locator: "pumping and room tone"}
      - {title: "Room tone (Frame.io Workflow Guide)", author: "Frame.io", url: "https://workflow.frame.io/guide/roomtone", locator: "background popping in and out"}

  - id: tech.dialogue.breath_attenuation
    type: technique
    name: Attenuate breaths, don't erase them
    summary: Removing every breath sounds robotic and can hurt comprehension; loud breaths distract. Use target-style reduction so only loud breaths are lowered and quiet ones stay natural. In jump-cut reels, breaths inside removed gaps disappear anyway; keep the ones that frame a sentence.
    when_to_use: "Voice-over and talking head with audible breaths, before compression (which raises them)."
