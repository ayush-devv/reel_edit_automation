  - id: tech.music.ambient_crossfade
    type: technique
    name: Long crossfade for unstructured music
    summary: Ambient, pad or drone tracks with no clear beat tolerate edits almost anywhere; join point A to point B with a long crossfade of about half a second and adjust by ear. Harmonic clashes are the main risk, so slip until chords line up.
    when_to_use: "Atmospheric beds under talking head or testimonial."
    how: ["Cut to length ignoring structure", "Crossfade ~0.5 s (15 frames at 30 fps)", "Slip/lengthen fade until no harmonic clash"]
    parameters: {crossfade_s: "0.3–1.0 (start 0.5)"}
    avoid_when: "Rhythmic music (bar grid will break)."
    genres: [genre.talking_head, genre.testimonial, genre.brand_story]
    goals: [goal.emotion]
    uses_capabilities: [cap.audio.crossfade]
