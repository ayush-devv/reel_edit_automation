  - id: tech.repair.dereverb
    type: technique
    name: Subtle de-reverb for roomy recordings
    summary: Phone recordings in bare rooms sound distant. A light de-reverb pass after denoise tightens the voice; heavy settings produce warbly artifacts. Lowering sustain with a transient shaper is an alternative.
    when_to_use: "Echoey rooms, phone held at arm's length."
