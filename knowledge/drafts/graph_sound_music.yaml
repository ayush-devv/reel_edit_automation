  - id: anti.sfx.overuse
    type: anti_pattern
    name: SFX on every cut
    summary: When every edit gets a boom or whoosh, none of them land and the reel reads as a template. Reserve SFX for visible events and key beats; about 8 per minute reads as designed, ~20 as generic.
    when_to_use: "Flag when SFX > 8 per 60 s or the same SFX on consecutive cuts."
