  - id: tech.duck.spectral_carve
    type: technique
    name: Carve a speech window in the music
    summary: Instead of (or on top of) a deep level duck, dip the music only in the speech-critical band (about 1–5 kHz) when the voice is present, using sidechained dynamic EQ. The bed keeps its energy and low end while words stay clear. Research also supports downward expansion of the background over plain ducking.
    when_to_use: "Energetic beds that sound limp when fully ducked; montage with occasional VO."
