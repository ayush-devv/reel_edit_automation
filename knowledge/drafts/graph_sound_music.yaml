  - id: tech.music.beat_synced_cuts
    type: technique
    name: Beat-synced cutting
    summary: "Frames per beat = fps × 60 / BPM (120 BPM at 30 fps = 15 frames). Cut on downbeats or every 2–4 beats for normal sections, every beat only at peaks. When the beat falls between frames, put the cut on or one frame before the transient so the sound is never early relative to the picture."
    when_to_use: "Montages, recaps, music-led product reels."
    how: ["Detect BPM and beat grid (check for half/double-time errors)", "Compute frames per beat", "Snap cuts to downbeats; vary between 1, 2 and 4 beats", "Round toward audio-late (principle.sound.av_sync_tolerance)"]
