      - {title: "How to Make Bass Audible on Phone Speakers", author: "LANDR", url: "https://blog.landr.com/make-bass-audible-phone-speakers", locator: "harmonics for small speakers"}

  - id: tech.sfx.variation
    type: technique
    name: Vary repeated SFX
    summary: The same sample on consecutive events sounds mechanical. Rotate between variants and add slight random pitch/speed changes so repeated whooshes or pops feel organic.
    when_to_use: "Any SFX used more than twice in a reel."
    how: ["Keep 3–5 variants per SFX type", "Never repeat a sample on consecutive events", "Randomise pitch ±1–2 semitones"]
    parameters: {variants_per_type: "3–5", pitch_jitter_semitones: "±1–2"}
    avoid_when: "A deliberate signature sound (brand sonic logo)."
