  - id: tech.voice.expander
    type: technique
    name: Downward expander instead of a gate
    summary: To reduce residual noise between phrases, use a gentle downward expander (about 1.5:1–2:1) with a limited range (6–15 dB) so room tone dips but never vanishes. A gate is an expander with an extreme ratio and causes pumping.
