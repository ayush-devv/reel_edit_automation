  - id: anti.duck.pumping
    type: anti_pattern
    name: Pumping music between words
    summary: A fast release lets the bed surge up in every breath and comma, so the music audibly breathes against the speech. It's distracting and reads as amateur.
    when_to_use: "Flag when the bed rises > 6 dB in gaps shorter than 700 ms."
