    summary: Phone mics already roll off lows and apply their own processing; the usual faults are room echo, boxiness (300–600 Hz), harsh upper mids (2–4 kHz), handling noise and occasional clipping. Clean and subtract rather than boost; never add low end the listener's phone can't play.
