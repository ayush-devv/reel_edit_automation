  - id: tech.music.phrase_aligned_start
    type: technique
    name: Start music on a phrase or fade it in
    summary: Music entering mid-phrase sounds like a mistake. Start on the downbeat of a phrase (ideally aligned to the first cut or hook word), or start mid-track with a 200–500 ms fade-in under speech so the entry is not exposed.
