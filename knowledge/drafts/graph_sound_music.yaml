  - id: tech.repair.denoise
    type: technique
    name: Moderate noise reduction
    summary: Broadband noise (AC, traffic, hiss) is reduced after clicks and hum. A dialogue-aware denoiser followed by a gentle spectral pass beats one heavy pass; reductions near 18 dB and beyond tend to leave phasey, hollow artifacts. Aim to lower noise, not erase it.
    when_to_use: "Noisy phone or on-location dialogue."
