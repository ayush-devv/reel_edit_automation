  # ───────────────────────── MUSIC EDITING ─────────────────────────

  - id: tech.music.edit_on_bars_phrases
    type: technique
    name: Edit music on bars and phrases
    summary: Shorten or extend music by removing or repeating whole bars, ideally whole 4- or 8-bar phrases, joined on matching downbeats. Edits that keep the bar grid are invisible; edits that skip half a beat are heard instantly.
    when_to_use: "Cutting any rhythmic track to length."
    how: ["Detect BPM and downbeats", "Pick an out-point and in-point on equivalent beats of the bar (ideally phrase starts)", "Join with a 5–20 ms crossfade placed just before the transient", "Listen across the join twice"]
    parameters: {unit: "1 bar min; prefer 4/8/16-bar phrases", join_crossfade_ms: "5–20 before the transient"}
    avoid_when: "Free-time ambient pads (use tech.music.ambient_crossfade)."
    genres: [genre.montage, genre.event_recap, genre.product, genre.brand_story]
    goals: [goal.energy, goal.watch_through]
    uses_capabilities: [cap.analysis.beat_detect, cap.audio.crossfade, cap.audio.music_retime]
    conflicts_with: [anti.music.off_grid_edit]
