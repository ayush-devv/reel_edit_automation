  - id: tech.repair.mouth_declick
    type: technique
    name: Remove mouth clicks before noise reduction
    summary: Dry-mouth clicks and lip smacks are short transients; phone and lav recordings close to the mouth catch many. Remove them before denoise so the noise model is not skewed. Broader thumps need interpolation instead.
    when_to_use: "Close-miked voice, voice-over, ASMR-adjacent close talk."
    how: ["Run a mouth de-click pass at low-to-medium sensitivity", "Spot-fix remaining thumps with spectral interpolation", "Listen for dulled consonants"]
