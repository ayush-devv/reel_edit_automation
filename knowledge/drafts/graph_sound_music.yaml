  - id: tech.sfx.nat_sound_bed
    type: technique
    name: Natural sound under b-roll
    summary: B-roll with its own sync sound (pour, click, crowd, keyboard) or a matching ambience feels real; silent b-roll over music feels like stock. Keep nat sound low under speech and let it pop up briefly in gaps.
    when_to_use: "B-roll inserts, product close-ups, vlog location shots."
