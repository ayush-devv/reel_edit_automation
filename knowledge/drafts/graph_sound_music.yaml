  # ───────────────────────── VOICE PROCESSING ─────────────────────────

  - id: tech.voice.highpass
    type: technique
    name: High-pass the voice
    summary: Remove rumble, handling noise and plosive thumps below the voice with a high-pass filter around 80 Hz for lower voices and 100 Hz for higher ones. Phone speakers can't reproduce that range anyway, so it only costs headroom.
    when_to_use: "Every voice track, first EQ move."
    how: ["HPF at 80–100 Hz, 12–18 dB/oct", "Raise to 100–120 Hz for handheld/phone footage with handling noise", "Check the voice doesn't thin out"]
    parameters: {cutoff_hz: "80 (lower voice) – 100 (higher voice); up to 120 for phone handling noise", slope_db_per_oct: "12–18"}
    avoid_when: "Deep-voiced narration meant for headphones — stay at ≤80 Hz."
    genres: []
