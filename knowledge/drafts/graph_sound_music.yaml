  - id: tech.voice.mud_cut
    type: technique
    name: Cut low-mid mud and boxiness
    summary: Close or small-room recordings build up in roughly 200–500 Hz, making voices muffled or boxy. A wide, modest cut clears this; too much leaves the voice thin. Find the resonance by sweeping, don't cut blindly.
    when_to_use: "Muddy, boxy or 'cardboard' voices; phone recordings in small rooms."
