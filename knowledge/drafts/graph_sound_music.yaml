  - id: tech.sfx.layering
    type: technique
    name: Layer hits for small speakers
    summary: Designed impacts are built from a transient/click layer, a mid 'body' layer and a sub layer, each EQ'd into its own band. On phones the sub disappears, so the transient and body (roughly 150 Hz–4 kHz) must carry the impact.
    when_to_use: "Creating or choosing hits, booms, drops."
    how: ["Layer transient + body + sub", "EQ each layer to its band to avoid clashes", "Check with HPF at 200–300 Hz — the hit must still read"]
    parameters: {layers: "transient, body, sub", body_band_hz: "150–4000"}
    avoid_when: ""
