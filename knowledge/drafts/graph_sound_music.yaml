  - id: tech.music.backtime_ending
    type: technique
    name: Backtime the music to the last frame
    summary: Place the track's real ending so it lands on the video's end, then make the length edit earlier (mid-track, on a phrase). The song resolves naturally instead of fading or being chopped. For loopable reels, edit so the last bar flows into the first.
    when_to_use: "Any reel using a track with a composed ending."
    how: ["Align the musical ending to the final frame (or 0.3–0.5 s after the last word)", "Find a phrase boundary earlier where the excess can be removed", "Join with tech.music.edit_on_bars_phrases", "Loop variant: end on the bar before the downbeat that matches frame 1"]
    parameters: {end_tail_after_last_word_s: "≤0.5 (playbook rule 29)"}
    avoid_when: "Track has no usable ending (use tech.music.ring_out_ending)."
    genres: [genre.montage, genre.brand_story, genre.product, genre.event_recap]
    goals: [goal.watch_through, goal.rewatch]
    uses_capabilities: [cap.audio.music_retime, cap.analysis.beat_detect]
