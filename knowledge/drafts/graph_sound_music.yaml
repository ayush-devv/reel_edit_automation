  - id: tech.music.riser_into_drop
    type: technique
    name: Build and drop on the reveal
    summary: Tension and release — a riser or musical build of a few seconds peaks exactly on the reveal, often with a brief near-silence just before the drop or hit. The contrast makes the drop feel bigger than any level change could.
    when_to_use: "Transformations, product reveals, before/after, the first big moment."
    how: ["Pick a drop in the track or add an SFX riser 1–4 s long", "Align the riser peak/drop downbeat to the reveal frame", "Optional void: cut to room tone 2–10 frames before the drop", "Land a hit with the drop"]
