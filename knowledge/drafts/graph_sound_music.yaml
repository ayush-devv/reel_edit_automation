  - id: tech.voice.deess
    type: technique
    name: De-ess sibilance
    summary: Harsh s/sh/t sounds cluster around 4–10 kHz (often 5–8 kHz) and get worse after compression and presence EQ. Use a split-band de-esser that only reduces the high band, aiming for 3–6 dB reduction on sibilants and none on ordinary consonants.
    when_to_use: "Bright voices; after compression/presence boost; earbuds listening."
