  - id: tech.voice.compression
    type: technique
    name: Gentle voice compression
    summary: Compression evens out word-to-word level so speech stays above the bed. Start around 3:1, attack 10–25 ms (lets consonants through), release 60–200 ms, with 3–6 dB gain reduction on louder phrases. More than that pumps and raises breaths and noise.
    when_to_use: "Every speech track after level matching."
