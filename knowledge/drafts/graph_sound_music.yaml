  # ───────────────────────── SILENCE & SPLIT EDITS ─────────────────────────

  - id: tech.silence.music_dropout
    type: technique
    name: Music dropout before the key line
    summary: Cutting the music (to room tone, not digital silence) for 0.3–1 s right before a punchline, stat or confession focuses attention like a spotlight. The bed's return afterwards adds lift.
    when_to_use: "Punchlines, key claims, emotional admissions — once or twice per reel."
    how: ["Fade or cut music 0.3–1 s before the line (cut on a beat)", "Keep room tone", "Bring music back on the next downbeat, optionally with a hit"]
    parameters: {dropout_s: "0.3–1.0", max_per_reel: 2}
    avoid_when: "Information-dense tutorials; first 2 s (risk of looking broken)."
    genres: [genre.talking_head, genre.testimonial, genre.brand_story, genre.podcast_clip]
    goals: [goal.emotion, goal.shares_saves]
    uses_capabilities: [cap.audio.volume_keyframe, cap.audio.room_tone_fill]
    conflicts_with: []
    requires: [principle.sound.dynamic_contrast]
    evidence_level: practitioner
    confidence: medium
    sources:
      - {title: "5 Tips for Designing Trailer Sound Effects", author: "Krotos", url: "https://krotos.studio/blog/trailer-sound-design-tips-tricks", locator: "silence as contrast; void"}
      - {title: "Designing a Movie for Sound", author: "Randy Thom", url: "https://filmsound.org/articles/designing_for_sound.htm", locator: "space for sound"}

  - id: tech.silence.linger_after_peak
    type: technique
    name: Hold a beat after the emotional peak
    summary: Thom argues editors trim away the moments after a line that let audiences feel it. At one emotional peak per reel, keep 0.5–1.5 s of held reaction with room tone or a sustained note — an intentional exception to aggressive silence removal.
    when_to_use: "Testimonials, confessions, transformations — the single emotional peak."
    how: ["Identify the peak line", "Keep 0.5–1.5 s after it (exempt from silence removal)", "Hold music low or on a sustained chord"]
    parameters: {hold_s: "0.5–1.5", max_per_reel: 1}
    avoid_when: "Fast tutorials and hooks."
    genres: [genre.testimonial, genre.brand_story, genre.transformation]
    goals: [goal.emotion]
    uses_capabilities: [cap.cut.trim]
    conflicts_with: []
    requires: []
    evidence_level: theory
    confidence: low
    sources:
      - {title: "Designing a Movie for Sound", author: "Randy Thom", url: "https://filmsound.org/articles/designing_for_sound.htm", locator: "lingering after dialogue ends"}

  - id: tech.split.j_cut_audio_lead
    type: technique
    name: J-cut from the sound side
    summary: Let the next section's audio (voice, ambience or music) start before its picture so the cut feels motivated. Dialogue leads typically 6–12 frames (200–400 ms); ambience or music pre-laps can run 0.5–1 s. Crossfade the outgoing background under the lead.
    when_to_use: "Section transitions, cutting to a new speaker or location (extends playbook rule 25)."
    how: ["Unlink A/V", "Extend incoming audio earlier by 6–12 frames (speech) or 15–30 (ambience/music)", "Crossfade backgrounds 100–300 ms"]
    parameters: {speech_lead_frames_30fps: "6–12", ambience_lead_frames_30fps: "15–30", bg_crossfade_ms: "100–300"}
    avoid_when: "Very first frame of the reel (no previous shot)."
    genres: [genre.interview, genre.vlog, genre.brand_story, genre.podcast_clip]
    goals: [goal.watch_through]
    uses_capabilities: [cap.cut.split_edit, cap.audio.crossfade]
    conflicts_with: []
    requires: []
    evidence_level: practitioner
    confidence: medium
    sources:
      - {title: "J-cuts and L-cuts", author: "Adobe", url: "https://www.adobe.com/creativecloud/video/discover/j-cut-and-l-cut.html", locator: "definitions"}
      - {title: "J-cuts and L-cuts dialogue edits", author: "CapCut", url: "https://www.capcut.com/create/j-cuts-and-l-cuts-dialogue-edits", locator: "6–12 frame lead (single vendor)"}

  - id: tech.split.l_cut_audio_tail
    type: technique
    name: L-cut and sound bridges
    summary: Let the outgoing audio continue under the next picture — a line finishing over a reaction or b-roll, or music carrying across scene changes as a sound bridge. It smooths jump-heavy edits and ties montage segments together.
    when_to_use: "Cutting to b-roll mid-sentence; montage segments; reactions."
    how: ["Extend outgoing audio 6–15 frames under the new shot", "Fade its tail 100–300 ms", "For montages, keep one continuous music track across cuts"]
    parameters: {tail_frames_30fps: "6–15", tail_fade_ms: "100–300"}
    avoid_when: "Hard tonal/topic changes that should feel abrupt."
    genres: [genre.vlog, genre.montage, genre.interview, genre.event_recap]
    goals: [goal.watch_through]
    uses_capabilities: [cap.cut.split_edit, cap.audio.fade]
    conflicts_with: []
    requires: []
