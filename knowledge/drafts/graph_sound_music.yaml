  - id: tech.voice.presence_boost
    type: technique
    name: Add presence for intelligibility
    summary: Consonant clarity lives in roughly 2–5 kHz. A small boost around 3–5 kHz makes speech cut through music and small speakers; pair it with a de-esser because it also lifts sibilance.
    when_to_use: "Dull voices, voices competing with a music bed."
