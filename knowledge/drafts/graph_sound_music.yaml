    type: technique
    name: Mix profile — talking head / tutorial
    summary: Voice is everything. Full repair+voice chain, sparse instrumental bed 18–22 dB under the voice (or none), SFX only on text/zoom events at ≤8/min, music dropout on the key line, master −14 LUFS.
    when_to_use: "Educational, opinion, explainer reels."
    how: ["tech.voice.processing_chain", "Instrumental bed, low density", "Pops on text, hits on punch-ins only", "One dropout or hold at the peak"]
