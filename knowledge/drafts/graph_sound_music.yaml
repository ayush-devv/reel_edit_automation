  - id: tech.sfx.pop_on_text
    type: technique
    name: Pop/click on text and UI elements
    summary: Short, bright pops, clicks or swipes (50–200 ms) on text-in, sticker or UI events add tactility. Keep them light — clearly under the voice — and consistent within a reel so they read as a design language.
    when_to_use: "Text appearances, checklist items, UI/screen-recording demos."
    how: ["Place transient on text-in frame", "Level 10–15 dB below voice", "Use one sound family per reel; vary pitch slightly"]
    parameters: {length_ms: "50–200", level_below_voice_db: "10–15"}
