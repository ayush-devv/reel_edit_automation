  - id: tech.sfx.level_under_voice
    type: technique
    name: Keep SFX from masking words
    summary: An SFX peak on top of a stressed syllable erases the word. Place SFX in the gaps between words where possible, or keep them 8–15 dB below the voice and filter their speech-band content when they must overlap.
    when_to_use: "Any SFX during speech."
    how: ["Check word timestamps around the SFX", "Shift within ±2 frames toward a gap if the visual allows", "Else lower 8–15 dB and/or dip 1–4 kHz in the SFX"]
