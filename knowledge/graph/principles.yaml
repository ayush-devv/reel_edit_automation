- id: principle.story.suspense_vs_surprise
  type: principle
  name: Suspense vs surprise
  summary: Hitchcock contrasted a bomb exploding unannounced (a brief surprise) with an audience who knows about the bomb (sustained suspense).
    Telling viewers more than the subject knows converts seconds of shock into a stretch of tension. Bordwell notes the formulation is ambiguous
    and not wholly original.
  when_to_use: 'Pranks, reveals, challenges, before/after reels: show the viewer what is coming, then make them wait.'
  how: [Reveal the 'bomb' (the stakes or the coming event) early, Cut back to it periodically during the wait, Deliver the payoff with the subject's
      reaction]
  parameters: {}
  avoid_when: The content's only value is the surprise itself (save it for the end, but plant a hint).
  genres: [genre.vlog, genre.transformation, genre.brand_story, genre.event_recap]
  goals: [goal.watch_through, goal.emotion]
  uses_capabilities: [cap.cut.reorder, cap.cut.hard_cut]
  conflicts_with: []
