- id: principle.rhythm.motion_matches_shot_length
  type: principle
  name: Shorter shots carry more motion
  summary: In recent Hollywood films, shorter shots tend to contain more motion and longer shots less, an amplifying pairing the authors suggest
    heightens engagement (strongest in action, weak in drama). Average shot length also fell from about 10 s in the 1930s–40s to under 4 s after
    2000.
  when_to_use: 'Assigning durations: high-motion B-roll can be cut short; static shots need either more time to read or should be avoided in fast
    sections.'
  how: [Measure motion energy per clip, Give high-motion clips short durations in fast sections, Give low-motion clips longer holds or punch-in
      movement, Do not use static frames in rapid sequences]
  parameters: {fast_section_shot_s: '0.4–1.2 for high-motion B-roll (derived, low confidence)', static_shot_min_s: '≈ 1.5–2.5 to be read (derived,
