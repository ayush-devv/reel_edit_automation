- id: principle.color.correct_before_grade
  type: principle
  name: Correct first, then grade
  summary: Normalise every clip to a neutral, technically correct baseline (input transform, exposure, white balance, contrast) before adding
    any creative look. A look built on unbalanced footage amplifies the errors and makes shots impossible to match.
  when_to_use: Every reel with more than one clip or source; always before applying a LUT or stylised look.
  how: [Apply input/colour-space transform for the source, Set exposure on the waveform, Neutralise white balance on the parade, Only then add
      the look on a later node/layer]
  parameters: {node_order: input transform -> exposure/balance -> contrast -> secondaries -> look -> output transform}
  avoid_when: Never skipped; a single already-graded clip may only need a light trim.
  genres: [genre.talking_head, genre.testimonial, genre.product, genre.tutorial, genre.vlog, genre.montage, genre.interview, genre.brand_story]
  goals: [goal.trust, goal.brand_recall]
  uses_capabilities: [cap.color.technical_lut, cap.color.white_balance, cap.color.color_wheels, cap.color.creative_lut]
