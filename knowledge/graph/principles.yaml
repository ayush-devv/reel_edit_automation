- id: principle.pacing_rollercoaster
  type: principle
  name: Pacing curve — fast hook, medium body with a peak, fast end
  summary: 'Vary tempo instead of cutting uniformly fast: a quick hook, a medium-paced middle with one peak (joke, twist, reveal), back to medium,
    then a quick ending. Give viewers a beat to absorb dense information.'
