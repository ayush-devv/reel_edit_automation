- id: principle.sound.leave_space
  type: principle
  name: Leave room for sound to speak
  summary: Wall-to-wall talk and stacked effects crowd sound out. Randy Thom argues for brief holds before or after lines and for selective, sparse
    layers so each sound carries meaning. In short-form this means fewer, better-chosen sounds and occasional deliberate air.
  when_to_use: Emotional beats, reveals, endings; when the mix feels busy.
