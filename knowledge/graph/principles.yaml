- id: principle.perception.kuleshov_effect
  type: principle
  name: Kuleshov effect (context assigns meaning)
  summary: The same neutral face reads as sad, happy or hungry depending on the shot placed next to it. Replications are mixed (an early null
    result; later fMRI and behavioural studies found an effect), but current research agrees that surrounding context shifts how faces are interpreted.
  when_to_use: Testimonials, brand stories, reaction-driven reels; deciding what B-roll sits next to a face.
  how: [Decide the intended reading of a face before choosing its neighbour shot, Place emotionally congruent B-roll or context before/after neutral
      expressions, 'Audit for accidental meanings (e.g., neutral face after a product = indifference)']
