- id: principle.sound.dynamic_contrast
  type: principle
  name: Impact comes from contrast, not loudness
  summary: Big moments feel big because something quieter came before them. Trailer sound designers keep pre-hit layers soft, cut to near-silence
    just before an impact, and avoid over-compression. A reel that is loud everywhere has no peaks left to spend.
  when_to_use: Reveals, punchlines, drops, before/after moments.
  how: [Pull bed and SFX down 6–12 dB in the 0.3–1 s before the peak, Optionally drop to room tone only for 2–10 frames, Land the hit/drop at
      full level]
  parameters: {pre_peak_dip_db: 6–12, void_length_frames: 2–10}
  avoid_when: Talking-head stretches where steady intelligibility matters more than drama.
  genres: [genre.product, genre.montage, genre.transformation, genre.brand_story]
  goals: [goal.energy, goal.emotion, goal.rewatch]
