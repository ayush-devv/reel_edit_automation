- id: principle.but_therefore_chain
  type: principle
  name: But/therefore beats, not 'and then'
  summary: 'Each beat of a short should cause or complicate the next (''but…'', ''so…'') instead of listing events. Causal chaining keeps forward
    pull without adding cuts, and tells the editor which lines are removable: a beat that changes nothing can go.'
  when_to_use: Scripting and trimming any narrative short.
  how: [Label each sentence as setup / but / so, Delete beats that neither complicate nor resolve]
  parameters: {}
  avoid_when: Pure montage.
  genres: [genre.talking_head, genre.vlog, genre.brand_story, genre.testimonial]
  goals: [goal.watch_through, goal.clarity]
