- id: principle.cut.emotion_first
  type: principle
  name: Cut for emotion first
  summary: The best cut is the one that preserves how the viewer should feel at that moment. Murch ranks emotion above story, rhythm, eye-trace
    and spatial continuity, weighting it at roughly half of a cut's value, so a technically imperfect cut that keeps the feeling beats a clean
    one that loses it.
  when_to_use: Every cut decision; especially choosing between takes in testimonials, interviews and brand stories where sincerity matters more
    than polish.
  how: [For each candidate cut point ask what the viewer should feel right after it, Prefer the take/moment with the truest expression even if
      framing or continuity is slightly off, 'When two cuts tie on emotion, break the tie with story, then rhythm']
  parameters: {murch_weights_pct: 'emotion 51, story 23, rhythm 10, eye_trace 7, 2D plane 5, 3D space 4 (rhetorical weights, not measurements)'}
  avoid_when: Never fully; but in purely informational tutorials clarity (story) may dominate.
  genres: [genre.testimonial, genre.interview, genre.brand_story, genre.talking_head, genre.vlog, genre.podcast_clip]
  goals: [goal.emotion, goal.trust, goal.watch_through]
  uses_capabilities: [cap.trim.trim_in_out, cap.analysis.transcription, cap.analysis.face_expression]
  conflicts_with: [anti.cut.continuity_over_emotion]
  requires: []
  evidence_level: theory
  confidence: high
  core: true
