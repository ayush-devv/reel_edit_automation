- id: principle.rhythm.tension_release
  type: principle
  name: Cycles of tension and release
  summary: 'Pearlman frames the purpose of editing rhythm as shaping cycles of tension and release. A reel is a compressed version: build (tighter
    cuts, rising stakes) then release (a held payoff, laugh, or reveal), possibly repeated in micro-cycles every few seconds.'
  when_to_use: Structuring any reel over ~10 s; placing the payoff and the CTA.
  how: [Map the reel into tension segments and release moments, Compress shot length and add motion during tension, Give the release a longer
      hold and cleaner audio, In 30–60 s reels plan 2–4 micro-cycles (derived)]
  parameters: {micro_cycle_s: '5–15 (derived, low confidence)'}
  avoid_when: Calm ASMR/ambient content where steady state is the goal.
  genres: [genre.montage, genre.transformation, genre.brand_story, genre.vlog, genre.event_recap, genre.tutorial]
