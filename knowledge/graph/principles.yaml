- id: principle.rhythm.shot_length_variation
  type: principle
  name: Vary shot lengths (1/f-like patterning)
  summary: Analyses of popular films found that shot-length sequences increasingly vary in a 1/f-like pattern resembling fluctuations in human
    attention, and that this patterning is independent of average shot length. The authors present the attention link as a suggestion; the lesson
    for reels is to vary durations rather than cut at a fixed interval.
  when_to_use: Setting durations for montages, B-roll sequences and multi-cut talking heads.
  how: ['Mix short, medium and occasional long shots instead of a constant duration', Cluster short shots in tension passages and lengthen around
      payoffs, Check that no run of more than ~4 shots shares the same length (derived)]
  parameters: {duration_cv_target: '≥ 0.3 coefficient of variation across a sequence (derived, low confidence)'}
  avoid_when: A deliberately metronomic effect (strict metric montage, beat-synced trend formats) is the point.
