  type: principle
  name: Emotional rhythm
  summary: Emotional rhythm is how feeling passes from shot to shot in a cause-and-effect chain. The editor's questions are which shot, where,
    and for how long, so each emotional beat lands and hands off to the next.
  when_to_use: Testimonials, interviews, brand stories, any reel whose goal is emotion or trust.
