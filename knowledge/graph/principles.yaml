- id: principle.cut.eye_trace
  type: principle
  name: Eye-trace continuity
  summary: Track where the viewer is looking just before a cut and place the next shot's point of interest near that spot, so the eye does not
    hunt. On a small vertical phone screen with very short shots, eye-trace arguably matters more than Murch's low ranking implies.
  when_to_use: Fast montages, punch-ins, B-roll overlays, any cut sequence under ~1.5 s per shot; reframed 16:9→9:16 footage.
  how: [Detect the salient point (face/eyes/hands/product) at the out-frame, Reframe or pick the next shot so its salient point lands within the
      same screen region, 'Keep faces in the upper third of a 9:16 frame consistently across cuts', 'If the focus must move, lead it with motion
      or a caption']
  parameters: {max_focus_jump: '≈ ⅓ of frame width between consecutive shots (derived, low confidence)'}
  avoid_when: Deliberate disorientation or a jarring reveal is the intent.
  genres: [genre.montage, genre.product, genre.event_recap, genre.talking_head, genre.vlog]
  goals: [goal.clarity, goal.watch_through, goal.retention_first_3s]
