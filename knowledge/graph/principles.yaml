- id: principle.rhythm.timing_pacing_trajectory
  type: principle
  name: Timing, pacing and trajectory phrasing
  summary: Pearlman splits rhythm into timing (which frame you cut on and how long a shot holds), pacing (the rate of cutting and of movement
    within shots), and trajectory phrasing (shaping the path and energy of movement across cuts so it links smoothly or collides). Together they
    shape tension and release.
  when_to_use: 'Any rhythm decision: choosing cut frames, setting overall cut rate, and deciding whether consecutive shots flow or clash.'
  how: ['Timing: pick the frame where the movement or thought peaks or completes', 'Pacing: set cut rate to the intended energy, considering motion
      inside shots too', 'Trajectory: match motion direction/energy across a cut for flow, or oppose it for impact']
  parameters: {}
  avoid_when: Never; it is a lens, not a rule.
  genres: [genre.montage, genre.event_recap, genre.vlog, genre.brand_story, genre.talking_head]
