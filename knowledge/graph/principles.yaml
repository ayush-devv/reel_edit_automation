- id: principle.story.setup_payoff
  type: principle
  name: Setup and payoff
  summary: 'Plant a detail early that becomes significant later. Unpaid setups disappoint; payoffs without setups feel cheap. Spacing matters:
    too close feels obvious, too far is forgotten. Short-form compresses this to seconds.'
  when_to_use: Any reel with a reveal, punchline, transformation or twist.
  how: ['Identify the payoff first, then find or create its setup', Plant the setup in the first 1–3 s (often the hook), Pay it off visibly and
      close to the end, Cut any planted element that has no payoff]
  parameters: {setup_by_s: ≤ 3 for 15–60 s reels (derived)}
  avoid_when: Pure list/tips content without a narrative arc.
  genres: [genre.transformation, genre.brand_story, genre.vlog, genre.tutorial, genre.product]
  goals: [goal.watch_through, goal.rewatch, goal.emotion]
  uses_capabilities: [cap.cut.reorder, cap.text.title]
