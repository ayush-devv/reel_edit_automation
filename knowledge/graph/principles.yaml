- id: principle.perception.edit_blindness
  type: principle
  name: Edit blindness from continuity cuts
  summary: Viewers searching for cuts missed match-action cuts about a third of the time versus under a tenth for cuts between unrelated scenes;
    cuts following continuity rules were hidden best. Most misses were attributed to attention captured by the narrative, not to blinks or saccades.
  when_to_use: 'Whenever a cut should feel invisible: trims inside an answer, compressions of action, multi-angle interviews.'
  how: [Cut during motion that continues across the cut, Keep subject position and screen direction consistent, Let audio continue across the
      cut]
  parameters: {missed_match_action_pct: ≈ 32 (study), missed_unrelated_scene_pct: ≈ 9 (study)}
  avoid_when: You want the cut to be noticed (jump-cut energy, comedic beat, scene change).
