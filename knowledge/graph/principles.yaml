- id: principle.sound.small_speaker_translation
  type: principle
  name: Mix for phone speakers
  summary: Most reels play on phone speakers that roll off heavily below roughly 150–300 Hz and are often near-mono. Sub-bass hits and bass-only
    music vanish; anything carried only by low end or stereo width is lost. Check every mix through a high-pass at 200–400 Hz and in mono.
  when_to_use: Final mix QA; choosing SFX and music.
  how: ['Audition with a temporary HPF at 200, 300, 400 Hz', Fold to mono and confirm nothing disappears, Give hits and bass a mid-range layer
      or saturation so they read without sub]
  parameters:
    phone_rolloff_hz: ~150–300 (blog estimates vary)
    check_hpf_hz: [200, 300, 400]
    mono_check: true
  avoid_when: ''
  genres: []
  goals: [goal.clarity, goal.energy]
