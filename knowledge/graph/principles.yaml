- id: principle.sound.synchresis
  type: principle
  name: Synchresis and added value
  summary: When a sound and a visual event coincide, viewers fuse them into one event and credit the image with the sound's meaning (Chion). This
    is why a whoosh makes a cut feel fast and a hit makes a punch-in feel strong. Sync points are where the edit gains or loses perceived impact.
  when_to_use: Choosing where SFX, music accents and cuts land.
  how: ['Identify the visual peak frame (impact, reveal, text-in, cut)', Place a sound whose transient lands on that frame, Reserve hard sync
      points for moments that matter]
  parameters: {}
  avoid_when: Every frame is a sync point — the effect dilutes (see anti.sfx.overuse).
  genres: [genre.montage, genre.product, genre.event_recap]
  goals: [goal.energy, goal.emotion]
  uses_capabilities: [cap.audio.sfx_add]
  conflicts_with: []
  requires: []
  evidence_level: theory
  confidence: high
  sources:
