  type: principle
  name: Ease motion; avoid linear interpolation
  summary: Real objects accelerate and decelerate, so linear keyframes look mechanical. Use eased curves for every position, scale and opacity
    move on text and graphics (Disney's slow-in/slow-out).
  when_to_use: Every animated text or graphic.
  how: [Default to ease-out for entrances, Ease-in for exits, Standard ease-in-out for on-screen moves]
