- id: principle.perception.blink_punctuation
  type: principle
  name: Cuts as blinks (thought punctuation)
  summary: Murch proposes that blinks mark the end of a thought, so a cut placed where a viewer or performer would naturally blink feels like
    punctuation. Lab studies show viewer blinks cluster at low-information moments (end of an action, character exits) but were not tied directly
    to scene breaks, so treat this as a guiding metaphor.
  when_to_use: 'Choosing exact cut frames in talking-head and interview material: end of a sentence/idea, after the speaker blinks or exhales.'
  how: [Cut at the end of a complete thought rather than mid-idea, Use speaker blinks or breaths near phrase ends as candidate out-points, Avoid
      cutting while key information is still on screen]
  parameters: {cut_offset_after_phrase_end: '0–4 frames @30fps (derived, low confidence)'}
  avoid_when: Comedic or energetic edits that intentionally cut mid-thought; music-led montages.
  genres: [genre.talking_head, genre.interview, genre.podcast_clip, genre.testimonial]
  goals: [goal.clarity, goal.watch_through]
