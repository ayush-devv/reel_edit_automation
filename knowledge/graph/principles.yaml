- id: principle.cut.fresh_over_stale
  type: principle
  name: Fresh is preferable to stale
  summary: Dmytryk favours showing the viewer something new over repeating what they've already absorbed. In reels, every shot or angle change
    should add new visual information; reusing the same framing for long stretches makes attention decay.
  when_to_use: Talking heads longer than ~5 s, tutorials with repeated steps, vlogs.
  how: ['Introduce a new angle, scale, B-roll or graphic when the current image has been fully read', Do not reuse the same B-roll clip twice
      unless as a deliberate callback, Prefer showing a new location before the subject arrives]
  parameters: {max_static_hold_s: '≈ 3–5 s on an unchanged frame in talking-head reels (derived, low confidence)'}
  avoid_when: A long take is itself the point (one-shot performance, authenticity-led testimonial).
  genres: [genre.talking_head, genre.tutorial, genre.vlog, genre.podcast_clip]
  goals: [goal.watch_through, goal.energy]
