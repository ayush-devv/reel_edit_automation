- id: principle.sound.av_sync_tolerance
  type: principle
  name: Audio-early is noticed sooner than audio-late
  summary: ITU-R BT.1359 puts detectability of A/V offset at about 45 ms when audio leads and about 125 ms when audio lags (acceptability roughly
    +90/−185 ms). A sync sound that arrives early reads as wrong faster than one slightly late. At 30 fps, more than one frame early is risky;
    up to three frames late is usually unnoticed.
  when_to_use: Placing SFX, music hits, and dialogue after any slip edit.
  how: [Align SFX transient to the visual frame, 'If rounding is needed, round the sound later (0 to +1 frame), never earlier', Re-check lip sync
      after retiming]
  parameters: {audio_lead_detect_ms: 45, audio_lag_detect_ms: 125, audio_lead_accept_ms: 90, audio_lag_accept_ms: 185–190, safe_sfx_offset_frames_30fps: 0
      to +1, pipeline_sync_gate_ms: '≤ 20 (ADR-0006, beep+flash probe ADR-0017)'}
  avoid_when: ''
  genres: []
