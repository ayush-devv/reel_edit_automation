- id: principle.continuity.thirty_degree_rule
  type: principle
  name: 30° rule (sufficient change between shots)
  summary: Cutting between two shots of the same subject needs a clear change of angle (≈30°+) or shot size, otherwise it reads as a jump cut.
    In single-camera reels the usual substitute is a scale change via punch-in.
  when_to_use: Cutting within continuous footage of one subject when the cut should feel deliberate rather than jumpy.
  how: ['If angle differs by < ~30°, also change scale noticeably', Alternate punch-in levels across successive trims, Or accept the jump cut
      deliberately as style]
  parameters: {min_angle_change_deg: ≈ 30, min_scale_change: '≈ 1.15–1.3x (derived, low confidence)'}
  avoid_when: Single-camera talking heads, vlogs, tutorials and podcast clips, where the visible jump cut is the native grammar (tech.cut.jump_cut_talking_head);
    there a 110–125% punch-in (tech.transition.zoom_punch) is the substitute when a cut should look deliberate.
  genres: [genre.interview, genre.brand_story, genre.testimonial, genre.product]
  avoid_genres: [genre.talking_head, genre.vlog, genre.tutorial, genre.podcast_clip]
  goals: [goal.clarity, goal.watch_through]
  uses_capabilities: [cap.transform.punch_in, cap.cut.hard_cut]
  conflicts_with: [tech.cut.jump_cut_talking_head]
