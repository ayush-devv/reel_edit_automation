- id: principle.montage.metric
  type: principle
  name: Metric montage
  summary: 'Eisenstein''s simplest method: cut by absolute shot length, like musical measures, regardless of content. Shortening the measure raises
    intensity. In reels this is strict beat-locked cutting.'
  when_to_use: Beat-synced trend edits, hype intros, short bursts (2–6 s) of montage.
  how: [Detect the music tempo, 'Cut every N beats (1, 2 or 4)', Shorten N toward the climax, Limit to bursts; then switch to rhythmic montage]
  parameters: {cut_every_beats: '1, 2 or 4', burst_length_s: '2–6 (derived, low confidence)'}
  avoid_when: Content inside shots fights the grid (a gesture cut mid-way), or for long stretches (feels mechanical).
  genres: [genre.montage, genre.event_recap, genre.product]
  goals: [goal.energy]
  uses_capabilities: [cap.analysis.beat_detection, cap.cut.cut_to_beat, cap.cut.hard_cut]
