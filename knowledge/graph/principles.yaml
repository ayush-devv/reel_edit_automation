- id: principle.sound.sound_on_value
  type: principle
  name: Short-form is watched with sound on
  summary: Sound is part of the product on TikTok-style feeds, not decoration. TikTok-commissioned Kantar research reports most users call sound
    essential and that audio ads draw more stops than on other platforms. Treat the mix as seriously as the picture, but still make the hook readable
    muted.
  when_to_use: Every reel; sets the budget for audio work.
  how: ['Plan the audio layer (voice, bed, SFX, silence) alongside the cut', Still satisfy the sound-off hook rule (playbook rule 4)]
