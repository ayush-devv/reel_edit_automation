- id: principle.continuity.axis_180
  type: principle
  name: 180° rule (axis of action)
  summary: Keep cameras on one side of the imaginary line between subjects so left/right relationships and movement direction stay consistent.
    Crossing it makes people seem to swap sides or reverse direction. Matters in reels for two-camera interviews, podcasts and reaction setups.
  when_to_use: Multi-camera interviews and podcasts; walking/driving vlogs; any shot-reverse-shot.
  how: [Detect which side of frame each speaker faces in each angle, Never cut between angles that flip a speaker's facing direction without a
      neutral bridge, 'When reframing 16:9 to 9:16, keep each speaker''s look direction consistent']
  parameters: {}
  avoid_when: Deliberate disorientation; single-person direct-to-camera talking heads (no axis issue).
  genres: [genre.interview, genre.podcast_clip, genre.vlog]
  goals: [goal.clarity]
  uses_capabilities: [cap.analysis.subject_tracking, cap.analysis.gaze_estimation, cap.transform.flip_mirror]
  conflicts_with: [anti.continuity.axis_flip]
  requires: []
  evidence_level: theory
  confidence: high
