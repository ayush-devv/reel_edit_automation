- id: principle.loudness.lufs_measurement
  type: principle
  name: Measure loudness in LUFS, not peaks
  summary: ITU-R BS.1770 loudness (LUFS/LKFS) is what normalising platforms read. Integrated LUFS covers the whole piece, short-term uses a 3
    s window, momentary 400 ms; LRA describes macro-dynamics; true peak (dBTP) catches inter-sample overs that codecs turn into distortion. Peak
    normalisation alone says nothing about perceived level.
  when_to_use: QA of every export; comparing stems (voice vs bed).
  how: ['Measure integrated LUFS, LRA and true peak on the master', Use short-term LUFS per stem to compare voice and music, Log values in the
