- id: principle.cut.information_and_motivation
  type: principle
  name: Each cut needs new information and a motivation
  summary: 'Bowen''s grammar lists the factors that justify a cut: new information, a motivating event (look, sound, movement), suitable composition,
    a sufficiently different camera angle, continuity, and sound. Information and motivation come first: a new shot should tell the viewer something,
    and something should prompt the change.'
  when_to_use: Building cut lists from transcripts and B-roll; checking whether an inserted shot earns its place.
  how: ['Identify the motivator (word, glance, gesture, sound) that triggers each cut', 'Ensure the incoming shot adds information (detail, reaction,
