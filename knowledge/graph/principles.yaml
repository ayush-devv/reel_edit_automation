- id: principle.rhythm.physical_rhythm
  type: principle
  name: Physical rhythm
  summary: 'Physical rhythm is the movement inside images and sound: gestures, camera moves, objects, sound energy. The editor re-choreographs
    it, emphasising the most dynamic moments and keeping viewers oriented.'
  when_to_use: Action-heavy B-roll, sports, dance, product handling, event recaps.
