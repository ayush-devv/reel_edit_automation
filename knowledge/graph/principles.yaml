- id: principle.style.linkage_vs_collision
  type: principle
  name: Linkage vs collision (invisible vs expressive editing)
  summary: 'Editing styles sit on two spectrums: continuity to thematic montage, and linkage (shots flow into each other) to collision (shots
    clash for effect). Pearlman rejects the idea that good editing must be invisible; the choice should fit the material''s intent.'
  when_to_use: 'Choosing an overall cutting style per reel: smooth/trustworthy (linkage) vs punchy/energetic (collision).'
  how: [Pick a position on each spectrum per reel and keep it consistent, Testimonials and brand trust pieces lean linkage, 'Hype, montage and
      comedy lean collision']
  parameters: {}
  avoid_when: Mixing both styles randomly within one short reel.
  genres: [genre.montage, genre.brand_story, genre.testimonial, genre.event_recap, genre.vlog]
  goals: [goal.energy, goal.trust, goal.emotion]
