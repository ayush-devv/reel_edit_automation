- id: principle.sound.dialogue_anchor
  type: principle
  name: Dialogue is the anchor of the mix
  summary: Long-form specs anchor loudness on dialogue (Netflix measures dialogue-gated loudness at −27 LKFS ±2 LU) rather than the whole mix.
    For reels, set the voice level first and fit music and SFX around it, never the reverse.
  when_to_use: Any reel with speech.
  how: [Level-match voice first, Set bed relative to voice (tech.duck.depth), Set SFX relative to voice, Only then normalise the master]
