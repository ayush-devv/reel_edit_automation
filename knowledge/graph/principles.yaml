- id: principle.cut.cut_long_when_unsure
  type: principle
  name: When unsure, cut long rather than short
  summary: Dmytryk advises erring toward a slightly longer shot when the exact frame is uncertain, because extra frames can be trimmed later but
    a too-short cut loses meaning. Reels invert the default (tight is expected), so apply this to the rough cut and to emotional holds, not to
    final pacing of dead air.
  when_to_use: Assembly / rough-cut stage in every genre (keep handles); in the final cut only for reaction holds and emotional beats in testimonials,
    interviews and brand stories.
  how: [Leave 4–8 frame handles in the assembly, Tighten in a second pass driven by rhythm checks, Keep longer holds only on emotional peaks or
      payoff frames]
  parameters: {assembly_handle_frames: '4–8 @30fps (derived, low confidence)', stage: assembly (all genres); final cut only for emotional holds}
  avoid_when: Final pacing pass on talking heads, tutorials, podcast clips and vlogs (remove dead air and fillers, ADR-0006 dead-air gate), and
    anything in the first 3 s before the hook lands.
  genres: [genre.testimonial, genre.interview, genre.brand_story]
  avoid_genres: [genre.talking_head, genre.tutorial, genre.podcast_clip, genre.vlog, genre.montage]
  goals: [goal.emotion, goal.clarity]
  uses_capabilities: [cap.trim.trim_in_out]
  conflicts_with: [tech.cut.jump_cut_talking_head]
