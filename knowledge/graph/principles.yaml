- id: principle.montage.intellectual
  type: principle
  name: Intellectual montage (collision of ideas)
  summary: 'Two shots juxtaposed produce an idea neither contains alone (A + B = C). In reels: before/after, expectation vs reality, claim vs
    proof, or contrast cuts that make an argument without narration.'
  when_to_use: Transformations, comparison reels, satire, brand stories with a thesis, product problem/solution.
