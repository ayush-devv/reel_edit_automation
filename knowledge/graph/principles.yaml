- id: principle.perception.audio_hides_cuts
  type: principle
  name: Continuous audio hides cuts
  summary: In a follow-up study, edit blindness at match-action cuts mostly disappeared when the soundtrack was removed. Continuous sound across
    a cut is a major reason cuts go unnoticed, which is the empirical basis for carrying dialogue, room tone or music across picture cuts.
  when_to_use: Every picture cut that should feel seamless, especially jump cuts in talking heads and B-roll overlays.
  how: [Never let room tone drop to silence at a cut, Apply 1–3 frame audio crossfades on dialogue edits, Run music or ambience continuously under
      picture changes, Use J/L offsets to stagger audio and picture edits]
  parameters: {dialogue_crossfade_frames: '1–3 @30fps (practitioner convention, derived)'}
  avoid_when: A hard sonic break is wanted (shock cut, silence for emphasis).
  genres: [genre.talking_head, genre.interview, genre.testimonial, genre.podcast_clip, genre.vlog, genre.tutorial]
  goals: [goal.watch_through, goal.trust, goal.clarity]
  uses_capabilities: [cap.audio.crossfade, cap.audio.room_tone, cap.cut.j_cut, cap.cut.l_cut]
  conflicts_with: [anti.audio.hard_audio_seams]
