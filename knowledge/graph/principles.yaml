- id: principle.rhythm.event_rhythm
  type: principle
  name: Event rhythm (story structure)
  summary: 'Event rhythm is the pacing of story events: the opening establishes stakes and later dramatic questions raise them, building tension
    and release at the structural level. In a reel the stakes must be established in the first seconds.'
  when_to_use: Ordering segments; deciding what to cut entirely; placing the hook and payoff.
  how: [State or imply the stakes in the opening 1–3 s, Order beats so each raises or answers a question, Cut any segment that neither raises
