- id: principle.montage.rhythmic
  type: principle
  name: Rhythmic montage
  summary: 'Shot length is set by both the measure and the movement inside the frame, so cuts land with on-screen action. This is the best default
    for beat-driven reels: cut near the beat but on the frame where motion peaks or completes.'
  when_to_use: Music-driven montages, event recaps, product B-roll sequences.
  how: [Snap candidate cuts to beats, Slide each cut a few frames to the nearest motion peak, Let movement direction carry across the cut]
  parameters: {beat_snap_tolerance_frames: '±2–4 @30fps (derived, low confidence)'}
  avoid_when: Dialogue-led sections where speech, not music, sets rhythm.
  genres: [genre.montage, genre.event_recap, genre.product, genre.vlog]
  goals: [goal.energy, goal.watch_through]
