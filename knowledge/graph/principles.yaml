- id: principle.continuity.eyeline_match
  type: principle
  name: Eyeline match
  summary: When a person looks off-screen, the next shot should show what they look at, positioned where their gaze points. It links a look to
    its object and powers POV and reaction structures.
  when_to_use: Vlogs and product reels where a person looks at something; interviews intercutting host and guest; reaction reels.
  how: [Detect gaze direction at the out-point, Cut to the object/person the gaze implies, Place the object on the side of frame the gaze points
      toward]
  parameters: {}
  avoid_when: Direct-to-camera address (gaze is at the viewer).
  genres: [genre.vlog, genre.product, genre.interview, genre.podcast_clip]
  goals: [goal.clarity, goal.watch_through]
  uses_capabilities: [cap.analysis.gaze_estimation, cap.cut.hard_cut, cap.transform.auto_reframe]
