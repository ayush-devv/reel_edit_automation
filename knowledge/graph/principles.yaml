- id: principle.cut.rule_of_six_priority
  type: principle
  name: Rule of Six sacrifice order
  summary: Murch's six cut criteria (emotion, story, rhythm, eye-trace, 2D screen plane, 3D space) form a priority list. When a cut cannot satisfy
    all six, give up criteria from the bottom of the list upward, and never trade emotion or story for spatial or planar correctness.
  when_to_use: Resolving trade-offs when the agent scores alternative cut points or takes.
  how: [Score each candidate cut on all six criteria, Discard candidates that fail emotion or story, 'Among survivors prefer rhythm, then eye-trace,
      then 2D/3D continuity', Use this as the agent's tie-break ordering]
  parameters: {sacrifice_order: 3D space → 2D plane → eye-trace → rhythm → story → emotion (last)}
  avoid_when: Do not treat the percentages as a literal scoring formula; they express priority, not measured effect sizes.
  genres: [genre.talking_head, genre.testimonial, genre.interview, genre.vlog, genre.montage, genre.brand_story]
  goals: [goal.emotion, goal.clarity, goal.watch_through]
