  summary: 'TikTok Shop''s creator guidance splits a shoppable video into a product-related hook (roughly the first 3–6 s), a key message of benefits
    and selling points, and an easy CTA spoken or shown as text. It names four styles: personal review, before/after, unboxing, and step-by-step
