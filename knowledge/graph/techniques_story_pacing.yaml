- id: tech.structure.podcast_hook_context_payoff
  type: technique
  name: Podcast clip — strongest line, minimal context, complete payoff
  summary: Choose a complete idea, not an arbitrary chunk. Start at the first sentence that carries meaning (or cold-open the punchline), add
    a short context title only if needed, and end on the insight. The clip must make sense to someone who never heard the episode.
  when_to_use: Any long-form conversation repurposed to vertical.
  how: [Transcribe; find self-contained idea units with a punchline, Trim leading filler to the first meaningful sentence, 'Optional cold open:
      punchline line first, then rewind', 'Context title ≤6 words, top safe zone']
  parameters: {length_s: 30–75, context_title_words: ≤6}
  avoid_when: The hook would promise more than the clip delivers.
  genres: [genre.podcast_clip]
  goals: [goal.clarity, goal.retention_first_3s]
