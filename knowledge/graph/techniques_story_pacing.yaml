- id: tech.cta.single_spoken_and_text
  type: technique
  name: One CTA, spoken and on screen
  summary: Ask for one action only and deliver it as both voice and text, since many viewers watch muted. Meta's DR study linked a clear shown
    or voiced CTA to 1.9x purchase intent; TikTok's ad guidance asks videos to close with a clear CTA.
  when_to_use: Any video with a conversion goal.
  how: ['Pick one: follow | comment keyword | link | save | shop', Text CTA ≤5 words inside safe zone; spoken version ≤2 s]
  parameters: {cta_words_text: ≤5}
  avoid_when: Pure entertainment reels where any ask lowers completion.
  genres: [genre.product, genre.testimonial, genre.tutorial, genre.brand_story]
  goals: [goal.cta_conversion]
  uses_capabilities: [cap.graphics.cta_card]
  conflicts_with: []
  requires: []
  evidence_level: platform
  confidence: medium
