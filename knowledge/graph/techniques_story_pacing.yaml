- id: tech.cut.begin_end_on_action
  type: technique
  name: Enter and exit on continuing action
  summary: Dmytryk advises starting and ending scenes while something is already moving. For reels this means starting mid-action or mid-sentence
    (no wind-up, no 'hey guys') and leaving a segment before motion fully stops.
  when_to_use: Opening frame of any reel; segment boundaries in vlogs and montages.
  how: [Trim the first frames to where motion or speech is already under way, 'Cut out of a segment while the action is still resolving, not after
      it fully stops', Avoid static first frames]
  parameters: {first_frame_motion: 'speech or visible motion within 0–5 frames of start (derived, low confidence)'}
  avoid_when: A deliberate still, held opening is the hook (e.g., a striking composed image with text).
  genres: [genre.vlog, genre.montage, genre.event_recap, genre.talking_head, genre.product]
  goals: [goal.retention_first_3s, goal.energy]
  uses_capabilities: [cap.trim.trim_in_out, cap.analysis.motion_estimation, cap.analysis.transcription]
  conflicts_with: []
  requires: []
  evidence_level: theory
  confidence: medium
  sources:
  - {title: What You Can Learn from Edward Dmytryk's 7 Rules of Cutting, author: New York Film Academy, url: 'https://www.nyfa.edu/student-resources/what-you-can-learn-from-edward-dmytryks-7-rules-of-cutting/',
    locator: rule 5}
  - {title: Dmytryk's rules of editing (course notes), author: Chicago Media Works, url: 'https://www.chicagomediaworks.com/2instructworks/3editing_doc/3editing_docdymytryk.html',
