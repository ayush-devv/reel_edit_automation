- id: tech.structure.brand_story_three_act
  type: technique
  name: Brand story — hook, conflict, turn, mission
  summary: 'Fit a founder or brand origin into about 60 s: a 2–3 s hook on the friction moment, ~15–20 s of conflict, ~20–30 s of turn and proof,
    ~10–15 s of mission and CTA. Put a real protagonist and a problem before the product appears.'
  when_to_use: About-us, founder-led, launch, mission content.
  how: [Hook on the frustrating moment or a pain-point question, 'Conflict: stakes, specific details', 'Turn: the insight + product + one proof',
    'Mission line, soft CTA']
  parameters: {hook_s: 2–3, conflict_s: 15–20, turn_s: 20–30, mission_s: 10–15}
  avoid_when: There is no genuine story beat — a product demo will do better.
  genres: [genre.brand_story]
  goals: [goal.emotion, goal.trust]
  uses_capabilities: [cap.cut.reorder, cap.audio.voiceover]
