- id: tech.structure.montage_build_peak
  type: technique
  name: Montage — open strong, build density, peak on the drop
  summary: Open on the best single shot, settle into a two- or four-beat base rhythm, then shorten shots into every-beat bursts as the music builds,
    saving transitions and effects for the biggest hits. End on the track's resolution or a frame that loops to the opening.
  when_to_use: Music-led montages and highlight reels.
  how: [Shot 1 = strongest image, 'Base: cut every 2–4 beats', 'Build: every beat for 4–8 beats into the drop', Transitions only on major hits;
      final frame matches first]
  parameters: {burst_beats: 4–8}
  avoid_when: Cutting every beat throughout (anti.music.cut_every_beat).
  genres: [genre.montage, genre.event_recap]
  goals: [goal.energy, goal.rewatch]
  uses_capabilities: [cap.analysis.beat_detection, cap.transition.whip_pan]
