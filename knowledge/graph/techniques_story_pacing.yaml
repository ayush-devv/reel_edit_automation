- id: tech.edit.dual_narrative
  type: technique
  name: Dual narrative (voiceover and visuals carry different threads)
  summary: Let the voiceover tell one line of the story while the pictures show a second (context, a side gag, the process). It packs more information
    per second without speeding up speech.
  when_to_use: Vlogs, tutorials, story shorts with voiceover.
  how: [VO carries the argument; b-roll shows the evidence or a parallel moment, Avoid literal illustration of every word]
  parameters: {}
  avoid_when: The visual thread competes with a complex spoken step (tutorials needing exact matching).
  genres: [genre.vlog, genre.talking_head, genre.brand_story]
  goals: [goal.watch_through, goal.clarity]
  uses_capabilities: [cap.audio.voiceover, cap.cut.b_roll_cutaway]
