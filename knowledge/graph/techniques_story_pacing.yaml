- id: tech.cut.jump_cut_ellipsis
  type: technique
  name: Expressive jump cut (time ellipsis)
  summary: Use deliberate jumps within one setup to show time passing or restlessness (a person in different positions in the same frame, a process
    sped through). Popularised by Breathless, where jarring discontinuity was a stylistic choice.
  when_to_use: Vlogs, day-in-the-life, process/transformation reels, waiting/boredom gags.
  how: [Lock framing (tripod or stabilised), Pick moments where position or state changed clearly, Cut on a rhythm (beats or regular intervals)
      so the jumps read as intentional]
  parameters: {}
  avoid_when: The audience needs to follow continuous action.
  genres: [genre.vlog, genre.transformation, genre.montage, genre.tutorial]
  goals: [goal.energy, goal.watch_through]
  uses_capabilities: [cap.cut.hard_cut, cap.analysis.beat_detection]
  conflicts_with: []
  requires: []
  evidence_level: theory
  confidence: medium
  sources:
