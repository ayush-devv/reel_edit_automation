- id: tech.cta.before_dropoff
  type: technique
  name: Place the CTA before the biggest drop-off, not only at the end
  summary: Most viewers never reach the last seconds of a short. Wistia's 2023 data on hosted marketing videos showed mid-video CTAs converting
    20.6% vs 17% front and 11.9% end. Transfer to feeds is unproven, so place a light CTA after the payoff begins or before the retention cliff,
    and test.
  when_to_use: Videos >25 s with a conversion goal and known retention curve.
  how: [Find the first major drop in similar videos' retention, 'Overlay a text CTA just before it, without stopping the story', Optional short
      reinforcing CTA at the end]
  parameters: {position: 40–70% of runtime (heuristic)}
  avoid_when: Clips <20 s, or where a mid-roll ask breaks the narrative (Wistia data is not feed data).
  genres: [genre.product, genre.tutorial, genre.talking_head, genre.testimonial]
  goals: [goal.cta_conversion]
  uses_capabilities: [cap.graphics.cta_card]
  conflicts_with: [anti.cta.end_only]
  requires: []
  evidence_level: study
  confidence: low
  sources:
  - {title: 'Middle-most message: where to put CTAs in videos (Wistia State of Video 2023)', author: MediaPost, url: 'https://www.mediapost.com/publications/article/383025/middle-most-message-where-to-put-ctas-in-videos.html',
    locator: conversion by CTA position}
  drafts: [drafts/graph_shortform_craft.yaml]
