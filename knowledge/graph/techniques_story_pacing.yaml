- id: tech.cut.shot_size_progression
  type: technique
  name: Shot-size variety and progression
  summary: Varying shot size (wide, medium, close, detail) controls intimacy and information. Classical grammar moves from context to detail and
    tightens toward emotional peaks; in vertical reels the 'wide' is often a medium, and digital punch-ins supply most of the variety.
  when_to_use: Talking heads, tutorials, product demos, interviews with a single camera.
  how: ['Assign scale per beat: medium for setup, close-up for emphasis or emotion, detail/insert for objects', Tighten as tension rises; release
      by widening, Avoid two consecutive shots of identical scale and angle of the same subject]
  parameters: {scale_steps_for_punch_in: 100% / 115–130% / 150%+ (derived; source resolution permitting)}
  avoid_when: Low-resolution source where punch-ins degrade the image below acceptable sharpness.
  genres: [genre.talking_head, genre.tutorial, genre.product, genre.interview, genre.podcast_clip]
  goals: [goal.watch_through, goal.emotion, goal.clarity]
  uses_capabilities: [cap.transform.punch_in, cap.transform.auto_reframe, cap.cut.hard_cut]
