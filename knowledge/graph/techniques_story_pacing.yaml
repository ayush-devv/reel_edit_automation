- id: tech.structure.testimonial_story_result_recommend
  type: technique
  name: Testimonial arc — story, specific result, recommendation
  summary: Order a testimonial as personal situation, a concrete measurable result, then a recommendation and one CTA. Lead with the result or
    a skeptic line as the hook so the payoff is promised early; keep the speaker's natural phrasing so it sounds like a review.
  when_to_use: Customer reviews, UGC ads, case-study reels, coaching/service businesses.
  how: ['Hook: result line or ''I didn''t believe…'' (0–3 s)', Situation ≤8 s, Result with proof b-roll laid over the claim, Recommendation +
      single CTA]
