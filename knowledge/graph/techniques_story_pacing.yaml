- id: tech.cut.insert_detail
  type: technique
  name: Insert (detail close-up)
  summary: A tight shot of something inside the scene (hands, screen, product label, ingredient) that shows a detail the main shot cannot. Unlike
    a cutaway it stays in the same time and place. Essential in vertical tutorials and product reels where small details must be legible on a
    phone.
  when_to_use: Tutorials, product demos, unboxings, recipes, any step whose key detail is small.
  how: [Cut to the insert when the speaker references the detail, Hold long enough to read any text (≥ ~1 s plus reading time), Match action into
      and out of the insert when possible]
  parameters: {min_hold_s: '≈ 1–2 depending on text to read (derived, low confidence)'}
  avoid_when: The detail is already legible in the main shot.
  genres: [genre.tutorial, genre.product, genre.vlog]
  goals: [goal.clarity, goal.shares_saves]
  uses_capabilities: [cap.cut.hard_cut, cap.transform.punch_in, cap.cut.b_roll_cutaway]
  conflicts_with: []
  requires: []
  evidence_level: practitioner
  confidence: high
