- id: tech.broll.new_point_new_image
  type: technique
  name: New point, new image
  summary: 'Tie visual changes to the structure of the speech: every new point or list item arrives with a new image (b-roll, graphic, angle or
    scale). This makes the edit rhythm follow meaning rather than a timer.'
  when_to_use: Talking head, tutorial, podcast, testimonial.
  how: [Segment transcript into points, Assign a visual change at each point start, Fill gaps >4 s with a punch-in (playbook rule 7)]
  parameters: {}
  avoid_when: One continuous emotional statement.
  genres: [genre.talking_head, genre.tutorial, genre.podcast_clip]
