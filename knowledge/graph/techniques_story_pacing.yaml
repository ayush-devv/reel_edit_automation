- id: tech.cut.cutaway_cover
  type: technique
  name: Cutaway to cover an edit
  summary: Briefly leave the main shot for a related image (B-roll, context, another person) while the main audio continues. The standard way
    to hide trims inside an interview answer and to compress time without a visible jump.
  when_to_use: Interviews and testimonials where a jump cut would feel unpolished; talking heads that need illustration.
  how: [Place the cutaway over the edit point so the trim is hidden, Keep the underlying interview audio running, Choose imagery that illustrates
      the words being said, Return to the speaker for key claims and emotional lines]
  parameters: {cutaway_len_s: ≈ 1.5–3 (practitioner guidance cites ~2 s inside interviews)}
  avoid_when: The imagery is unrelated filler; the speaker's face is the proof (endorsements).
  genres: [genre.interview, genre.testimonial, genre.talking_head, genre.brand_story, genre.podcast_clip]
  goals: [goal.watch_through, goal.clarity, goal.trust]
  uses_capabilities: [cap.cut.b_roll_cutaway, cap.cut.j_cut, cap.cut.l_cut, cap.cut.ripple_delete]
  conflicts_with: [anti.cut.broll_wallpaper]
  requires: [tech.audio.l_cut]
  evidence_level: practitioner
  confidence: high
  sources:
  - {title: What is a cutaway shot, author: StudioBinder, url: 'https://www.studiobinder.com/blog/cutaway-shot/', locator: definition and uses}
