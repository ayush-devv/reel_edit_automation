  name: Bridge Shorts to long-form with a related-video link and a direct ask
  summary: YouTube's culture team advises building a clear path from a Short to a longer video using the Related Video link plus a direct spoken
    call to watch it. The Short should feel complete yet clearly a slice of something bigger.
  when_to_use: Podcast clips, tutorials and talking-head Shorts cut from long-form.
  how: [Attach the Related Video in YouTube Studio, 'Last line: specific reason to watch the full video']
  parameters: {}
  avoid_when: No long-form counterpart exists.
  genres: [genre.podcast_clip, genre.tutorial, genre.talking_head]
