- id: tech.structure.hook_problem_solution_proof_cta
  type: technique
  name: Hook → problem → solution → proof → CTA
  summary: 'The dominant direct-response short-form skeleton: open on a hook, name the viewer''s problem (optionally agitate it), present the
    product as the fix, prove it on screen with a demo or result, then give one clear action. Variants add value props and social proof before
    the CTA.'
  when_to_use: Product ads, UGC ads, app promos, service offers.
  how: [Hook 1–3 s, Problem 2–5 s (agitate if the pain is mild), Solution + live demo, 'Proof: result, numbers, reviews', 'CTA, spoken + text']
  parameters: {hook_s: 1–3, total_s: 15–45}
  avoid_when: Organic entertainment content where an ad arc kills watch time.
  genres: [genre.product, genre.testimonial]
  goals: [goal.cta_conversion, goal.clarity]
