- id: tech.structure.hook_foreshadow_body_payoff
  type: technique
  name: Hook → foreshadow → transition → body → abrupt payoff
  summary: 'A Shorts story skeleton from a top Shorts creator: a short visual hook, one or two spoken lines (≤3 s) that state what the payoff
    will be, a smooth transition into a problem/solution or but/therefore body, and an ending that cuts right after the payoff or reaction.'
  when_to_use: Talking head, story-driven Shorts, challenges, tutorials with a reveal.
  how: [Write the hook and the last line first, Foreshadow line ≤3 s that names the payoff, 'Body beats linked by ''but''/''so'', not ''and then''',
    Cut within a beat of the payoff]
  parameters: {foreshadow_s: ≤3, ending_tail_s: ≤0.5}
  avoid_when: Pure montage with no narrative.
  genres: [genre.talking_head, genre.tutorial, genre.vlog]
  goals: [goal.watch_through, goal.rewatch]
  uses_capabilities: [cap.cut.reorder, cap.text.title]
