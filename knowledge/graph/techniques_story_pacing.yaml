- id: tech.cut.reaction_shot
  type: technique
  name: Reaction shot
  summary: Cut to a listener or audience reacting to what is said or shown. The reaction tells viewers how to feel, gives emotional beats room
    to land, and hides edits in the speaker's track.
  when_to_use: Podcast clips, interviews, pranks/reveals, event recaps, testimonials with an interviewer or family member present.
  how: [Find genuine reactions near the line they respond to, L-cut the speaker's audio over the reaction, 'Hold the reaction until the feeling
      registers, then cut on its shift']
  parameters: {reaction_hold_s: '0.7–2 (derived, low confidence)'}
  avoid_when: The reaction was captured at a different moment and would misrepresent the response.
  genres: [genre.podcast_clip, genre.interview, genre.event_recap, genre.testimonial, genre.vlog]
  goals: [goal.emotion, goal.shares_saves]
  uses_capabilities: [cap.cut.hard_cut, cap.cut.j_cut, cap.cut.l_cut, cap.analysis.face_expression]
  conflicts_with: []
