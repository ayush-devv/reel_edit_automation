- id: tech.cut.shot_reverse_shot
  type: technique
  name: Shot / reverse shot
  summary: Alternate between two people facing each other, each framed from the other's side of the axis, with matching eyelines. The default
    grammar for two-person conversations; in vertical reels each speaker usually gets their own reframed 9:16 crop.
  when_to_use: Two-person interviews, podcasts, debates, conversational skits.
  how: [Reframe each speaker so they face toward the other's implied position, 'Cut on speaker change or a strong reaction, using J-cuts to lead
      the new voice', Keep eye height consistent across both crops]
  parameters: {}
  avoid_when: Rapid crosstalk where a split-screen or two-shot is clearer.
  genres: [genre.interview, genre.podcast_clip]
  goals: [goal.clarity, goal.watch_through]
  uses_capabilities: [cap.transform.auto_reframe, cap.analysis.speaker_diarization, cap.cut.j_cut, cap.cut.l_cut, cap.compositing.split_screen]
  conflicts_with: []
  requires: [principle.continuity.axis_180, principle.continuity.eyeline_match]
  evidence_level: theory
