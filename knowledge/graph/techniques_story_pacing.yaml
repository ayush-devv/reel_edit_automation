- id: tech.structure.event_recap_jobs
  type: technique
  name: Event recap — silent assembly by clip job, then cut to locked music
  summary: Before choosing cuts, label each clip by its narrative job (setup, momentum, surprise, payoff, outro) and assemble silently; then lock
    the music and snap cuts to beats, letting motion and importance decide the exact frame.
  when_to_use: Event and highlight reels with lots of raw footage.
  how: ['Tag clips: setup | momentum | surprise | payoff | outro', 'Order: payoff teaser → setup → momentum → surprise → payoff → outro', 'Lock
      track, then snap cuts to nearest beat that fits the action', Duck music under 1–2 sound-bites]
  parameters: {clip_s: 1–3}
  avoid_when: Footage is too thin to fill the beat grid — use a slower track.
  genres: [genre.event_recap, genre.montage]
  goals: [goal.energy, goal.emotion]
  uses_capabilities: [cap.analysis.beat_detection, cap.audio.ducking]
