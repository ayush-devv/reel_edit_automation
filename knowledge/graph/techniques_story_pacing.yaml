- id: tech.cut.cross_cutting
  type: technique
  name: Cross-cutting / parallel editing
  summary: Alternate between two or more lines of action, building suspense by leaving each briefly unresolved or creating meaning through contrast.
    Terminology is inconsistent across sources (which term means simultaneous action vs multi-storyline structure), so the graph treats them as
    one technique.
  when_to_use: Before/after or two-perspective stories, process vs result, 'meanwhile' event recaps, brand stories contrasting problem and solution.
  how: ['Define two threads with a clear relation (race, contrast, convergence)', Alternate with shrinking segment lengths toward the convergence,
    'Resolve both threads at the payoff, ideally in one shot or a match cut']
  parameters: {segment_shrink_ratio: '≈ 0.6–0.8 per alternation toward climax (derived, low confidence)'}
  avoid_when: Under ~15 s total, where two threads can't be established; viewers can't tell the threads apart visually.
  genres: [genre.brand_story, genre.transformation, genre.event_recap, genre.vlog]
  goals: [goal.watch_through, goal.emotion]
  uses_capabilities: [cap.cut.reorder, cap.cut.hard_cut, cap.compositing.split_screen]
  conflicts_with: []
  requires: []
  evidence_level: theory
  confidence: medium
  sources:
  - {title: Cross-cutting explained, author: MasterClass, url: 'https://www.masterclass.com/articles/cross-cutting-explained', locator: definition;
      suspense}
  - {title: Parallel editing and Griffith (CineD article), author: CineD, url: 'https://www.cined.com/?p=443157', locator: Griffith shot-shortening}
  drafts: [drafts/graph_editing_theory.yaml]
- id: tech.cut.cut_in_movement
  type: technique
  name: Cut in movement
  summary: 'Dmytryk''s rule to cut while something is moving: a gesture, head turn, camera move or object motion. Movement masks the cut and keeps
    energy up. In talking heads, cut on a hand gesture, nod or head turn rather than on a frozen face.'
  when_to_use: Talking-head trims, B-roll transitions, whip/motion-led transitions, montages.
  how: [Detect motion peaks near candidate cut points, Prefer cut points during gestures or camera moves, 'For transitions, match movement direction
      between outgoing and incoming shots']
  parameters: {search_window_frames: '±6 around the speech-based cut point @30fps (derived, low confidence)'}
  avoid_when: The movement is the payoff and must be seen whole.
  genres: [genre.talking_head, genre.vlog, genre.montage, genre.event_recap, genre.product]
  goals: [goal.energy, goal.watch_through]
  uses_capabilities: [cap.analysis.motion_estimation, cap.trim.trim_in_out, cap.transition.whip_pan]
  conflicts_with: []
  requires: []
  evidence_level: theory
  confidence: high
  sources:
