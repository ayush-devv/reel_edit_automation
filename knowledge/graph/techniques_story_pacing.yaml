- id: tech.structure.transformation_before_process_after
  type: technique
  name: Transformation — before, compressed process, timed reveal
  summary: 'Lock camera position for before and after, compress the process with speed ramps or rapid shots, and land the reveal on a clear beat
    with one transition. Optional reverse variant: show the after first, then play the process forward to explain it.'
  when_to_use: Makeovers, cleaning, renovation, fitness progress, design/code before-after.
  how: [Tripod-locked before and after framing, 'Process: 0.5–1.5 s shots or timelapse', Reveal transition on a downbeat or action, Hold after-state
      1.5–3 s]
  parameters: {reveal_hold_s: 1.5–3}
  avoid_when: The result is underwhelming without context — lead with stakes instead. Never speed-ramp a segment that carries speech (ADR-0017);
    ramp silent process footage and keep VO at 1x.
  genres: [genre.transformation]
  goals: [goal.rewatch, goal.emotion]
  uses_capabilities: [cap.speed.ramp, cap.cut.hard_cut]
