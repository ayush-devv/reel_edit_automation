- id: tech.structure.tutorial_result_steps_recap
  type: technique
  name: Tutorial — result, numbered steps, result again
  summary: Show the end result first, promise a countable number of steps, deliver one step per beat with a persistent step label, then return
    to the result. The count is a built-in reason to finish, and ending on the opening image makes the loop seamless.
  when_to_use: Any how-to with ≤5 steps.
  how: ['0–2 s: finished result + ''N steps'' text', 'Each step: label ''STEP k/N'' + action shot + 1 line', Breathe ~0.5 s after dense steps,
    Close on the result shot used in the hook]
  parameters: {max_steps: 3–5, step_label: persistent top-safe-zone text}
  avoid_when: More than ~5 steps — split into a series.
  genres: [genre.tutorial]
  goals: [goal.clarity, goal.watch_through, goal.shares_saves]
