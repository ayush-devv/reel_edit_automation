- id: tech.ending.abrupt_after_payoff
  type: technique
  name: End right after the payoff
  summary: Cut within a beat of the payoff line or reaction; no recap, no outro, no 'thanks for watching'. Abrupt endings feel satisfying when
    the payoff was foreshadowed, and they push viewers into the auto-replay.
  when_to_use: Nearly all short-form genres.
  how: [Find the payoff word/frame; end ≤0.5 s after (playbook rule 29), 'If a CTA is needed, put it before the payoff or overlay it']
  parameters: {tail_s: ≤0.5}
  avoid_when: 'Music-led reels where the track needs to resolve: backtime the music so its ending or final hit lands at the cut (tech.music.backtime_ending),
    keeping any ring-out tail ≤ 0.5 s.'
  genres: [genre.talking_head, genre.vlog, genre.transformation, genre.tutorial, genre.podcast_clip]
  goals: [goal.watch_through, goal.rewatch]
  uses_capabilities: [cap.trim.trim_in_out]
  conflicts_with: [anti.ending.outro_card]
  requires: [tech.loop.foreshadow_payoff]
  evidence_level: practitioner
  confidence: medium
