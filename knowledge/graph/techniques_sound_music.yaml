- id: tech.dialogue.background_crossfade_at_splits
  type: technique
  name: Smooth background changes between takes
  summary: Takes from different setups carry different room sound. A hard switch in background on a jump cut or split edit is audible even when
    the words are fine. Crossfade the backgrounds (or lay continuous tone underneath) so the change is gradual.
  when_to_use: Cuts between takes, locations or mic positions.
  how: [Extend handles of both clips, Crossfade 100–500 ms in the pause, Or lay one continuous room-tone bed under both and denoise each to match]
  parameters: {background_crossfade_ms: 100–500}
  avoid_when: Intentional location change where a hard sound cut sells the jump.
  genres: [genre.vlog, genre.interview, genre.podcast_clip]
  goals: [goal.clarity]
  uses_capabilities: [cap.audio.crossfade, cap.audio.room_tone]
  conflicts_with: []
  requires: [tech.dialogue.room_tone_fill]
  evidence_level: practitioner
  confidence: medium
  sources:
  - {title: Dialogue Editing for Motion Pictures (2nd ed.), author: John Purcell, url: 'https://routledge.com/9780415828178', locator: room tone
      balancing; perspective}
  - {title: Room tone (Frame.io Workflow Guide), author: Frame.io, url: 'https://workflow.frame.io/guide/roomtone', locator: fading background
      noise in/out}
