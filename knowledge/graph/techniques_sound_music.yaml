- id: tech.music.ring_out_ending
  type: technique
  name: Let the final hit ring out
  summary: If the edit must end where the music doesn't, end on a strong downbeat or hit and let it sustain — use the track's own decay or add
    a reverb tail of 1–3 s — rather than chopping mid-note. A clean button (short final hit) also works for punchy reels.
  when_to_use: Custom-length endings; CTA end cards.
  how: [End on a downbeat/hit, Extend with natural decay or reverb tail 1–3 s, Fade the tail 0.5–2 s; never cut audio before the visual end]
  parameters: {tail_s: 1–3, tail_fade_s: 0.5–2, max_tail_after_payoff_s: 0.5 (aligned with tech.ending.abrupt_after_payoff)}
  avoid_when: Loop-designed reels (a ring-out breaks the loop).
  genres: [genre.brand_story, genre.product, genre.montage]
  goals: [goal.emotion, goal.brand_recall]
  uses_capabilities: [cap.audio.reverb, cap.audio.fade]
