- id: tech.duck.spectral_carve
  type: technique
  name: Carve a speech window in the music
  summary: Instead of (or on top of) a deep level duck, dip the music only in the speech-critical band (about 1–5 kHz) when the voice is present,
    using sidechained dynamic EQ. The bed keeps its energy and low end while words stay clear. Research also supports downward expansion of the
    background over plain ducking.
  when_to_use: Energetic beds that sound limp when fully ducked; montage with occasional VO.
  how: ['Dynamic EQ on music, sidechained to voice', 'Dip 3–6 dB at 1–5 kHz, wide Q', Reduce overall duck depth by a similar amount]
  parameters: {band_hz: 1000–5000, dip_db: 3–6}
  avoid_when: Lyrical music (swap track instead; see anti.music.lyrics_under_speech).
  genres: [genre.montage, genre.event_recap, genre.product, genre.vlog]
  goals: [goal.clarity, goal.energy]
  uses_capabilities: [cap.audio.dynamic_eq, cap.audio.ducking]
  conflicts_with: []
  requires: []
  evidence_level: practitioner
  confidence: medium
  sources:
  - {title: 6 ways to use Neutron 3 for post production, author: iZotope, url: 'https://www.izotope.com/en/learn/6-ways-to-use-neutron-3-for-post-production',
    locator: masking meter; sidechained dynamic EQ on music}
  - {title: Downward dynamic range expansion versus ducking test of speech intelligibility (data), author: 'Philippa Demonte, University of Salford
      (2022)', url: 'https://salford-repository.worktribe.com/output/3626626/downward-dynamic-range-expansion-versus-ducking-test-of-speech-intelligibility-data',
    locator: abstract}
