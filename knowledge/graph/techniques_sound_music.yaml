      to remove pops/clicks; batch fades}
  - {title: Fades handout (EMS F2013), author: University of Iowa Electronic Music Studios, url: 'https://theremin.music.uiowa.edu/EMS.Files/Handouts/2013/F.2013/EMS.F2013.Fades.pdf',
