- id: tech.dialogue.edit_fades
  type: technique
  name: Micro-fade every dialogue edit
  summary: Any edit that starts or ends at non-zero amplitude clicks. Put a short fade or crossfade on every boundary — 5–10 ms inside or next
    to speech so consonants survive, 20–50 ms where the cut sits in room tone. Batch-apply to all edits.
  when_to_use: Every audio edit point, combined with room tone under the cut (ADR-0017 replaces bare 30 ms fades with fades + room tone).
  how: [Batch-fade all clip boundaries, Use 5–10 ms at speech-adjacent edits, Use 20–50 ms equal-power crossfades in pauses, Listen for dulled
      consonants; shorten if so]
  parameters: {fade_speech_adjacent_ms: 5–10, fade_in_pause_ms: 20–50, min_fade_ms: 1, curve: equal-power for crossfades}
  avoid_when: Never skip; only the length changes.
  genres: []
  goals: [goal.clarity]
  uses_capabilities: [cap.audio.fade, cap.audio.crossfade]
  conflicts_with: []
  requires: []
  evidence_level: practitioner
  confidence: high
  enforced_by: [compiler]
  decided_by: [ADR-0017]
  sources:
