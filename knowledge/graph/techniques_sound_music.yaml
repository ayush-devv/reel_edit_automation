- id: tech.audio.l_cut
  type: technique
  name: L-cut (audio trails picture)
  summary: 'The outgoing shot''s audio continues under the next picture: a line finishing over a reaction or b-roll, or music bridging a scene
    change. It is the core move for covering talking-head trims and showing reactions; tails of about 6–15 frames at 30 fps with a 100–300 ms
    fade are typical.'
  when_to_use: Laying B-roll over narration; showing a listener's reaction in interviews/podcasts; lingering on a line's emotional weight. | Cutting
    to b-roll mid-sentence; montage segments; reactions.
  how: [Cut picture to the reaction/B-roll before the sentence ends, Keep the speaker's audio running until the thought completes, Return to the
      speaker on the next sentence start or a new motivation, Extend outgoing audio 6–15 frames under the new shot, Fade its tail 100–300 ms,
    'For montages, keep one continuous music track across cuts']
  parameters: {audio_trail_frames: 6–12 @30fps for dialogue (practitioner range), broll_over_dialogue_s: '1.5–3 (derived, low confidence)', tail_frames_30fps: 6–15,
    tail_fade_ms: 100–300}
  avoid_when: Lip-sync proof matters (the viewer must see the speaker say a key claim, e.g., testimonial endorsements). | Hard tonal/topic changes
    that should feel abrupt.
  genres: [genre.interview, genre.podcast_clip, genre.testimonial, genre.talking_head, genre.brand_story, genre.vlog, genre.montage, genre.event_recap]
  goals: [goal.watch_through, goal.emotion]
  uses_capabilities: [cap.cut.l_cut, cap.cut.b_roll_cutaway, cap.audio.fade]
  conflicts_with: []
  requires: [principle.perception.audio_hides_cuts]
  evidence_level: practitioner
