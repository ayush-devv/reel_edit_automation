- id: tech.dialogue.cut_point_selection
  type: technique
  name: Choose dialogue cut points that hide
  summary: Edits hide best in true pauses, on the attack of a hard consonant or plosive (p, t, k, b), or under a breath that is then trimmed.
    Cutting mid-vowel or across a falling inflection exposes the join. Keep the sentence's natural pitch fall at the end of a thought.
  when_to_use: Silence removal and jump cuts in talking-head and podcast clips.
  how: [Prefer cuts in pauses ≥150 ms (playbook rule 9), Else cut just before a plosive onset, Avoid joining two rising inflections, Check zero-crossing
      then add a micro-fade]
  parameters: {min_pause_ms: 150, prefer: pause > plosive onset > breath}
  avoid_when: Never cut inside a word or a vowel.
  genres: [genre.talking_head, genre.podcast_clip, genre.interview, genre.tutorial]
  goals: [goal.clarity, goal.watch_through]
  uses_capabilities: [cap.cut.ripple_delete, cap.analysis.transcription, cap.audio.fade]
  conflicts_with: []
  requires: [tech.dialogue.edit_fades]
  evidence_level: practitioner
  confidence: medium
  sources:
