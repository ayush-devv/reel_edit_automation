- id: tech.music.tempo_energy_match
  type: technique
  name: Match music energy to content
  summary: Choose tempo and density to fit the content's pace and emotion; music that is faster or busier than the speech fights it. Rough starting
    bands — reflective/testimonial 60–90 BPM, explainer beds 85–110 BPM sparse, hype montage 120–140+ BPM — are heuristics, not standards.
