- id: tech.audio.j_cut
  type: technique
  name: J-cut (audio leads picture)
  summary: The incoming shot's sound (voice, ambience or music) starts before its picture, pulling the viewer into the next shot and hiding the
    picture cut behind continuous audio. Dialogue leads of about 6–12 frames at 30 fps are typical; ambience or music pre-laps can run 0.5–1 s
    with the outgoing background crossfaded underneath.
  when_to_use: Introducing a new speaker in interviews/podcasts; entering a new scene in vlogs; leading into B-roll from narration. | Section
    transitions, cutting to a new speaker or location (extends playbook rule 25).
  how: [Offset the audio edit earlier than the picture edit, Start with 6–12 frames for quick dialogue lines and adjust by feel, Use longer leads
      (0.5–2 s) for scene changes with ambience or music, Unlink A/V, Extend incoming audio earlier by 6–12 frames (speech) or 15–30 (ambience/music),
    Crossfade backgrounds 100–300 ms]
  parameters: {audio_lead_frames_dialogue: 6–12 @30fps (CapCut guidance; others cite 1–10 or 3–12), audio_lead_scene_change_s: '0.5–2 (derived,
      low confidence)', speech_lead_frames_30fps: 6–12, ambience_lead_frames_30fps: 15–30, bg_crossfade_ms: 100–300}
  avoid_when: The audio of the incoming shot would confuse context (two speakers overlapping unintelligibly). | Very first frame of the reel (no
    previous shot).
  genres: [genre.interview, genre.podcast_clip, genre.vlog, genre.brand_story, genre.testimonial]
  goals: [goal.watch_through, goal.clarity]
  uses_capabilities: [cap.cut.j_cut, cap.audio.crossfade]
  conflicts_with: []
  requires: [principle.perception.audio_hides_cuts]
  evidence_level: practitioner
  confidence: high
