- id: tech.repair.declip_dehum
  type: technique
  name: De-clip and de-hum only when present
  summary: Clipping is the deepest damage, so de-clip first, after lowering gain to give reconstructed peaks headroom. De-hum removes fixed tones
    (50/60 Hz and harmonics) and should be applied only if hum is audible; running it on clean audio just adds risk.
  when_to_use: Clipped phone/lav recordings; buzz from mains or lights.
  how: [Detect samples at/near 0 dBFS; lower gain ~3–6 dB then de-clip, Detect a steady 50 or 60 Hz line plus harmonics; notch only if present]
  parameters: {pre_declip_gain_db: -3 to -6, hum_fundamental_hz: 50 or 60, harmonics: up to 16}
  avoid_when: No clipping / no hum detected.
  genres: []
  goals: [goal.clarity]
  uses_capabilities: [cap.audio.declip, cap.audio.dehum]
