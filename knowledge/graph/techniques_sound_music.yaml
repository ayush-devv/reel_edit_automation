- id: tech.music.beat_synced_cuts
  type: technique
  name: Beat-synced cutting
  summary: Frames per beat = fps × 60 / BPM (120 BPM at 30 fps = 15), with the grid anchored on the first detected beat. Cut every 2–4 beats as
    the base cadence and every beat only in short bursts at peaks; put the cut on or one frame before the transient, letting action pick the exact
    frame.
  when_to_use: Montages, recaps, music-led product reels. | Montage, event recap, transformation reveals, music-led vlogs.
  how: [Detect BPM and beat grid (check for half/double-time errors), Compute frames per beat, 'Snap cuts to downbeats; vary between 1, 2 and
      4 beats', Round toward audio-late (principle.sound.av_sync_tolerance), Detect BPM + first downbeat offset; check for tempo changes, Snap
      cuts to the nearest beat within ±2 frames of a natural action point, Check alignment against kick/snare by ear]
  parameters: {frames_per_beat: fps*60/BPM, typical_interval_beats: 2–4, peak_interval_beats: 1, rounding: cut on or 1 frame before beat, base_cut_every_beats: 2–4}
  avoid_when: Dialogue-led reels — cut on speech, not on music. | Speech-led content where phrase boundaries outrank beats.
  genres: [genre.montage, genre.event_recap, genre.product, genre.vlog, genre.transformation]
  goals: [goal.energy, goal.rewatch]
  uses_capabilities: [cap.analysis.beat_detection, cap.cut.cut_to_beat, cap.trim.trim_in_out]
