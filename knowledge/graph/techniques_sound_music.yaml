- id: tech.music.phrase_aligned_start
  type: technique
  name: Start music on a phrase or fade it in
  summary: Music entering mid-phrase sounds like a mistake. Start on the downbeat of a phrase (ideally aligned to the first cut or hook word),
    or start mid-track with a 200–500 ms fade-in under speech so the entry is not exposed.
  when_to_use: Opening of every reel with music; re-entry after a dropout.
  how: [Choose an in-point on a phrase downbeat, Align that downbeat with frame 0 or the first visual change, Otherwise fade in 200–500 ms]
  parameters: {fade_in_ms: 200–500}
  avoid_when: Cold-open music sting where the hit IS the hook.
