- id: tech.dialogue.level_match
  type: technique
  name: Level-match dialogue clips before processing
  summary: Bring every dialogue clip to a consistent level with clip gain before compression, so the compressor does gentle smoothing rather than
    fixing big jumps. Jump-cut reels splice takes recorded at different distances; mismatches of 2–3 LU between adjacent clips are audible.
  when_to_use: After the dialogue cut, before the voice chain.
  how: [Measure short-term LUFS per clip (speech only), Apply clip gain so clips sit within ±1 LU of the target, Then compress; then automate
      any remaining words]
  parameters: {clip_to_clip_tolerance_lu: ±1 (max ±2), voice_stem_short_term_lufs: ≈ −16 to −18 before master limiting (heuristic)}
  avoid_when: Intentional perspective change (whisper, shout) — keep the performance.
  genres: [genre.talking_head, genre.podcast_clip, genre.interview, genre.tutorial]
  goals: [goal.clarity, goal.trust]
  uses_capabilities: [cap.audio.clip_gain, cap.analysis.loudness_measurement]
  conflicts_with: []
  requires: []
