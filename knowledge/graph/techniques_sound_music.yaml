- id: tech.loudness.short_form_master
  type: technique
  name: Short-form master at −14 LUFS / −1.5 dBTP
  summary: Master reels to about −14 LUFS integrated with a true-peak ceiling of −1.5 dBTP (project rule, ADR-0017), using a true-peak limiter
    then two-pass linear loudness normalisation measured on the final file. Quieter masters may sit weak in the feed; louder ones gain nothing
    where platforms turn down.
  when_to_use: Final export of every reel (extends playbook rule 19).
  how: [Limit with a true-peak limiter at −1.5 dBTP (≤ 3 dB gain reduction ideally), 'ffmpeg loudnorm pass 1: measure', 'Pass 2: loudnorm=I=-14:TP=-1.5:LRA=7
      with measured_* values and linear=true', Verify integrated LUFS and true peak on the encoded file (ADR-0017)]
  parameters: {integrated_lufs: -14, tolerance_lu: ±1, true_peak_dbtp: -1.5, true_peak_if_louder_than_-14: -2, lra_lu: ≤7–9 (heuristic for mobile),
    limiter_gr_db: ≤3, ffmpeg_loudnorm_defaults: 'I=-24, TP=-2, LRA=7 (override them)', true_peak_note: draft value −1 dBTP superseded by ADR-0017}
  avoid_when: Broadcast delivery (use −23) or podcast audio (−16).
  genres: []
  goals: [goal.clarity, goal.energy]
  uses_capabilities: [cap.audio.loudness_normalize, cap.audio.limiter, cap.analysis.loudness_measurement]
  conflicts_with: [anti.loudness.overlimiting]
