- id: tech.mix.profile_montage
  type: technique
  name: Mix profile — montage / event recap
  summary: Music is the anchor and plays near full level; cuts follow the beat grid with varied intervals; nat-sound pops and a few designed hits/whooshes
    punctuate; one build-and-drop. Any VO ducks the bed or carves a speech window.
  when_to_use: Event recaps, travel, sports, highlight reels.
  how: [Pick track by energy; backtime ending, 'Beat-synced cuts (2–4 beats, 1 at peak)', Nat pops in gaps, One riser→drop on the best moment]
  parameters: {music_role: anchor, cut_interval_beats: 1–4}
  avoid_when: ''
  genres: [genre.montage, genre.event_recap]
  goals: [goal.energy, goal.rewatch]
  uses_capabilities: [cap.analysis.beat_detection, cap.audio.music_retime, cap.audio.sfx_add]
