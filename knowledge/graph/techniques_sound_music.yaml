- id: tech.audio.speech_plus_music
  type: technique
  name: Combine speech with a music bed
  summary: Meta's Reels ad study associated combining speech and music with roughly 2x brand interest and purchase intent, and reinforcing the
    message in both audio and on-screen text with 1.8x brand interest. Duck the bed under voice per playbook rule 20.
  when_to_use: Product, testimonial, brand story, talking head ads.
  how: [Add a low music bed under VO/speech, Repeat the key message as on-screen text when spoken]
  parameters: {}
  avoid_when: Raw testimonial authenticity is the hook and music feels manipulative; montage (no speech).
