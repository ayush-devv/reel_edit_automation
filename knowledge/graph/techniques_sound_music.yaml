- id: tech.music.stinger_button
  type: technique
  name: Stinger or button on the payoff
  summary: A stinger is a short musical gesture (about 1–3 s) that punctuates a reveal, logo or CTA; a button is the single final hit that closes
    a cue. They mark the end of a thought and aid brand recall without needing a full outro.
  when_to_use: End cards, logo, product reveal, punchline.
