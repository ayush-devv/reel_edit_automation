- id: tech.music.mid_bar_hidden_edit
  type: technique
  name: Hide the music edit mid-bar on the backbeat
  summary: Cutting from bar-end to bar-start chops drum fills and reverb tails. Move the edit into the middle of the bar, on a strong transient
    such as the snare backbeat, and the hit masks the join. Slipping the edit point changes nothing about total length.
  when_to_use: Tracks with drums where bar-line edits sound clipped.
  how: [Find snare/backbeat peaks in the waveform, Cut from mid-bar to the equivalent mid-bar point, Slip until seamless; crossfade a few ms before
      the hit, Or hide the join under dialogue or an SFX hit]
  parameters: {edit_on: snare backbeat (beat 2 or 4), crossfade_ms: 5–20}
  avoid_when: No percussive transient — use ambient crossfade.
  genres: [genre.montage, genre.product, genre.vlog]
  goals: [goal.watch_through]
  uses_capabilities: [cap.analysis.beat_detection, cap.audio.crossfade]
