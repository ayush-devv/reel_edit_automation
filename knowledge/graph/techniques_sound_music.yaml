- id: tech.dialogue.room_tone_fill
  type: technique
  name: Fill gaps with room tone
  summary: Fill every gap between dialogue clips with clean room tone so the background never drops out. Source it from on-set recordings, clip
    handles, or spliced clean fragments; avoid tone containing breaths or rustles. Very short snippets looped over long gaps sound repetitive.
  when_to_use: Any gap, removed breath or replaced noise in dialogue.
  how: [Collect 30–60 s of tone at the shoot if possible, Else harvest clean tone from handles, Use pieces ≥10 frames; crossfade joins 20–100
      ms, Match tone level to the background under speech]
  parameters: {record_tone_s: 30–60, min_piece_frames: 10, join_crossfade_ms: 20–100}
  avoid_when: A hard cut to silence is the creative intent (rare; see tech.silence.music_dropout — still keep tone).
  genres: [genre.talking_head, genre.interview, genre.podcast_clip, genre.testimonial, genre.vlog]
  goals: [goal.clarity, goal.trust]
  uses_capabilities: [cap.audio.room_tone, cap.audio.crossfade]
  conflicts_with: [anti.dialogue.dead_air_or_gating]
  requires: []
