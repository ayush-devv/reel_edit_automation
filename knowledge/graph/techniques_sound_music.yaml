- id: tech.dialogue.breath_attenuation
  type: technique
  name: Attenuate breaths, don't erase them
  summary: Removing every breath sounds robotic and can hurt comprehension; loud breaths distract. Use target-style reduction so only loud breaths
    are lowered and quiet ones stay natural. In jump-cut reels, breaths inside removed gaps disappear anyway; keep the ones that frame a sentence.
  when_to_use: Voice-over and talking head with audible breaths, before compression (which raises them).
  how: [Detect breaths (RX Breath Control or level/spectral detection), 'Target mode: bring loud breaths down to about −40 to −50 dBFS', Or gain
      mode 6–12 dB for heavy breathing, Keep pacing gaps; fill with tone if a breath is deleted]
  parameters: {mode: target (preferred) | gain, gain_reduction_db: 6–12, target_level_dbfs: -40 to -50 (heuristic)}
  avoid_when: Emotional testimony where a breath carries feeling.
  genres: [genre.talking_head, genre.tutorial, genre.podcast_clip]
  goals: [goal.clarity]
  uses_capabilities: [cap.audio.breath_attenuation]
  conflicts_with: []
  requires: []
  evidence_level: practitioner
  confidence: medium
  sources:
  - {title: Breath Control (RX 9 Help), author: iZotope, url: 'https://s3.amazonaws.com/izotopedownloads/docs/rx9/en/breath-control/index.html',
    locator: Target vs Gain mode}
  - {title: How to Remove Vocal Breaths in Mix the Right Way, author: Music Guy Mixing, url: 'https://www.musicguymixing.com/vocal-breaths/',
    locator: 'attenuate, don''t remove'}
