- id: genre.montage
  type: genre
  name: Montage / music edit
  summary: 'Music-driven sequence of short shots with little or no speech, where the soundtrack''s beat grid sets the cut points. Energy is shaped
    by cut density: two- or four-beat cuts as the base, short every-beat bursts at peaks, transitions saved for major hits.'
  when_to_use: Aesthetic edits, travel cinematics, sports/gaming highlights, fashion, B-roll showcases.
  how: [Pick track; detect BPM and the first-beat offset, Open on the single strongest shot (0–1 s), Base cadence every 2–4 beats; bursts of every-beat
      cuts for 4–8 beats at drops, End on the track's resolution or loop seam]
  parameters: {cut_rate_per_min: 30–60 at 120 BPM (1 cut per 2 beats = 60/min), median_shot_s: 0.5–2, hook_window_s: 0–1, caption_density: none
      or a single title, typical_length_s: 7–30}
  avoid_when: There's a message to communicate in words (use talking_head/tutorial).
  genres: []
  goals: [goal.energy, goal.rewatch, goal.emotion]
  uses_capabilities: [cap.analysis.beat_detection, cap.trim.trim_in_out, cap.transition.whip_pan]
