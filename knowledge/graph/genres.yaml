- id: genre.vlog
  type: genre
  name: Vlog / day-in-the-life
  summary: A personal slice of a day or trip, usually voiceover-led over many short clips in chronological order. Film and keep the moments that
    show change, not every task; cut clips to the voiceover rhythm, with energetic or calm cadence chosen by mood.
  when_to_use: Lifestyle, travel, 'day in my life', GRWM, behind-the-scenes.
  how: ['Hook (0–3 s): most striking moment or a promise line in VO + text', 'Record/lay VO first, then place clips on it', Chronological unless
