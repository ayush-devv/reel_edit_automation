- id: genre.transformation
  type: genre
  name: Transformation / before-after
  summary: 'Shows a change of state (room, body, hair, code, product result). The craft is in the reveal: identical framing for before and after,
    a sped-up process, and a single clean transition (match cut, cover wipe) timed to a beat. Either tease the after first or hold it to the end.'
  when_to_use: Makeovers, renovations, cleaning, fitness, edits, design, restoration.
  how: ['Hook: flash the after (0–1 s) or state the stakes over the before', Before in the locked framing, Process compressed (speed ramp / timelapse
      / 0.5–1.5 s shots), Reveal on a beat with one transition; hold the after 1.5–3 s]
  parameters: {cut_rate_per_min: 30–50 in process section (heuristic), median_shot_s: '0.5–1.5 process, 1.5–3 reveal', hook_window_s: 0–2, caption_density: 'minimal:
      stakes line + labels BEFORE/AFTER', typical_length_s: 7–30}
  avoid_when: Before and after were shot from different positions (anti.transform.mismatched_framing).
  genres: []
  goals: [goal.rewatch, goal.shares_saves, goal.emotion]
