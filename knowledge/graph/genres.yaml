- id: genre.tutorial
  type: genre
  name: Tutorial / how-to
  summary: 'Teaches one outcome in steps. Show the finished result first, promise the number of steps, then deliver each step with a new shot
    and a step label, and close on the result again. Clarity outranks speed: let dense steps breathe.'
  when_to_use: Recipes, software tips, DIY, makeup, coding, fitness form.
  how: [Result shot in 0–2 s + promise ('3 steps to…'), 'One step per beat: step number text + action shot + 1-line VO', Pause briefly after dense
      steps, End on the result (loop seam back to the opening shot)]
  parameters: {cut_rate_per_min: 15–25 visual changes (heuristic), median_shot_s: 2–4, hook_window_s: 0–2, caption_density: speech captions +
      persistent step label, typical_length_s: 30–60}
  avoid_when: The process itself is the spectacle (use genre.transformation pacing).
