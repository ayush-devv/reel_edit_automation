- id: genre.testimonial
  type: genre
  name: Testimonial / customer review
  summary: 'A real customer or creator tells their personal story with a product or service: situation, specific result, recommendation. Trust
    beats polish, so pacing is calmer than talking-head explainers, jump cuts are hidden under proof b-roll, and emotional peaks are left uncut.'
  when_to_use: Higher-price or new-brand offers where trust is the main barrier; UGC ads; service businesses.
  how: ['Hook (0–3 s): the result or a testimonial line (''I was skeptical until…'')', 'Personal situation/problem, briefly', 'Specific, concrete
