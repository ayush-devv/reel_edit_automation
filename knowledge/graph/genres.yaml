- id: genre.talking_head
  type: genre
  name: Talking head (direct-to-camera)
  summary: 'One person speaking to lens delivers an idea, opinion or explanation. Retention rides on a spoken hook in the first second, a tight
    jump-cut rhythm, scale changes and illustrative b-roll so framing never sits still. Structure: hook, foreshadowed payoff, but/therefore body,
    abrupt payoff.'
  when_to_use: Opinion, explainer, advice, commentary, founder POV, educational creators.
  how: ['Hook (0–2 s): first word ≤0.3 s, hook text on screen by 0.3 s (playbook rules 1–2)', Foreshadow the payoff in ≤3 s (tech.loop.foreshadow_payoff),
