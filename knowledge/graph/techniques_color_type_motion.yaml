  type: technique
  name: Do not letter-space Devanagari
  summary: Positive or negative tracking and manual kerning break the continuous headline (shirorekha) that joins Devanagari letters. Keep tracking
    at 0 for Devanagari even if the Latin caption style uses wide tracking.
  when_to_use: Any Devanagari caption or title.
  how: [Force tracking=0 on Devanagari runs, Apply tracking only to Latin runs]
  parameters: {tracking: '0'}
  avoid_when: Never.
