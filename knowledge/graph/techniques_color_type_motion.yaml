- id: tech.caption.style_minimal_calm
  type: technique
  name: 'Caption style: minimal calm (aesthetic/emotional)'
  summary: Small lowercase or sentence-case light/regular weight, generous spacing, short phrases, slow 300-500 ms fades, no highlight effects,
    soft shadow only. Suits calm vlogs, wellness, emotional or premium-aesthetic content.
  when_to_use: Slow-paced vlogs, travel, wellness, emotional storytelling, premium brands.
  how: [Light/regular weight, Lowercase or sentence case, 'Fade in/out 300-500 ms, ease-in-out', Lower third or centred in negative space]
  parameters: {font_px_at_1920: 45-65, fade_ms: 300-500}
  avoid_when: Busy backgrounds (thin weights lose contrast) or fast speech.
  genres: [genre.vlog, genre.brand_story]
