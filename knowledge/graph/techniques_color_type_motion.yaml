- id: tech.type.hindi_reading_speed
  type: technique
  name: Hindi caption reading-speed and line limits
  summary: 'Netflix''s Hindi guide allows about 22 characters per second for adults (18 for children) and 42 per line. The project gate is stricter:
    ≤ 20 chars/s for every script (ADR-0011). Count Devanagari as Unicode grapheme clusters so matras do not inflate the rate.'
  when_to_use: Devanagari captions for Hindi or Hinglish speech.
  how: [Count characters per chunk (decide grapheme vs code point consistently), Keep below 22 cps; aim lower for reels, Centre-align]
  parameters: {max_cps_adult_hi: '22', max_cps_children_hi: '18', max_chars_per_line: '42', project_max_cps: '20 (ADR-0011 gate, all scripts)'}
  avoid_when: Roman-script Hinglish captions (use English limits).
  genres: [genre.talking_head, genre.podcast_clip, genre.vlog]
