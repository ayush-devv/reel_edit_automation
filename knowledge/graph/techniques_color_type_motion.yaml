- id: tech.type.semantic_line_breaks
  type: technique
  name: Break caption lines at sense boundaries
  summary: Break after punctuation or before conjunctions/prepositions, and never separate article from noun, first from last name, or verb from
    its auxiliary or negation. In two-line captions prefer a bottom-heavy shape.
  when_to_use: Any multi-word caption chunk, including reel phrase captions.
  how: [Chunk transcript at clause/phrase boundaries, Reject breaks that split grammatical pairs, Avoid 1-2 orphan words on the top line]
  parameters: {shape: bottom-heavy pyramid for 2 lines}
  avoid_when: Single-word kinetic captions.
  genres: [genre.talking_head, genre.tutorial, genre.interview, genre.podcast_clip]
  goals: [goal.clarity]
  uses_capabilities: [cap.text.auto_captions]
  conflicts_with: []
