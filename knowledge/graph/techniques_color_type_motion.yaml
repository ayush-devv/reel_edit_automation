- id: tech.type.word_by_word_captions
  type: technique
  name: Word-by-word (karaoke) captions
  summary: Reveal or highlight each word as it is spoken. Widely used on short-form for energy and to anchor attention; vendor claims of retention
    lifts exist but no controlled study was found, so treat it as a style choice rather than a proven win.
  when_to_use: High-energy talking heads, podcast clips, hooks in the first seconds.
  how: [Get word-level timestamps, Show current chunk; highlight active word (colour or scale), Keep chunk static while words highlight to avoid
      jitter]
  parameters: {highlight_change: 'on word onset, 0-80 ms transition', chunk_words: 2-4}
  avoid_when: Calm/emotional pieces; long reading-heavy captions; viewers with motion sensitivity.
