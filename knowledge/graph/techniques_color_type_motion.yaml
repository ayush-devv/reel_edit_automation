- id: tech.caption.style_editorial_kinetic
  type: technique
  name: 'Caption style: editorial kinetic (brand/testimonial)'
  summary: 'Designed typography rather than subtitles: 1-4 words, mixed sizes and weights, the key word much larger, placed beside the face, often
    a serif or display accent paired with a sans, continuing over b-roll. Suits brand stories and testimonials.'
  when_to_use: Founder/customer testimonials, brand films, agency showcase reels.
  how: [Pair display/serif accent with neutral sans, Enlarge key word 1.5-2x, Place in free space beside face, Ease-out entrances 200-300 ms;
      staggered words 40-80 ms]
  parameters: {key_word_scale: 1.5-2.0x, entrance_ms: 200-300, stagger_ms: 40-80}
  avoid_when: Fast-paced podcast clips where text must keep up with dense speech.
  genres: [genre.testimonial, genre.brand_story, genre.product]
  goals: [goal.brand_recall, goal.emotion, goal.watch_through]
  uses_capabilities: [cap.text.kinetic, cap.text.keyword_emphasis, cap.graphics.motion_easing, cap.analysis.face_detection]
