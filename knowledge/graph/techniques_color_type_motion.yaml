- id: tech.color.hero_shot_match
  type: technique
  name: Grade a hero shot, then match others to it
  summary: Pick the most representative clip (usually the main talking-head angle), finalise its correction and look, then match every other clip
    to it — brightness and contrast first, then colour balance, then saturation.
  when_to_use: Any reel combining multiple angles, phones or lighting setups.
  how: [Choose hero clip, Display hero and target side by side or split-screen, Match luma levels on waveform first, Then match parade balance,
    Then saturation/vectorscope extent, Copy look node to all clips]
  parameters: {match_order: brightness -> contrast -> balance -> saturation}
  avoid_when: Deliberate look change between sections (e.g. interview vs b-roll two-tone).
  genres: [genre.interview, genre.podcast_clip, genre.talking_head, genre.event_recap, genre.testimonial]
  goals: [goal.trust, goal.watch_through]
  uses_capabilities: [cap.color.shot_match, cap.analysis.scopes, cap.compositing.adjustment_layer]
