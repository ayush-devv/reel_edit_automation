  type: technique
  name: 'Caption style: bold pop (high energy)'
  summary: Heavy sans (Black weight), 1-3 words, centred in lower-middle band, white with dark stroke, active word in one accent colour with a
    quick scale pop. Suits hype, podcasts and fast talking heads.
  when_to_use: Energetic talking heads, podcast clips, motivational and hook segments.
  how: ['Black-weight sans, title or upper case', Word-by-word highlight, 'Pop: scale 0.9 -> 1.05 -> 1.0 over ~120-180 ms with ease-out', Stroke
      or shadow for contrast]
  parameters: {font_px_at_1920: 80-110, pop_duration_ms: 120-180, overshoot_scale: 1.05-1.12, accent_colours: '1'}
  avoid_when: Calm, emotional or premium-brand pieces.
  genres: [genre.podcast_clip, genre.talking_head, genre.vlog]
  goals: [goal.energy, goal.retention_first_3s]
