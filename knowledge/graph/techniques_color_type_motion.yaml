- id: tech.color.broadest_tool_first
  type: technique
  name: Broadest tool first, narrowest last
  summary: Fix problems with the widest-acting control that works — primaries, then curves, then hue-vs-hue curves, then an HSL qualifier or window.
    Narrow secondaries are fragile, flicker on moving footage and are easy to overdo.
  when_to_use: Whenever a correction is needed on skin, sky or a product colour.
  how: [Try primaries, Then custom curves, Then hue-vs-hue/sat curves, 'Qualifier last: start from luminance, set ranges manually, use as few
      keys as possible']
  parameters: {order: primaries -> curves -> hue curves -> qualifier/window}
  avoid_when: A specific object (logo/product) must hit an exact brand colour — a targeted secondary is justified.
  genres: [genre.talking_head, genre.product, genre.brand_story]
  goals: [goal.trust]
  uses_capabilities: [cap.color.white_balance, cap.color.color_wheels, cap.color.rgb_curves, cap.color.hue_sat_curves, cap.color.hsl_qualifier]
  conflicts_with: []
  requires: [principle.color.correct_before_grade]
  evidence_level: practitioner
  confidence: high
  sources:
  - {title: 5 Tips for Getting Perfect Skin Tones in DaVinci Resolve, author: Frame.io Insider, url: 'https://blog.frame.io/2020/10/05/skin-tones-in-davinci-resolve/',
    locator: 'Tip 3: use the broadest tools first'}
  drafts: [drafts/graph_color_type_motion.yaml]
- id: tech.color.chart_based_match
  type: technique
  name: Chart-based camera matching
  summary: When a colour chart was shot under the scene lighting on each device, use chart-based colour match to get cameras to a common baseline,
    then finish by eye. Without a chart, automatic 'match' is little better than auto-colour.
  when_to_use: Planned multi-camera/phone shoots where a chart can be filmed.
  how: [Shoot chart well-exposed in the scene light per camera, Set correct source gamma/colour space, Run chart match, Refine manually on the
      hero shot]
  parameters: {chart_exposure: 'well lit, filling a reasonable part of frame'}
  avoid_when: No chart available — use hero-shot matching instead.
  genres: [genre.interview, genre.podcast_clip, genre.event_recap]
  goals: [goal.trust]
  uses_capabilities: [cap.color.shot_match]
  conflicts_with: []
  requires: [tech.color.input_transform_first]
