- id: tech.color.hdr_to_sdr_tonemap
  type: technique
  name: Tone-map HDR phone footage to Rec.709 SDR for social
  summary: Convert HLG/PQ phone clips to Rec.709 with a colour-space transform that includes tone mapping and gamut mapping, then grade in SDR.
    Untreated HDR clips look washed out or clipped next to SDR clips and render inconsistently across apps.
  when_to_use: Any reel mixing iPhone HDR clips with SDR sources, or delivering SDR to Reels/Shorts/TikTok.
  how: [CST Rec.2100 HLG (or PQ) -> Rec.709 gamma 2.4 with tone mapping enabled, Enable saturation/gamut mapping, Re-balance exposure after conversion,
    Export tagged bt709 8-bit]
  parameters: {output: 'Rec.709 / BT.1886, 8-bit, tagged bt709', tone_mapping: on (e.g. DaVinci tone mapping)}
  avoid_when: 'Never skipped in this pipeline: ADR-0023 tonemaps every HDR source to bt709 SDR at ingest (HDR delivery is unsupported).'
  genres: [genre.vlog, genre.montage, genre.event_recap, genre.talking_head]
  goals: [goal.trust]
  uses_capabilities: [cap.color.hdr_tonemap, cap.color.technical_lut, cap.export.color_tagging]
