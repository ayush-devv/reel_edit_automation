- id: tech.color.creative_lut_reduced_intensity
  type: technique
  name: Apply creative LUTs after normalisation at reduced strength
  summary: A creative LUT expects normalised Rec.709 input, so place it after correction and blend it back — commonly around half strength — rather
    than at 100%. Adjust exposure/balance before the LUT, not after, because LUTs clip what they receive.
  when_to_use: Fast stylised looks across many clips.
  how: [Normalise (technical transform + balance) first, Apply creative LUT on its own node/layer, Lower node opacity / Lumetri intensity until
      skin looks natural, Re-check skin line and highlights]
  parameters: {lut_intensity: ~40-70% typical starting range (rule of thumb; no authoritative figure), placement: 'after balance, before output
      transform'}
  avoid_when: Footage is still log or HDR untransformed.
  genres: [genre.vlog, genre.montage, genre.brand_story, genre.event_recap]
  goals: [goal.brand_recall, goal.emotion]
  uses_capabilities: [cap.color.creative_lut]
  conflicts_with: [anti.color.creative_lut_on_log]
  requires: [principle.color.correct_before_grade, tech.color.input_transform_first]
  evidence_level: practitioner
  confidence: medium
