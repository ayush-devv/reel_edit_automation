- id: tech.type.kinetic_for_emotion
  type: technique
  name: Kinetic typography to convey tone and direct attention
  summary: 'Animating text properties over time (scale, position, timing, rhythm) can convey emotion and guide attention beyond what static text
    does. Match motion character to the emotion: quick, bouncy for excitement; slow, smooth for calm or sadness.'
  when_to_use: Talking heads with long static shots, brand stories, hooks.
  how: [Pick a motion vocabulary per emotion, Animate on speech rhythm, 'Keep readable: motion settles before the word must be read']
  parameters: {settle_before_read_ms: <=200-300 (heuristic)}
  avoid_when: Information-dense captions; motion-sensitive audiences.
  genres: [genre.testimonial, genre.brand_story, genre.talking_head]
