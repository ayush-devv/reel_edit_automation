- id: tech.color.look_teal_orange
  type: technique
  name: Teal-and-orange complementary look
  summary: Shift shadows and environment toward teal while keeping skin and warm highlights orange, using complementary contrast to separate people
    from backgrounds. Effective and popular, but easy to overdo and can oversaturate deeper skin tones.
  when_to_use: Energetic lifestyle, travel, brand and promo reels needing a cinematic polish.
  how: [Cool shadows/mids slightly toward teal, Protect skin with a qualifier or hue curve, Keep skin on the skin line, Reduce intensity for deeper
      complexions]
  parameters: {strength: subtle-moderate; skin must remain on skin line}
  avoid_when: Deep skin tones without skin protection; product shots needing accurate colour; overused aesthetic for the brand.
  genres: [genre.vlog, genre.brand_story, genre.montage, genre.event_recap]
  goals: [goal.emotion, goal.energy]
  uses_capabilities: [cap.color.color_wheels, cap.color.hsl_qualifier, cap.color.creative_lut]
  conflicts_with: [tech.color.look_desaturated_serious]
  requires: [tech.color.skin_tone_line]
  evidence_level: practitioner
  confidence: medium
