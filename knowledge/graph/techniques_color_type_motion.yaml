- id: tech.color.input_transform_first
  type: technique
  name: Identify the source transfer and apply the matching input transform
  summary: Determine whether each clip is Rec.709 SDR, HLG HDR, Dolby Vision, Apple Log or another log profile, and apply the specific technical
    transform for it first. The container or codec does not reveal this; read metadata.
  when_to_use: Every ingest, especially iPhone footage (default HDR HLG/Dolby Vision on recent models) mixed with SDR clips.
  how: [Probe colour primaries/transfer metadata (e.g. ffprobe color_transfer arib-std-b67 = HLG), Map each source to the working space with its
      own transform, Never reuse an HLG transform on Apple Log]
  parameters: {hlg_flag: color_transfer=arib-std-b67, pq_flag: color_transfer=smpte2084, sdr_flag: bt709}
  avoid_when: Never skipped for mixed-source projects.
  genres: [genre.vlog, genre.talking_head, genre.montage, genre.event_recap]
  goals: [goal.trust]
  uses_capabilities: [cap.color.technical_lut, cap.analysis.probe_metadata]
