- id: tech.type.text_carries_long_shot
  type: technique
  name: Let kinetic text carry a long static shot
  summary: Instead of cutting away, a long talking shot can stay engaging by changing text every phrase — new words, sizes and positions provide
    the visual novelty that cuts would otherwise supply.
  when_to_use: Strong performance you don't want to cut; few b-roll options.
  how: [Change text chunk every ~0.5-1.5 s, Vary size/position within a consistent system, Add subtle punch-ins at phrase starts if needed]
  parameters: {text_change_interval_s: 0.5-1.5}
  avoid_when: Text would cover the face or the shot is visually weak anyway.
  genres: [genre.testimonial, genre.talking_head, genre.brand_story]
  goals: [goal.watch_through]
  uses_capabilities: [cap.text.kinetic, cap.transform.punch_in]
