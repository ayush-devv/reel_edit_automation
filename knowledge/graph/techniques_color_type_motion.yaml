- id: tech.type.keyword_emphasis
  type: technique
  name: Emphasise one key word per chunk
  summary: Build hierarchy by enlarging, bolding or colouring the single most meaningful word (noun/verb/number) while the rest stays neutral.
    One accent per chunk keeps emphasis meaningful; emphasising everything emphasises nothing.
  when_to_use: Hooks, claims, numbers, brand names, punchlines.
  how: ['Pick keyword via transcript analysis (numbers, named entities, contrastive words)', Scale 1.3-2x or switch to heavier weight, Use one
      brand accent colour, Keep other words neutral white]
  parameters: {scale_factor: 1.3-2.0x (heuristic), accent_colours: 1 (max 2), max_enlarged_words_per_line: 1 (ADR-0011 gate)}
  avoid_when: Every chunk already emphasised — skip to restore contrast.
  genres: [genre.talking_head, genre.testimonial, genre.brand_story, genre.tutorial]
