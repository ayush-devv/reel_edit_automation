- id: tech.color.exposure_on_waveform
  type: technique
  name: Set exposure and contrast on the waveform
  summary: Place black point just above legal minimum, keep specular highlights below legal maximum, and let faces sit in the upper-middle of
    the range. Set contrast before saturation, because saturation perception rises with contrast.
  when_to_use: First primary adjustment on every clip.
  how: [Lift/lower shadows until darkest detail sits just above floor, Set gain so highlights stop short of clipping, Adjust gamma/mids for face
      brightness, Then add contrast via curve]
  parameters: {legal_range_10bit: 64-940, legal_range_8bit: 16-235, face_luma_ire: '~50-70 IRE typical (practitioner convention, not from the
      cited page)'}
  avoid_when: Deliberately crushed or high-key stylised looks (still keep legal range on export).
  genres: [genre.talking_head, genre.interview, genre.testimonial, genre.product]
  goals: [goal.clarity, goal.trust]
  uses_capabilities: [cap.color.exposure, cap.color.rgb_curves, cap.analysis.scopes]
  conflicts_with: []
  requires: [tech.color.scope_roles]
  evidence_level: practitioner
  confidence: medium
