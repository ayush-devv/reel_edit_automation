- id: tech.color.aroll_broll_two_tone
  type: technique
  name: Distinct but consistent A-roll / B-roll palettes
  summary: Grade the talking-head A-roll and the illustrative B-roll as two consistent families (e.g. warm interview, cooler b-roll) so cuts between
    them feel designed rather than mismatched.
  when_to_use: Testimonials and brand stories alternating speaker and b-roll.
  how: [Group A-roll and B-roll separately, Give each group one look, Keep complementary relationship (warm vs cool), Keep skin consistent wherever
      faces appear]
  parameters: {groups: '2'}
  avoid_when: Single continuous scene where a palette shift would read as an error.
  genres: [genre.testimonial, genre.brand_story, genre.interview]
  goals: [goal.brand_recall, goal.emotion]
  uses_capabilities: [cap.compositing.adjustment_layer, cap.color.color_wheels]
