- id: tech.caption.style_clean_phrase
  type: technique
  name: 'Caption style: clean phrase (clarity)'
  summary: Medium/semibold sans, sentence case, 1-2 line phrases on a semi-opaque box or soft shadow, simple cut or 100-150 ms fade, fixed position.
    Prioritises readability for tutorials, explainers and interviews.
  when_to_use: Tutorials, product explainers, interviews, information-dense speech.
  how: ['Semibold sans, sentence case', Phrase chunking with semantic breaks, Box at 60-80% opacity or soft shadow, Stable lower-third position
      inside safe zone]
  parameters: {font_px_at_1920: 55-75, lines: 1-2, fade_ms: 0-150}
  avoid_when: Hype edits that need visual rhythm.
  genres: [genre.tutorial, genre.product, genre.interview]
  goals: [goal.clarity, goal.trust]
  uses_capabilities: [cap.text.auto_captions, cap.text.background_box]
