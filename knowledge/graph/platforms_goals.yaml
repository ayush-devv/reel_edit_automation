- id: goal.watch_through
  type: goal
  name: Watch-through (completion and average view duration)
  summary: Keep viewers watching to the payoff. Average view duration and completion are the strongest correlates of distribution in the drafts'
    platform data, and hold time matters more than nominal length, so trim anything that does not move the story.
  when_to_use: Every reel; the main body-pacing target.
  how: ['Measure: average view duration, % viewed, retention curve drops', 'Proxy pre-publish: no dead air, a re-hook or new point every few seconds,
      payoff placed before the drop-off']
  parameters: {metrics: 'average_view_duration, completion_rate'}
