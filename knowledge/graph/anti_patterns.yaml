- id: anti.cut.eye_trace_whiplash
  type: anti_pattern
  name: Eye-trace whiplash
  summary: Consecutive short shots whose subjects sit in opposite parts of the frame, forcing the eye to search on every cut. Viewers lose the
    subject and the montage feels noisy, especially on a small vertical screen.
  when_to_use: 'Detect: salient point jumps by more than ~half the frame across sub-1.5 s shots (derived).'
  how: [Reframe to align subjects, Reorder shots so subject positions progress gradually, Lengthen shots that require a big eye move]
  parameters: {}
  avoid_when: Intentional chaos (fight, glitch aesthetic).
  genres: [genre.montage, genre.event_recap, genre.product]
  goals: [goal.clarity, goal.watch_through]
  uses_capabilities: [cap.analysis.subject_tracking, cap.transform.auto_reframe]
  conflicts_with: [principle.cut.eye_trace]
  requires: []
