- id: anti.continuity.axis_flip
  type: anti_pattern
  name: Accidental axis flip
  summary: Cutting between camera angles (or mirrored/reframed crops) that put a speaker facing the opposite direction, making people seem to
    swap places. Common when auto-reframing multi-cam podcasts to 9:16 or mirroring selfie footage.
  when_to_use: 'Detect: a speaker''s facing direction changes across a cut with no bridge shot.'
  how: [Pick the angle that keeps facing consistent, Insert a neutral/frontal shot as a bridge, Undo unintended horizontal flips]
  parameters: {}
  avoid_when: Deliberate disorientation.
  genres: [genre.interview, genre.podcast_clip, genre.vlog]
  goals: [goal.clarity]
  uses_capabilities: [cap.analysis.gaze_estimation, cap.transform.flip_mirror]
  conflicts_with: [principle.continuity.axis_180]
  requires: []
  evidence_level: theory
  confidence: high
  sources:
