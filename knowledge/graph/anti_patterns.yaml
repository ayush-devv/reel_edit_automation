- id: anti.cut.broll_wallpaper
  type: anti_pattern
  name: B-roll wallpaper
  summary: Generic or loosely related B-roll laid over speech just to hide cuts or fill time. It adds no information, can contradict the words,
    and through the Kuleshov effect may assign unintended meaning to the speaker.
  when_to_use: 'Detect: B-roll with low semantic relevance to the concurrent transcript.'
  how: [Match B-roll to specific nouns/actions in the line, Prefer inserts of the real subject over stock, Use a punch-in instead if no relevant
      B-roll exists]
  parameters: {}
  avoid_when: ''
  genres: [genre.talking_head, genre.interview, genre.testimonial, genre.brand_story]
  goals: [goal.clarity, goal.trust]
  uses_capabilities: [cap.cut.b_roll_cutaway, cap.analysis.transcription]
  conflicts_with: [tech.cut.cutaway_cover]
  requires: []
