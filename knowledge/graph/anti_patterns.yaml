- id: anti.ending.outro_card
  type: anti_pattern
  name: Outro card / 'thanks for watching' tail
  summary: Logo outros, subscribe cards and sign-offs after the payoff give viewers a reason to swipe before the loop and create a last-second
    retention cliff.
  when_to_use: 'QA: anything after the last meaningful frame.'
  how: ['Delete; if branding is required, overlay it during the payoff']
  parameters: {}
  avoid_when: A brand end card or CTA card from the brand kit (ADR-0017) is required — keep it short and ending on a musical hit (ADR-0022); what
    stays an anti-pattern is a 'thanks for watching' tail, credits or a long logo sting after the payoff.
  genres: [genre.talking_head, genre.brand_story, genre.product, genre.event_recap]
  goals: [goal.watch_through, goal.rewatch]
  uses_capabilities: [cap.trim.trim_in_out]
