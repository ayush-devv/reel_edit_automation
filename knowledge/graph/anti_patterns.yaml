- id: anti.audio.hard_audio_seams
  type: anti_pattern
  name: Hard audio seams
  summary: Audio that clicks, drops room tone, or changes level at every picture cut. Because continuous sound is a main reason cuts go unnoticed,
    audio seams expose every edit and make jump cuts feel harsher.
  when_to_use: 'Detect: silence gaps, level jumps or clicks at edit points.'
  how: [Add short crossfades, Fill gaps with room tone, Run music/ambience continuously under cuts]
  parameters: {}
  avoid_when: A deliberate hard stop for comedic or dramatic emphasis.
  genres: [genre.talking_head, genre.interview, genre.podcast_clip, genre.testimonial, genre.tutorial]
  goals: [goal.watch_through, goal.trust]
  uses_capabilities: [cap.audio.crossfade, cap.audio.room_tone]
  conflicts_with: [principle.perception.audio_hides_cuts]
  requires: []
  evidence_level: study
  confidence: medium
  sources:
  - {title: 'Match-action: the role of motion and audio in creating global change blindness in film', author: Smith & Martin-Portugues Santacreu
      (2017), url: 'https://core.ac.uk/display/42135575', locator: abstract (audio finding)}
  drafts: [drafts/graph_editing_theory.yaml]
- id: anti.brand.heavy_promo_early
  type: anti_pattern
  name: Heavy promotion or hard sell at the start
  summary: Opening with a hard sell, packshot, brand card or 'link in bio, buy now' before any value reads as an ad and invites a swipe; TikTok
    research and practitioners both report it hurts completion. A light brand mention by 5 s (tech.hook.brand_message_within_5s) is different
    and helped Meta's branded ads.
  when_to_use: QA check for product/brand videos. | QA for organic product and creator content.
  how: ['Open on person, problem or outcome; integrate brand naturally', Move the hard ask after the payoff or into a text overlay near the end]
  parameters: {}
  avoid_when: ''
  genres: [genre.product, genre.brand_story, genre.testimonial, genre.talking_head, genre.tutorial]
  goals: [goal.retention_first_3s, goal.watch_through]
  uses_capabilities: [cap.cut.reorder]
  conflicts_with: [tech.hook.brand_message_within_5s]
  requires: []
  evidence_level: platform
  confidence: medium
  sources:
  - {title: 'Pay attention to me: report shares brand tips (TikTok x CreatorIQ)', author: Marketing Brew, url: 'https://www.marketingbrew.com/stories/2023/12/18/pay-attention-to-me-report-shares-brand-tips-for-catching-users-interest-on-tiktok',
    locator: avoid heavy promotion early}
  - {title: TikTok CTA conversion guide, author: Socialkit, url: 'https://socialk.it/en/blog/tiktok-cta-conversion-guide', locator: search-result
      summary}
  merged_from: [anti.cta.hard_sell_early]
  drafts: [drafts/graph_shortform_craft.yaml]
- id: anti.color.creative_lut_on_log
  type: anti_pattern
  name: Creative LUT on un-normalised log/HDR footage
  summary: Dropping a creative LUT directly on log or HDR clips produces broken, clipped or oddly saturated colours, because the LUT expects normalised
    Rec.709 input.
  when_to_use: 'Detect: LUT applied as first operation on clips whose transfer is log/HLG/PQ.'
  how: [Insert technical transform before the LUT, Re-balance, Then re-apply look at reduced intensity]
  parameters: {}
  avoid_when: The LUT is explicitly a log-to-look LUT designed for that exact camera profile.
  genres: []
  goals: [goal.trust]
  uses_capabilities: [cap.color.creative_lut, cap.color.technical_lut]
  conflicts_with: []
  requires: []
  evidence_level: practitioner
  confidence: high
  sources:
