- id: anti.dialogue.dead_air_or_gating
  type: anti_pattern
  name: Dead air and hard-gated backgrounds
  summary: Dropping to digital silence between words, or using a hard noise gate, makes the background pop in and out with speech. Viewers notice
    the noise more, not less. Keep a continuous low background via room tone or a gentle expander with limited range.
  when_to_use: Flag when the noise floor between words falls below −70 dBFS or swings > 10 dB.
  how: [Replace digital silence with room tone, Replace gates with an expander (tech.voice.expander)]
  parameters: {flag_floor_swing_db: 10, qa_dead_air_s: '> 1.5 s fails (ADR-0006)'}
  avoid_when: ''
  genres: []
  goals: [goal.clarity, goal.trust]
  uses_capabilities: [cap.audio.room_tone, cap.audio.expander]
  conflicts_with: [tech.dialogue.room_tone_fill]
  requires: []
  evidence_level: practitioner
  confidence: high
  enforced_by: [qa_gate]
  decided_by: [ADR-0006]
  sources:
