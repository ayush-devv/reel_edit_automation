- id: anti.cut.jump_cut_fatigue
  type: anti_pattern
  name: Jump-cut fatigue
  summary: Jump cuts after every phrase with identical framing and no other variation. Each jolt is small, but the constant jarring makes the
    piece feel choppy and pulls attention off the message.
  when_to_use: 'Detect: more than ~3 consecutive same-framing jump cuts in under ~6 s (derived).'
  how: [Alternate punch-in levels, Cover some edits with B-roll or inserts, Keep a few natural pauses for breathing room]
  parameters: {flag_if_same_frame_jumps: '> 3 within 6 s (derived, low confidence)'}
