- id: anti.type.too_fast_text
  type: anti_pattern
  name: Captions faster than they can be read
  summary: Chunks that flash by above roughly 20 characters/second, or words that change faster than the eye can settle, force viewers to choose
    between reading and watching — and many will scroll.
  when_to_use: 'Detect: chunk cps > ceiling or dwell < ~0.3 s for multi-word chunks.'
  how: [Shorten text, Merge with neighbour chunk, Switch to keyword-only captions]
  parameters: {cps_ceiling: 20 for all scripts (ADR-0011 gate; external guides allow 20 EN / 22 HI)}
  avoid_when: Single short words synced to speech (fine at sub-second dwell).
  genres: []
  goals: [goal.clarity, goal.watch_through]
  uses_capabilities: [cap.text.auto_captions, cap.text.word_highlight]
  conflicts_with: []
  requires: []
