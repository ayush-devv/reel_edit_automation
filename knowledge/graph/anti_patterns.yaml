- id: anti.color.unnatural_skin
  type: anti_pattern
  name: Oversaturated, red-flushed or yellow-green skin
  summary: Over-saturated reds make skin blotchy and flushed; desaturated or yellow/green-shifted skin looks ill. Both destroy trust in talking-head
    content faster than any other colour error.
  when_to_use: 'Detect: skin trace far off the skin line or extending unusually far from vectorscope centre.'
  how: [Bring hue back toward skin line, Reduce skin saturation via hue-vs-sat or qualifier, Reduce look/LUT intensity]
  parameters: {}
  avoid_when: Never desirable unless a deliberate stylised effect.
  genres: [genre.talking_head, genre.testimonial, genre.interview]
  goals: [goal.trust]
  uses_capabilities: [cap.analysis.scopes, cap.color.hue_sat_curves, cap.color.saturation_vibrance]
