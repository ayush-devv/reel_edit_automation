- id: anti.color.scope_chasing
  type: anti_pattern
  name: Grading to the numbers instead of the picture
  summary: Forcing every face exactly onto the skin line or every trace into a fixed range ignores lighting intent and complexion variety; if
    a shot looks right, it does not need correcting just to satisfy a scope.
  when_to_use: 'Detect: automated corrections that push intentionally stylised shots back to neutral.'
  how: ['Use scopes to catch errors, not to define the look', Only correct when deviation is visible or out of legal range]
  parameters: {}
  avoid_when: QC/legal checks, where numbers do rule.
  genres: []
  goals: [goal.emotion]
  uses_capabilities: [cap.analysis.scopes]
  conflicts_with: []
  requires: []
  evidence_level: practitioner
  confidence: medium
