  parameters: {}
  avoid_when: All sources share one transfer and delivery matches it.
  genres: [genre.vlog, genre.montage, genre.event_recap]
  goals: [goal.trust]
  uses_capabilities: [cap.color.hdr_tonemap, cap.analysis.probe_metadata]
  conflicts_with: []
