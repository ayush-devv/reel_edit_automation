- id: anti.color.mixed_hdr_sdr_untreated
  type: anti_pattern
  name: Mixing untreated HDR and SDR clips
  summary: Placing raw iPhone HDR (HLG/Dolby Vision) clips next to SDR clips without conversion causes shots that look washed out, overly bright
    or differently coloured on different apps and devices.
  when_to_use: 'Detect: timeline contains clips with differing color_transfer metadata.'
