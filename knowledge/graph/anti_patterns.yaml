    emphasis stops working when everything is emphasised.
  when_to_use: 'Detect: >2 families, >2 accent colours, or >2 decorations on a caption style.'
  how: [Reduce to one family (+1 accent), One accent colour, One legibility treatment]
  parameters: {max_families: '2', max_accent_colours: '2'}
  avoid_when: Deliberate maximalist/meme aesthetic for comedy.
