- id: anti.cta.end_only
  type: anti_pattern
  name: CTA only after the video has effectively ended
  summary: Parking the only CTA in the final seconds reaches just the minority who finish, and a separate end card adds a dead tail. Wistia's
    data showed end-placed CTAs converting worst of three positions.
  when_to_use: QA for conversion-goal videos.
  how: [Add an earlier light CTA (tech.cta.before_dropoff) or overlay the final CTA on the payoff]
  parameters: {}
  avoid_when: ''
  genres: [genre.product, genre.tutorial, genre.testimonial]
  goals: [goal.cta_conversion]
  uses_capabilities: [cap.graphics.cta_card]
  conflicts_with: [tech.cta.before_dropoff]
  requires: []
  evidence_level: study
  confidence: low
  sources:
