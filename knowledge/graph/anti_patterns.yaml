- id: anti.vlog.every_task
  type: anti_pattern
  name: Vlog that logs every task
  summary: Including every routine task with long holds makes day-in-the-life edits drag. Vendor guides advise filming moments that show change
    and avoiding shots held longer than about 5 s.
  when_to_use: Vlog assembly QA.
  how: ['Keep only clips that change place, mood or outcome', Cap holds at ~4–5 s unless the moment is the payoff]
