- id: anti.cut.continuity_over_emotion
  type: anti_pattern
  name: Choosing continuity over emotion
  summary: Picking the cleaner, better-matched take or cut point over the one with truer emotion. Murch and Dmytryk both rank drama above matching,
    and viewers absorbed in content rarely notice small mismatches.
  when_to_use: 'Detect in take selection: a weaker performance chosen only for match quality.'
  how: [Pick the stronger take, 'Disguise mismatches with motion, a punch-in or a cutaway']
  parameters: {}
  avoid_when: The mismatch misinforms (product, tutorial step).
  genres: [genre.testimonial, genre.interview, genre.brand_story]
  goals: [goal.emotion, goal.trust]
  uses_capabilities: [cap.trim.trim_in_out]
  conflicts_with: [principle.cut.emotion_first, principle.cut.values_over_matches]
  requires: []
  evidence_level: theory
  confidence: high
