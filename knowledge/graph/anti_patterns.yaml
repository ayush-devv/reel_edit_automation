- id: anti.duck.pumping
  type: anti_pattern
  name: Pumping music between words
  summary: A fast release lets the bed surge up in every breath and comma, so the music audibly breathes against the speech. It's distracting
    and reads as amateur.
  when_to_use: Flag when the bed rises > 6 dB in gaps shorter than 700 ms.
  how: [Lengthen release / add hold, Or replace with keyframed duck spanning the whole phrase]
  parameters: {flag_rise_db_in_short_gap: 6, short_gap_ms: 700}
  avoid_when: Deliberate EDM-style pump on a music-only montage.
  genres: []
  goals: [goal.clarity]
  uses_capabilities: [cap.audio.ducking]
  conflicts_with: [tech.duck.timing]
  requires: []
  evidence_level: practitioner
  confidence: medium
