# Hand-curated merge plan. build_kb.py applies this to knowledge/drafts/* and writes
# knowledge/capabilities.yaml and knowledge/graph/*. Never hand-edit generated files —
# edit this plan, rebuild, re-validate.
#
# ADR paths used as sources are relative to the project root.

