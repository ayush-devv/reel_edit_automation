      - {t: [4.4, 10.0], label: intro_name_title_card, approx: true}
      - {t: [10.0, 53.0], label: praise_team_usp_with_broll, approx: true}
      - {t: [53.0, 59.0], label: fast_brand_montage}
      - {t: [59.0, 73.7], label: thanks_credits_logo_url, approx: true}
    techniques:
      - {id: tech.caption.style_editorial_kinetic, at_s: null, note: "throughout; 1–4 words, key word enlarged, beside face"}
      - {id: tech.type.keyword_emphasis, at_s: null}
      - {id: tech.type.place_relative_to_face, at_s: null}
      - {id: tech.type.text_carries_long_shot, at_s: [38.28, 46.92]}
      - {id: tech.broll.new_point_new_image, at_s: null, note: "designers sketching while she says 'team'"}
      - {id: tech.rhythm.accelerating_cut_rate, at_s: [53, 59], note: "sub-1 s montage burst as proof beat"}
      - {id: tech.color.aroll_broll_two_tone, at_s: null}
      - {id: anti.ending.outro_card, at_s: [59.0, 73.7], note: "counter-example: ~15 s thanks/credits/logo tail after the payoff"}
    caption_style:
      words_per_card_range: [1, 4]
      words_per_card_median: null
      position: beside_face
      emphasis: [size, weight]
      word_by_word: false
      case: mixed
      font_class: sans_bold_mixed_weights
      runtime_with_text_pct: null
    music_sync: {music_bed: true, bpm: null, cuts_on_beat_pct: null, notes: "Montage burst likely beat-cut; unmeasured"}
    colour: {look: warm_interview_vs_teal_broll, warm_cool_ratio: null, mean_saturation: null, consistency: high}
    lessons:
      - "A long talking shot survives if text keeps changing about every second."
