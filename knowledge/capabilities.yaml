  - {title: Premiere — Export settings reference, url: 'https://helpx.adobe.com/premiere/desktop/render-and-export/export-files/overview-of-export-settings.html',
    locator: HDR}
- id: cap.analysis.scene_detection
  category: analysis
  name: Scene / shot-change detection
  description: Find where cuts occur in pre-edited or long footage so shots can be split, logged or reused.
  parameters:
  - {name: threshold, type: float, typical_range: '8–15 (scdet), 0.3–0.4 (select scene)', unit: relative}
  nle_names: {premiere: Scene Edit Detection, resolve: Scene Cut Detection, capcut: Cut scene / Scene detection, after_effects: Scene Edit Detection}
  renderer_owner: engine
  engine_tool: ffmpeg scdet / select=scene (run by the engine)
  requires_pinned_ffmpeg: false
  notes: Pre-render analysis run by the engine via ffmpeg scdet (threshold ~8 per the reference-reel protocol) or select='gt(scene,0.35)'. Fades
    and flash cuts cause misses/false positives.
  sources:
  - {title: Premiere — Detect edit points using Scene Edit Detection, url: 'https://helpx.adobe.com/premiere/desktop/edit-projects/change-clip-sequence/detect-edit-points-using-scene-edit-detection.html',
    locator: Scene Edit Detection}
  - {title: FFmpeg Filters — scdet, url: 'https://ffmpeg.org/ffmpeg-filters.html#scdet', locator: scdet}
- id: cap.analysis.silence_detection
  category: analysis
  name: Silence / pause detection
  description: Locate quiet stretches in the audio to drive pause removal and pacing.
  parameters:
  - {name: noise, type: float, typical_range: -40 to -30, unit: dB}
  - {name: duration, type: float, typical_range: 0.3–0.6, unit: s}
  nle_names: {premiere: Text-Based Editing > Pauses}
  renderer_owner: engine
  engine_tool: ffmpeg silencedetect + Silero VAD
  requires_pinned_ffmpeg: false
  notes: Pre-render analysis; level-based silencedetect is cross-checked with VAD so quiet speech is not cut.
  sources:
  - {title: FFmpeg Filters — silencedetect, url: 'https://ffmpeg.org/ffmpeg-filters.html#silencedetect', locator: silencedetect}
  - {title: Premiere — Detect and delete pauses in transcripts, url: 'https://helpx.adobe.com/premiere/desktop/edit-projects/edit-video-using-text-based-editing/detect-and-delete-pauses-in-transcripts.html',
    locator: Pauses}
- id: cap.analysis.loudness_measurement
  category: analysis
  name: Loudness measurement
  description: Measure integrated, short-term and true-peak loudness to verify the mix.
  parameters:
  - name: standard
    type: enum
    values: [ebu_r128, itu_bs1770]
  nle_names: {premiere: Loudness Radar, resolve: Loudness meter (Fairlight), final_cut: Loudness meter}
  renderer_owner: ffmpeg
  requires_pinned_ffmpeg: false
  notes: 'QA measurement on the final encoded render: ffmpeg ebur128=peak=true or loudnorm print_format=json. Gate -14 LUFS / ≤ -1.5 dBTP (ADR-0017).'
  decided_by: [ADR-0006, ADR-0017]
  sources:
  - {title: FFmpeg Filters — ebur128, url: 'https://ffmpeg.org/ffmpeg-filters.html#ebur128', locator: ebur128}
- id: cap.analysis.transcription
  category: analysis
  name: Transcription (word-level timestamps)
  description: Convert speech to text with per-word timing, the basis for captions, text editing and filler removal.
  parameters:
  - {name: model, type: string, typical_range: whisper medium/large}
  - {name: language, type: string, typical_range: auto or ISO code}
  nle_names: {premiere: Speech to Text / Transcribe, resolve: Transcribe Audio, capcut: Auto captions / Transcribe, final_cut: Transcribe to Captions}
  renderer_owner: engine
  engine_tool: mlx-whisper / Whisper (final model chosen by the ADR-0007 bake-off)
  requires_pinned_ffmpeg: false
  notes: Engine pre-render step producing word-level timestamps and confidences (not a Remotion feature; the earlier remotion label was wrong).
    Low-confidence words are proofed per ADR-0021 before captions are sendable.
  decided_by: [ADR-0007, ADR-0021]
  sources:
  - {title: Premiere — Text-Based Editing overview, url: 'https://helpx.adobe.com/premiere/desktop/edit-projects/edit-video-using-text-based-editing/overview-of-text-based-editing.html',
    locator: Transcription}
  - {title: CapCut — Transcribe video to text, url: 'https://www.capcut.com/tools/transcribe-video-to-text', locator: feature page}
  - {title: FFmpeg Filters — whisper, url: 'https://ffmpeg.org/ffmpeg-filters.html#whisper', locator: whisper}
- id: cap.analysis.filler_detection
  category: analysis
  name: Filler-word detection
  description: Flag 'um', 'uh' and similar disfluencies with timestamps in the transcript.
  parameters:
  - {name: lexicon, type: string, typical_range: language-specific filler list}
  nle_names: {premiere: Transcript filter > Filler words, capcut: Filler words}
  renderer_owner: engine
  engine_tool: transcript tokens (Whisper prompted to keep disfluencies) + Silero VAD
  requires_pinned_ffmpeg: false
  notes: Derived from cap.analysis.transcription tokens; Whisper often omits fillers unless prompted, so cross-check short voiced segments with
    VAD.
  sources:
  - {title: Premiere — Text-Based Editing overview, url: 'https://helpx.adobe.com/premiere/desktop/edit-projects/edit-video-using-text-based-editing/overview-of-text-based-editing.html',
    locator: Filler words}
- id: cap.analysis.speaker_diarization
  category: analysis
  name: Speaker identification (diarization)
  description: Label which speaker says each word, for multi-person captions and camera switching.
  parameters:
  - {name: max_speakers, type: int, typical_range: 2–4}
  nle_names: {premiere: Transcript speakers, resolve: Speaker detection (transcription)}
  renderer_owner: engine
  engine_tool: pyannote
  requires_pinned_ffmpeg: false
  notes: Engine labels who speaks when; feeds multicam/layout switching, speaker-coded captions and J/L-cut placement.
  sources:
  - {title: Premiere — Text-Based Editing overview, url: 'https://helpx.adobe.com/premiere/desktop/edit-projects/edit-video-using-text-based-editing/overview-of-text-based-editing.html',
    locator: Speakers}
- id: cap.analysis.beat_detection
  category: analysis
  name: Beat / bar detection
  description: Find beats, downbeats and song sections in music to sync cuts and effects.
  parameters:
  - name: output
    type: enum
    values: [beats, downbeats, sections]
  - {name: bpm_range, type: string, typical_range: 70–180}
  nle_names: {resolve: Detect Music Beats, final_cut: Beat Detection}
  renderer_owner: engine
  engine_tool: beat_this + librosa
  requires_pinned_ffmpeg: false
  notes: Engine builds the beat/downbeat grid, BPM, sections, clean ending points and loopable regions into music_index.json (ADR-0022). Check
    half/double-time errors.
  decided_by: [ADR-0022]
  sources:
  - {title: Final Cut Pro release notes, url: 'https://support.apple.com/en-us/102825', locator: 12.0 — Beat Detection}
  - {title: DaVinci Resolve 20 New Features Guide, url: 'https://documents.blackmagicdesign.com/SupportNotes/DaVinci_Resolve_20_New_Features_Guide.pdf',
    locator: Detect music beats}
- id: cap.analysis.subject_tracking
  category: analysis
  name: Face / subject tracking for reframing
  description: Detect and follow faces or the salient subject over time to produce a crop path for vertical reframing.
  parameters:
  - name: target
    type: enum
    values: [largest_face, active_speaker, salient_object]
  - {name: sample_rate, type: float, typical_range: 5–10 fps}
  nle_names: {premiere: Auto Reframe analysis, resolve: Smart Reframe, capcut: Auto reframe, final_cut: Smart Conform}
  renderer_owner: engine
  engine_tool: MediaPipe face detection/landmarks + pose
  requires_pinned_ffmpeg: false
  notes: Engine tracks faces and bodies per frame for reframing, caption placement and the caption-over-face gate (measured on the rendered base,
    ADR-0017). Output feeds cap.transform.auto_reframe (ffmpeg).
  decided_by: [ADR-0017]
  sources:
  - {title: Premiere Pro — Auto Reframe, url: 'https://helpx.adobe.com/premiere-pro/using/auto-reframe.html', locator: Analysis}
  - {title: Final Cut Pro User Guide — How does object tracking work, url: 'https://support.apple.com/guide/final-cut-pro/vere9b794f29/mac', locator: Machine-learning
      analysis}
- id: cap.analysis.crop_detection
  category: analysis
  name: Letterbox / crop detection
  description: Detect baked-in black bars in a source so they can be cropped before reframing.
  parameters:
  - {name: limit, type: float, typical_range: 0.08–0.12, unit: normalized}
  nle_names: {}
  renderer_owner: engine
  engine_tool: ffmpeg cropdetect (run by the engine)
  requires_pinned_ffmpeg: false
  notes: Ingest analysis for letterboxed or pillarboxed sources.
  sources:
  - {title: FFmpeg Filters — cropdetect, url: 'https://ffmpeg.org/ffmpeg-filters.html#cropdetect', locator: cropdetect}
- id: cap.analysis.scopes
  category: analysis
  name: Video scopes / signal stats
  description: Measure luminance, saturation and colour balance (waveform, vectorscope, histogram) to guide correction objectively.
  parameters:
  - name: scope
    type: enum
    values: [waveform, vectorscope, histogram, parade, stats]
  nle_names: {premiere: Lumetri Scopes, resolve: Scopes, after_effects: Lumetri Scopes, final_cut: Video Scopes}
  renderer_owner: engine
  engine_tool: ffmpeg signalstats / waveform / vectorscope (run by the engine)
  requires_pinned_ffmpeg: false
  notes: Numeric signal stats per shot (ideal for Claude) feed correction and matching; also used by colour QA (highlight clipping, skin range
    — ADR-0023).
  decided_by: [ADR-0023]
  sources:
  - {title: Premiere — Color correction workflow, url: 'https://helpx.adobe.com/premiere/desktop/correct-color/color-correction-fundamentals/color-correction-workflow.html',
    locator: Scopes}
  - {title: FFmpeg Filters — signalstats, url: 'https://ffmpeg.org/ffmpeg-filters.html#signalstats', locator: signalstats}
- id: cap.analysis.highlight_detection
  category: analysis
  name: Highlight / long-to-short clip finding
  description: Pick the most engaging segments of a long video to cut into shorts.
  parameters:
  - {name: target_length, type: float, typical_range: 15–60, unit: s}
  - {name: clips, type: int, typical_range: 3–10}
  nle_names: {capcut: Long video to shorts}
  renderer_owner: engine
  engine_tool: engine signals (transcript, VAD, faces, motion, loudness) + Claude planner selection
  requires_pinned_ffmpeg: false
  notes: Engine prepares transcript and per-segment signals; Claude (selects stage, ADR-0016) chooses the moments. Not a renderer function.
  sources:
  - {title: CapCut — Long video to shorts, url: 'https://www.capcut.com/tools/long-video-to-shorts', locator: feature page}
- id: cap.analysis.visual_search
  category: analysis
  name: Visual content search / shot tagging
  description: Find shots by what they show (objects, actions, shot type) to choose b-roll.
  parameters:
  - {name: query, type: string, typical_range: natural language}
  nle_names: {premiere: Media Intelligence / Search panel}
  renderer_owner: engine
  engine_tool: sampled frames / contact sheets + Claude vision
  requires_pinned_ffmpeg: false
  notes: Engine samples frames and builds contact sheets; Claude tags shots (content, shape/colour for match cuts). No CLIP-class model is pinned
    yet.
  sources:
  - {title: Premiere — Search media using AI (media intelligence), url: 'https://helpx.adobe.com/premiere-pro/using/media-intelligence-and-search-panel.html',
    locator: Visual search}
- id: cap.analysis.photosensitivity
  category: analysis
  name: Flash / photosensitivity check
  description: Detect rapid flashing that could trigger photosensitive viewers, and optionally damp it.
  parameters:
  - {name: frames, type: int, typical_range: '30'}
  - {name: threshold, type: float, typical_range: '1', unit: relative}
  nle_names: {}
  renderer_owner: ffmpeg
  requires_pinned_ffmpeg: false
  notes: 'QA on the render: ffmpeg photosensitivity filter. Relevant when stacking flash cuts and strobe effects (anti.motion.flashing).'
  sources:
  - {title: FFmpeg Filters — photosensitivity, url: 'https://ffmpeg.org/ffmpeg-filters.html#photosensitivity', locator: photosensitivity}
- id: cap.analysis.face_detection
  category: analysis
  name: Face detection and landmarks
  description: Find faces per frame with boxes and landmarks for reframing, caption placement and the caption-over-face check.
  parameters:
  - {name: sample_fps, type: float, typical_range: 5–30, unit: fps}
  - {name: min_confidence, type: float, typical_range: 0.5–0.8}
  nle_names: {premiere: Auto Reframe (internal), resolve: Face Refinement / Smart Reframe (internal)}
  renderer_owner: engine
  engine_tool: MediaPipe Face Detector / Face Landmarker
  requires_pinned_ffmpeg: false
  notes: Measured on the rendered base for the caption-over-face gate (ADR-0017).
  decided_by: [ADR-0017]
  sources:
  - {title: MediaPipe Face Detector guide, url: 'https://ai.google.dev/edge/mediapipe/solutions/vision/face_detector', locator: overview}
  - {title: ADR-0017 QA gate calibration, url: docs/adr/0017-council-revisions-qa-captions-audio-delivery.md, locator: §1 measure on the render}
- id: cap.analysis.pose_estimation
  category: analysis
  name: Body pose estimation
  description: Track body keypoints per frame to frame gestures, follow a moving presenter and find motion peaks for cutting in movement.
  parameters:
  - {name: sample_fps, type: float, typical_range: 10–30, unit: fps}
  nle_names: {}
  renderer_owner: engine
  engine_tool: MediaPipe Pose Landmarker
  requires_pinned_ffmpeg: false
  notes: Complements face tracking when the face is small or turned away.
  sources:
  - {title: MediaPipe Pose Landmarker guide, url: 'https://ai.google.dev/edge/mediapipe/solutions/vision/pose_landmarker', locator: overview}
- id: cap.analysis.face_expression
  category: analysis
  name: Facial expression signals
  description: Estimate expression intensity (smile, brow raise, mouth open) per frame to find reactions and emotional peaks.
  parameters:
  - {name: blendshapes, type: string, typical_range: 'smile, brow, jaw-open subsets'}
  nle_names: {}
  renderer_owner: engine
  engine_tool: MediaPipe Face Landmarker blendshapes
  requires_pinned_ffmpeg: false
  notes: Signals, not emotion labels; Claude interprets them alongside the transcript.
  sources:
  - {title: MediaPipe Face Landmarker guide, url: 'https://ai.google.dev/edge/mediapipe/solutions/vision/face_landmarker', locator: blendshapes
      output}
- id: cap.analysis.gaze_estimation
  category: analysis
  name: Gaze direction (approximate)
  description: Approximate where a subject looks from iris and head pose, to support eyeline matches and eye-trace placement.
  parameters:
  - name: output
    type: enum
    values: [left, right, up, down, camera]
  nle_names: {}
  renderer_owner: engine
  engine_tool: MediaPipe Face Landmarker iris landmarks + head pose
  requires_pinned_ffmpeg: false
  notes: Coarse direction only; not calibrated eye tracking. True visual saliency is not modelled — faces, pose and motion are used as the proxy.
  sources:
  - {title: MediaPipe Face Landmarker guide, url: 'https://ai.google.dev/edge/mediapipe/solutions/vision/face_landmarker', locator: landmarks}
- id: cap.analysis.blink_detection
  category: analysis
  name: Blink detection
  description: Detect blinks per frame so cuts can land on or near a natural blink and frozen frames avoid closed eyes.
  parameters:
  - {name: eye_closed_threshold, type: float, typical_range: 0.4–0.6 (blendshape score)}
  nle_names: {}
  renderer_owner: engine
  engine_tool: MediaPipe Face Landmarker eyeBlink blendshapes
  requires_pinned_ffmpeg: false
  notes: Also used to pick cover frames and freeze frames with open eyes.
  sources:
  - {title: MediaPipe Face Landmarker guide, url: 'https://ai.google.dev/edge/mediapipe/solutions/vision/face_landmarker', locator: blendshapes
      output}
- id: cap.analysis.voice_activity
  category: analysis
  name: Voice activity detection
  description: Mark where speech is present, independent of loudness, for pause removal, ducking and breath handling.
  parameters:
  - {name: threshold, type: float, typical_range: 0.4–0.6}
  - {name: min_silence, type: float, typical_range: 0.1–0.3, unit: s}
  nle_names: {}
  renderer_owner: engine
  engine_tool: Silero VAD
  requires_pinned_ffmpeg: false
  notes: Drives ducking envelopes and silence removal; cross-checked with ffmpeg silencedetect.
  sources:
  - {title: Silero VAD, url: 'https://github.com/snakers4/silero-vad', locator: README}
- id: cap.analysis.palette_extraction
  category: analysis
  name: Palette and look measurement
  description: Measure dominant and accent colours, luminance under the caption zone, saturation and warm/cool bias per scene.
  parameters:
  - {name: k, type: int, typical_range: 4–8}
  - {name: downscale, type: int, typical_range: 64–160, unit: px}
  nle_names: {}
  renderer_owner: engine
  engine_tool: k-means on downscaled frames (palette.json)
  requires_pinned_ffmpeg: false
  notes: ADR-0011 step 1; feeds caption style tokens when no brand kit exists (brand tokens override palette, ADR-0017).
  decided_by: [ADR-0011, ADR-0017]
  sources:
  - {title: ADR-0011 Adaptive caption & typography style engine, url: docs/adr/0011-adaptive-caption-style-engine.md, locator: Decision §1}
- id: cap.analysis.motion_estimation
  category: analysis
  name: Motion energy per shot
  description: Measure how much movement each shot contains over time to find cut-in-movement points and match shot length to motion.
  parameters:
  - {name: window, type: float, typical_range: 0.1–0.5, unit: s}
  nle_names: {}
  renderer_owner: engine
  engine_tool: ffmpeg signalstats YDIF / mestimate (run by the engine)
  requires_pinned_ffmpeg: false
  notes: Frame-difference or motion-vector magnitude; no learned optical-flow model needed.
  sources:
  - {title: FFmpeg Filters — signalstats, url: 'https://ffmpeg.org/ffmpeg-filters.html#signalstats', locator: YDIF}
- id: cap.analysis.probe_metadata
  category: analysis
  name: Media metadata probe
  description: Read container and stream metadata — frame rate, resolution, rotation, colour transfer and primaries, HDR flags, audio layout.
  parameters:
  - {name: fields, type: string, typical_range: 'color_transfer, color_primaries, r_frame_rate, side_data'}
  nle_names: {premiere: Properties, resolve: Clip Attributes}
  renderer_owner: engine
  engine_tool: ffprobe
  requires_pinned_ffmpeg: false
  notes: Ingest step; decides the input transform (HLG arib-std-b67 / PQ smpte2084 / bt709) for the ADR-0023 colour pipeline.
  decided_by: [ADR-0023]
  sources:
  - {title: ffprobe documentation, url: 'https://ffmpeg.org/ffprobe.html', locator: show_streams}
- id: cap.analysis.contrast_check
  category: analysis
  name: Text contrast check on final pixels
  description: Measure contrast between caption text and the pixels behind it on the rendered frame and flag text below the ratio.
  parameters:
  - {name: min_ratio, type: float, typical_range: '4.5', unit: ':1'}
  nle_names: {}
  renderer_owner: engine
  engine_tool: engine QA on rendered frames + overlay alpha
  requires_pinned_ffmpeg: false
  notes: ADR-0011 contrast ≥ 4.5:1, measured on final pixels per ADR-0017.
  decided_by: [ADR-0011, ADR-0017]
  sources:
  - {title: WCAG 2.1 — Contrast (Minimum), url: 'https://www.w3.org/TR/WCAG21/#contrast-minimum', locator: 1.4.3}
- id: cap.analysis.contact_sheet
  category: analysis
  name: Contact sheet / preview render
  description: Tile sampled frames from a source or render into one image so Claude can review pacing, framing and colour at a glance.
  parameters:
  - {name: interval, type: float, typical_range: 0.5–2, unit: s}
  - {name: grid, type: string, typical_range: 4x4–6x8}
  nle_names: {}
  renderer_owner: ffmpeg
  requires_pinned_ffmpeg: false
  notes: ffmpeg fps + scale + tile. Used for the Reviewer's advisory passes (ADR-0006) and reference-reel Mode A.
  decided_by: [ADR-0006]
  sources:
  - {title: FFmpeg Filters — tile, url: 'https://ffmpeg.org/ffmpeg-filters.html#tile', locator: tile}
- id: cap.analysis.mono_compatibility
  category: analysis
  name: Mono / phase compatibility check
  description: 'Check that the mix survives a mono phone speaker: phase correlation and loudness after downmix.'
  parameters:
  - {name: min_correlation, type: float, typical_range: 0–1}
  nle_names: {}
  renderer_owner: ffmpeg
  requires_pinned_ffmpeg: false
  notes: 'QA on the render: ffmpeg aphasemeter, plus ebur128 on a pan=mono downmix.'
  sources:
  - {title: FFmpeg Filters — aphasemeter, url: 'https://ffmpeg.org/ffmpeg-filters.html#aphasemeter', locator: aphasemeter}
- id: cap.analysis.retention_analytics
  category: analysis
  name: Audience retention analytics
  description: Read a published reel's retention curve and drop-off points to learn which edits held viewers.
  parameters:
  - name: metric
    type: enum
    values: [viewed_vs_swiped, average_view_duration, retention_curve]
  nle_names: {}
  renderer_owner: unsupported
  requires_pinned_ffmpeg: false
  notes: 'Unsupported pre-render: the data exists only after publishing, inside each platform''s analytics. It enters the learning loop (ADR-0027)
    as imported numbers, not as an editing capability.'
  decided_by: [ADR-0027]
  sources:
  - {title: YouTube Help — audience retention, url: 'https://support.google.com/youtube/answer/9314415', locator: audience retention report}
