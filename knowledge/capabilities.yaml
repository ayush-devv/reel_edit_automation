- id: cap.audio.dehum
  category: audio
  name: De-hum
  description: Notch out mains hum at 50 or 60 Hz and its harmonics.
  parameters:
  - name: fundamental
    type: enum
    values: ['50', '60']
  - {name: harmonics, type: int, typical_range: 3–6}
  nle_names: {premiere: DeHummer, resolve: Hum Removal}
  renderer_owner: ffmpeg
  requires_pinned_ffmpeg: false
  notes: 'ffmpeg: chain of bandreject (or equalizer with negative gain) at f0 and harmonics. Only when hum is present.'
  sources:
  - {title: FFmpeg Filters — bandreject, url: 'https://ffmpeg.org/ffmpeg-filters.html#bandreject', locator: bandreject}
- id: cap.audio.dynamic_eq
  category: audio
  name: Dynamic EQ
  description: Cut or boost a frequency band only when it exceeds a threshold, e.g. carve a speech window in music only while someone talks.
  parameters:
  - {name: frequency, type: float, typical_range: 1000–4000, unit: Hz}
  - {name: range, type: float, typical_range: -3 to -6, unit: dB}
  nle_names: {}
  renderer_owner: ffmpeg
  requires_pinned_ffmpeg: false
  notes: 'ffmpeg: adynamicequalizer (sidechain variant possible); static alternative is a volume-automated equalizer.'
  sources:
  - {title: FFmpeg Filters — adynamicequalizer, url: 'https://ffmpeg.org/ffmpeg-filters.html#adynamicequalizer', locator: adynamicequalizer}
- id: cap.audio.expander
  category: audio
  name: Downward expander
  description: Lower background noise between words gently, without the chopped sound of a hard gate.
  parameters:
  - {name: ratio, type: float, typical_range: 1.5–3}
  - {name: range, type: float, typical_range: -6 to -12, unit: dB}
  nle_names: {}
  renderer_owner: ffmpeg
  requires_pinned_ffmpeg: false
  notes: 'ffmpeg: agate with a low ratio and limited range, or compand.'
  sources:
  - {title: FFmpeg Filters — agate, url: 'https://ffmpeg.org/ffmpeg-filters.html#agate', locator: agate}
- id: cap.audio.mix
  category: audio
  name: Multitrack mix
  description: Sum voice, music, SFX and room tone stems into one mix with per-stem gain.
  parameters:
  - {name: stems, type: string, typical_range: 'voice, music, sfx, room_tone'}
  nle_names: {premiere: Audio Track Mixer, resolve: Fairlight mixer}
  renderer_owner: ffmpeg
  requires_pinned_ffmpeg: false
  notes: 'ffmpeg: amix (normalize=0) on sample-accurate segments (ADR-0023 audio graph).'
  decided_by: [ADR-0023]
  sources:
  - {title: FFmpeg Filters — amix, url: 'https://ffmpeg.org/ffmpeg-filters.html#amix', locator: amix}
- id: cap.audio.pan
  category: audio
  name: Pan / stereo placement
  description: Place a sound left or right in the stereo field, or keep speech centred.
  parameters:
  - {name: position, type: float, typical_range: -1 to 1}
  nle_names: {premiere: Pan, resolve: Pan}
  renderer_owner: ffmpeg
  requires_pinned_ffmpeg: false
  notes: 'ffmpeg: pan or stereotools. Keep dialogue centred for mono phone playback.'
  sources:
  - {title: FFmpeg Filters — pan, url: 'https://ffmpeg.org/ffmpeg-filters.html#pan', locator: pan}
- id: cap.audio.reverb
  category: audio
  name: Reverb / space
  description: Add a sense of room to a sound effect or voiceover so it sits in the scene.
  parameters:
  - {name: wet, type: float, typical_range: 0.05–0.3}
  nle_names: {premiere: Studio Reverb, resolve: Reverb}
  renderer_owner: ffmpeg
  requires_pinned_ffmpeg: false
  notes: 'ffmpeg: afir with an impulse response, or aecho for simple tails.'
  sources:
  - {title: FFmpeg Filters — afir, url: 'https://ffmpeg.org/ffmpeg-filters.html#afir', locator: afir}
- id: cap.audio.voiceover
  category: audio
  name: Recorded voiceover track
  description: Lay a separately recorded narration under the picture as the story spine.
  parameters:
  - {name: gain, type: float, typical_range: 0 ± 6, unit: dB}
  nle_names: {premiere: Voice-over record, capcut: Voiceover}
  renderer_owner: ffmpeg
  requires_pinned_ffmpeg: false
  notes: The VO file is a provided asset processed by the voice chain and mixed by ffmpeg. Synthetic narration would be cap.audio.tts_voiceover,
    which needs an external TTS service.
  sources:
  - {title: FFmpeg Filters — amix, url: 'https://ffmpeg.org/ffmpeg-filters.html#amix', locator: amix}
- id: cap.text.title
