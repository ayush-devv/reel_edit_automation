  nle_names: {premiere: Morph Cut, resolve: Smooth Cut, final_cut: Flow}
  renderer_owner: unsupported
  requires_pinned_ffmpeg: false
  notes: 'Unsupported: needs dense optical-flow warping between non-adjacent frames; our face landmarks (MediaPipe) do not provide this and no
    warping model is in the stack. Use cap.transform.punch_in alternation or a b-roll cover instead.'
  sources:
