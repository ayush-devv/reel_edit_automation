  notes: -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv, with explicit in/out matrices on every scale/lut3d/overlay
    (ADR-0023). Mismatches cause washed-out uploads; QA checks brand swatch ΔE through the overlay path.
  decided_by: [ADR-0023]
  sources:
  - {title: Premiere — Export settings reference, url: 'https://helpx.adobe.com/premiere/desktop/render-and-export/export-files/overview-of-export-settings.html',
    locator: Color settings}
- id: cap.export.alpha_overlay
