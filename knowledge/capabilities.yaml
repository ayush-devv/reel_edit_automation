  parameters:
  - name: codec
    type: enum
    values: [prores_4444, vp9_alpha, png_sequence]
  nle_names: {after_effects: Render Queue > RGB + Alpha, resolve: Export Alpha, premiere: Render alpha (ProRes 4444), final_cut: ProRes 4444 with
