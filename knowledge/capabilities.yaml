  parameters:
  - name: format
    type: enum
    values: [hdr10, hlg, dolby_vision]
  nle_names: {premiere: HDR export, resolve: Deliver HDR, final_cut: HEVC 10-bit HDR}
  renderer_owner: unsupported
  requires_pinned_ffmpeg: false
  notes: 'Unsupported by decision: ADR-0023 tonemaps all HDR sources to bt709 SDR at ingest; Remotion overlays are sRGB/SDR and there is no colour-managed
