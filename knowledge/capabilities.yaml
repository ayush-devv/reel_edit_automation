  - {title: Premiere — Export settings reference, url: 'https://helpx.adobe.com/premiere/desktop/render-and-export/export-files/overview-of-export-settings.html',
    locator: Render alpha channel}
- id: cap.export.multi_version
  category: export
  name: Multi-format versioning
  description: Produce several deliverables (aspect ratios, with/without captions, lengths) from one edit.
  parameters:
  - {name: versions, type: string, typical_range: 'list of {aspect, captions, max_len}'}
  nle_names: {premiere: Auto Reframe Sequence copies, resolve: Render queue jobs, final_cut: Duplicate project as / Smart Conform}
  renderer_owner: ffmpeg
