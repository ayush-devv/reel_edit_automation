[project]
name = "reel"
version = "0.1.0"
description = "Claude-driven professional reel editor — engine"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
reel = "reel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs the pinned ffmpeg build (skipped when missing)",
]
