[project]
name = "reel"
version = "0.1.0"
description = "Claude-driven professional reel editor — engine"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "opentimelineio>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
perception = [
    "librosa>=0.11",
    "mediapipe>=1.2.3",
    "mlx-whisper>=0.4.3",
    "onnxruntime>=1.32.0",
    "rapidocr-onnxruntime>=1.4.4",
    "scenedetect[opencv-headless]>=0.7.3",
    "silero-vad>=6.2.3",
    "soundfile>=0.14.0",
]
bakeoff = [
    "cactus-compute==4.2.5",
    "onnx-asr>=0.12",
    "transformers>=4.57",
    "torch>=2.8",
    "huggingface-hub>=0.35",
]

[project.scripts]
reel = "reel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs the pinned ffmpeg build (skipped when missing)",
]
